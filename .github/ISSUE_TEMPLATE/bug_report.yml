name: Ошибка TESSA Matrix Studio
description: Сообщить о проблеме при установке, выгрузке, проверке или применении Excel
title: "[Ошибка] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Репозиторий публичный. Не прикладывайте внутренние ссылки TESSA, ФИО, названия контрагентов, GUID карточек, Excel-файлы или JSON-отчёты с данными, которые нельзя размещать в GitHub.

        Перед отправкой повторите проблему на свежей выгрузке Excel, если это безопасно и не требует повторного применения изменений.

  - type: input
    id: version
    attributes:
      label: Версия TESSA Matrix Studio
      placeholder: 1.9.40
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Браузер
      options:
        - Google Chrome
        - Mozilla Firefox
        - Microsoft Edge
        - Brave / другой Chromium
        - Другое
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: Сценарий
      options:
        - Установка / запуск Studio
        - Tampermonkey — проверка / автообновление Studio
        - Скачать Excel
        - Выбрать Excel — XLSX отклонён / ZIP security
        - Выбрать Excel — XLSX отклонён / SpreadsheetML security
        - Выбрать Excel — Excel автоматически преобразовал значение в дату
        - Выбрать Excel — формула / shared formula / scientific / процент / дробь / ведущие нули
        - PATCH — изменить существующую строку
        - ADD — добавить новую строку
        - REPLACE — вставить поверх существующей строки
        - DELETE — удалить строку
        - Связанный UPDATE/ADD → DELETE
        - Preview — preflight / ПРОПУСТИТЬ / счётчики Apply
        - Preview — не применять / вернуть изменение
        - Preview — большой план / фильтр / поиск / страницы
        - Stop / partial / cancelled Apply
        - Apply — слишком большой пакет / лимит операций
        - Apply — результат / source-skipped строки
        - Apply — обновление отображения после записи
        - Проверка результата после Apply
        - Справочник / поиск значения
        - Актуализировать выбранный Excel
        - Применить к TESSA
        - Другое
    validations:
      required: true

  - type: input
    id: preview
    attributes:
      label: Счётчики preview
      description: Укажите только числа, без данных строк.
      placeholder: изменить 1 / добавить 0 / удалить 0 / без изменений 132 / пропустить 0
    validations:
      required: false

  - type: input
    id: step
    attributes:
      label: На каком шаге возникла ошибка
      placeholder: Проверить изменения / Применить к TESSA / после Ctrl+R
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
      description: Кратко опишите ожидаемый результат.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что произошло
      description: Укажите точный текст ошибки и безопасные обезличенные детали. Для «XLSX отклонён» достаточно текста отказа без самого Excel-файла.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Шаги для повторения
      description: Перечислите действия от свежей выгрузки до ошибки без внутренних ссылок и конфиденциальных данных.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил проблему на свежей выгрузке Excel либо указал, почему повторять применение небезопасно.
          required: true
        - label: Я удалил из описания внутренние ссылки, ФИО, GUID и другие данные, которые нельзя публиковать.
          required: true

  - type: textarea
    id: attachments
    attributes:
      label: Дополнительные материалы
      description: Можно приложить только обезличенный скриншот или фрагмент ErrorReport JSON без внутренних данных.
