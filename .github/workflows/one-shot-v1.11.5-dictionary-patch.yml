name: One-shot v1.11.5 dictionary patch

on:
  push:
    branches: [fix/v1.11.5-column-dictionaries]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.11.5-column-dictionaries
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply exact source patch
        run: node tools/apply-v1.11.5-column-dictionaries.mjs
      - name: Stage synchronized release metadata for verification
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/1\.11\.4/1.11.5/g' package.json package-lock.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify focused regression
        run: node tests/function-role-type-catalog.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Commit verified production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --quiet && { echo "No production change generated"; exit 1; }
          git commit -m "fix: give live matrix functions independent role dictionaries"
          git push origin HEAD:fix/v1.11.5-column-dictionaries
