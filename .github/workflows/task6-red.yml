name: RED Task6 performance UAT

on:
  push:
    branches: [feat/incremental-performance-v1.14]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify performance UAT RED
        run: node tests/performance-uat.mjs
