name: GREEN Task6 performance UAT

on:
  push:
    branches: [feat/incremental-performance-v1.14]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair Task6 patch syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/patch-task6-performance-uat.mjs')
          lines = p.read_text(encoding='utf-8').splitlines()
          replacement = r"  diagnostics += '\n\n' + marker + '\n\nВстроенная диагностика дополнительно запускает локальный **read-only** benchmark planner-а. Он не вызывает серверные операции записи и не изменяет карточки TESSA.\n\nПроверяются сценарии: 0 изменений; 1/10/100 ADD; 1/10 UPDATE; 1 DELETE; mixed 10; 3000 KEEP + 1 ADD; 3000 KEEP + 1 UPDATE. Для каждого сценария фиксируются время planner-а, число строк, прошедших полную validation, число mutation/preflight-строк и baseline fast-path hits.\n\nВ ZIP диагностики добавляются `performance/performance-uat.json` и `performance/performance-uat-summary.json`. Поля `liveTimings` берутся только из реально накопленной telemetry текущей вкладки (например, `preflight.targeted` / `reconcile.targeted`) и не подменяются synthetic-замерами. Поэтому до live UAT нельзя интерпретировать synthetic planner timings как подтверждённое ускорение сервера TESSA.\n';"
          matches = [i for i, line in enumerate(lines) if line.startswith('  diagnostics += `')]
          if len(matches) != 1:
              raise SystemExit(f'expected one diagnostics append line, got {len(matches)}')
          lines[matches[0]] = replacement
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          node --check tools/patch-task6-performance-uat.mjs
      - name: Apply performance UAT implementation
        run: node tools/patch-task6-performance-uat.mjs
      - name: Verify Task6 contract
        run: node tests/performance-uat.mjs
      - name: Verify performance and diagnostics regressions
        run: |
          node tests/incremental-large-matrix.mjs
          node tests/performance-telemetry.mjs
          node tests/reconciliation-performance.mjs
          node tests/preview-performance.mjs
          node tests/studio-diagnostics.mjs
          node tests/studio-interval-bundle.mjs
          node tests/full-uat-runner-contract.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No implementation diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json docs/STUDIO-DIAGNOSTICS.md tools/patch-task6-performance-uat.mjs
          git commit -m "feat: add performance UAT diagnostics"
          git push
