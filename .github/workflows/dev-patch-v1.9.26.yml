name: Dev Patch v1.9.26

on:
  push:
    branches: [fix/excel-coercion-v1.9.26]
    paths:
      - '.github/workflows/dev-patch-v1.9.26.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/excel-coercion-v1.9.26
      - name: Apply patch
        run: python .github/scripts/patch-v1.9.26.py
      - name: Focused regression
        run: node tests/xlsx-coercion.mjs
      - name: Commit production patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/patch-v1.9.26.py .github/workflows/dev-patch-v1.9.26.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js .github/scripts/patch-v1.9.26.py .github/workflows/dev-patch-v1.9.26.yml
          git commit -m 'fix: fail closed on Excel coercion and formulas'
          git push origin HEAD:fix/excel-coercion-v1.9.26
