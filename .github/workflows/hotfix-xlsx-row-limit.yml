name: Hotfix XLSX Row Limit

on:
  push:
    branches: [hotfix/xlsx-row-limit]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/xlsx-row-limit
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply hotfix
        run: node tools/apply-xlsx-row-limit-hotfix.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Targeted regression
        run: node tests/xlsx-spreadsheetml-security.mjs
      - name: Full regression
        run: npm test
      - name: Commit generated userscript
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tessa-matrix-studio.user.js; then
            echo "Userscript already contains the hotfix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git commit -m "fix: allow full Excel worksheet row range"
          git push origin HEAD:hotfix/xlsx-row-limit
