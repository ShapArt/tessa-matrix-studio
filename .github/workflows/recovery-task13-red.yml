name: v1.14 Recovery Task13 RED

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]

permissions:
  contents: read

jobs:
  task13-red:
    if: contains(github.event.head_commit.message, '[task13-red]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: RED - selective service-sheet inflation
        run: node tests/recovery-task13-selective-xlsx.mjs
