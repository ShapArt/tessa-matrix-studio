name: Temporary v1.9.20 preview preflight patch

on:
  push:
    branches:
      - fix/preview-preflight-v1.9.20
    paths:
      - scripts/patch-preview-preflight-v1.9.20.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/preview-preflight-v1.9.20
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply production patch
        run: python3 scripts/patch-preview-preflight-v1.9.20.py
      - name: Full regression suite
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit patch and remove helper
        run: |
          rm -f scripts/patch-preview-preflight-v1.9.20.cjs scripts/patch-preview-preflight-v1.9.20.py .github/workflows/patch-preview-preflight-v1.9.20.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: surface preflight skips during Preview"
          git push origin HEAD:fix/preview-preflight-v1.9.20
