name: v1.14 Full UAT write policy GREEN

on:
  push:
    branches: [fix/v1.14-live-uat-autoconfirm-6fail]

permissions:
  contents: write

jobs:
  green:
    if: contains(github.event.head_commit.message, '[full-uat-green]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply focused production patch
        run: node tools/patch-full-uat-write-policy.mjs
      - name: Focused regressions on canonical source
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/full-uat-write-policy.mjs
          node tests/full-uat-runner-contract.mjs
          node tests/main-matrix-save-contract.mjs
      - name: Verify composed installable artifact
        run: |
          node tests/release-workflow.mjs
          node tests/live-uat-regressions.mjs
      - name: Full regression
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json tests/full-uat-write-policy.mjs tests/live-uat-regressions.mjs hotfixes/v1.13.0-user-row-lifecycle-transform.mjs hotfixes/v1.13.0-full-uat-live-finalize.mjs tools/patch-full-uat-write-policy.mjs
          git commit -m "fix: batch Full UAT save and accept server writes before readback [full-uat-green]"
          git push origin HEAD:fix/v1.14-live-uat-autoconfirm-6fail
