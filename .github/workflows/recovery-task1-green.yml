name: v1.14 Recovery Task1 GREEN

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]

permissions:
  contents: write

jobs:
  embed-full-uat:
    if: contains(github.event.head_commit.message, '[task1-green]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.14-recovery-uat-resolution
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Embed Full UAT into canonical userscript
        run: node tools/embed-canonical-full-uat.mjs
      - name: Verify syntax and focused contracts
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/v1.14-rc-contract.mjs
          TMS_TEST_SOURCE="$PWD/tessa-matrix-studio.user.js" node tests/full-uat-runner-contract.mjs
      - name: Verify generated diff
        run: |
          git diff --check
          git diff --exit-code -- hotfixes/full-uat-runner-v1.js
          grep -Fq '__TMS_FULL_UAT_V1__' tessa-matrix-studio.user.js
          grep -Fq 'Запустить полный UAT' tessa-matrix-studio.user.js
      - name: Commit canonical userscript
        run: |
          if git diff --quiet -- tessa-matrix-studio.user.js; then
            echo 'No userscript diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js
          git commit -m 'fix: ship Full UAT in canonical v1.14 userscript'
          git push origin HEAD:fix/v1.14-recovery-uat-resolution
