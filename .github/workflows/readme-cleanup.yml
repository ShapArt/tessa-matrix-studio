name: README cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cleanup_readme.py'
      - '.github/workflows/readme-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Simplify README
        run: python .github/scripts/cleanup_readme.py
      - name: Commit cleanup and remove temporary files
        shell: bash
        run: |
          rm -f .github/scripts/cleanup_readme.py .github/workflows/readme-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/scripts/cleanup_readme.py .github/workflows/readme-cleanup.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'docs: simplify README and move technical history deeper'
          git push origin HEAD:main
