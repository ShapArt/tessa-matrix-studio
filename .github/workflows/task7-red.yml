name: GREEN Task7 v1.14 RC contract

on:
  push:
    branches: [feat/incremental-performance-v1.14]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply v1.14 RC documentation/version patch
        run: |
          node tools/patch-task7-v1.14-rc.mjs
          python - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Текущая версия: **1.13.0**', 'Текущая версия: **1.14.0**')
          readme.write_text(text, encoding='utf-8')
          issue = Path('.github/ISSUE_TEMPLATE/bug_report.yml')
          text = issue.read_text(encoding='utf-8')
          text = text.replace('placeholder: 1.13.0', 'placeholder: 1.14.0')
          issue.write_text(text, encoding='utf-8')
          PY
      - name: Verify v1.14 RC contract
        run: node tests/v1.14-rc-contract.mjs
      - name: Verify release/candidate contracts
        run: |
          node tests/docs.mjs
          node tests/release-workflow.mjs
          node tests/workflow-security.mjs
          node tests/uat-candidate-workflow.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit release candidate sources
        run: |
          if git diff --quiet; then
            echo "No RC diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tessa-matrix-studio.user.js README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml docs/communications/v1.14-colleague-test-message.md tools/patch-task7-v1.14-rc.mjs
          git commit -m "chore: prepare v1.14.0 release candidate"
          git push
