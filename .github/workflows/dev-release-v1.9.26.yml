name: Dev Release v1.9.26

on:
  push:
    branches: [fix/excel-coercion-v1.9.26]
    paths:
      - '.github/workflows/dev-release-v1.9.26.yml'

permissions:
  contents: write

jobs:
  release-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/excel-coercion-v1.9.26
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Patch release metadata and docs
        run: python .github/scripts/release-v1.9.26.py
      - name: Verify full suite
        run: npm test
      - name: Commit release sync and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/release-v1.9.26.py .github/workflows/dev-release-v1.9.26.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js package.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml .github/scripts/release-v1.9.26.py .github/workflows/dev-release-v1.9.26.yml
          git commit -m 'chore: prepare v1.9.26 release'
          git push origin HEAD:fix/excel-coercion-v1.9.26
