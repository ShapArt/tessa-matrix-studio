name: Patch acceptance bug v1.9.3

on:
  push:
    branches: [fix/acceptance-v1.9.3]
    paths:
      - .github/workflows/patch-acceptance-v193.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Patch production userscript and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          script = Path('tessa-matrix-studio.user.js')
          s = script.read_text(encoding='utf-8')
          s = s.replace('// @version      1.9.2', '// @version      1.9.3', 1)

          old = "if (text.includes('access') || text.includes('permission') || text.includes('доступ') || text.includes('прав')) return 'Недостаточно прав для изменения этой матрицы. Откройте черновик под пользователем с правами редактирования.';"
          new = "if (text.includes('access denied') || text.includes('permission') || text.includes('forbidden') || text.includes('недостаточно прав') || text.includes('нет прав') || text.includes('прав доступа') || text.includes('доступ запрещ')) return 'Недостаточно прав для изменения этой матрицы. Откройте черновик под пользователем с правами редактирования.';"
          if old not in s:
              raise SystemExit('friendlyErrorMessage access matcher anchor not found')
          s = s.replace(old, new, 1)
          script.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8').replace('1.9.2', '1.9.3')
          readme.write_text(r, encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data['version'] = '1.9.3'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          smoke = Path('tests/smoke.mjs')
          smoke_text = smoke.read_text(encoding='utf-8').replace("// @version      1.9.2", "// @version      1.9.3")
          smoke.write_text(smoke_text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          entry = '''# Changelog\n\n## 1.9.3 — 2026-08-27\n\n- добавлен end-to-end acceptance regression suite для `NOOP / PATCH / ADD / REPLACE / DELETE / SKIP / stale preview / справочников / отмены`;\n- исправлена классификация ошибок справочника: слово «справочник» больше не распознаётся как ошибка прав из-за подстроки «прав»;\n- `npm test` теперь включает пользовательские acceptance-сценарии поверх planner и preflight.\n\n'''
          if not c.startswith('# Changelog\n\n'):
              raise SystemExit('Unexpected CHANGELOG header')
          c = entry + c[len('# Changelog\n\n'):]
          changelog.write_text(c, encoding='utf-8')
          PY

          grep -q '@version      1.9.3' tessa-matrix-studio.user.js
          grep -q "text.includes('прав доступа')" tessa-matrix-studio.user.js
          if grep -q "text.includes('прав')) return 'Недостаточно прав" tessa-matrix-studio.user.js; then
            echo 'Broad rights matcher is still present' >&2
            exit 1
          fi
          npm test

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-acceptance-v193.yml
          git add tessa-matrix-studio.user.js README.md package.json CHANGELOG.md tests/smoke.mjs tests/acceptance.mjs
          git commit -m 'Fix dictionary error classification and add acceptance tests for v1.9.3'
          git push
