name: UAT Row Lifecycle RED-GREEN

on:
  push:
    branches: [fix/uat-row-lifecycle-1.13.0]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Copied identity lifecycle regression
        run: node tests/user-copied-identity-regression.mjs
