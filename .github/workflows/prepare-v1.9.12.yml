name: Prepare v1.9.12

on:
  push:
    branches:
      - feature/selective-review-undo-v1.9.12
    paths:
      - .github/workflows/prepare-v1.9.12.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/selective-review-undo-v1.9.12
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare release metadata and docs
        run: python .github/scripts/prepare-v1.9.12.py
      - name: Verify full regression suite
        run: npm test
      - name: Commit release-ready tree and remove helpers
        shell: bash
        run: |
          rm .github/workflows/prepare-v1.9.12.yml
          rm .github/scripts/prepare-v1.9.12.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json tests/smoke.mjs README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml .github/workflows/prepare-v1.9.12.yml .github/scripts/prepare-v1.9.12.py
          git commit -m "Prepare TESSA Matrix Studio v1.9.12"
          git push origin HEAD:feature/selective-review-undo-v1.9.12
