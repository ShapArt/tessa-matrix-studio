name: v1.14 Recovery Resolution GREEN

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]

permissions:
  contents: write

jobs:
  resolution-green:
    if: contains(github.event.head_commit.message, '[resolution-green]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.14-recovery-uat-resolution
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Resolution Center production patch
        run: node tools/patch-resolution-center.mjs
      - name: Verify focused recovery contracts
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/resolution-center.mjs
          node tests/employee-name-resolver.mjs
          node tests/apply-source-skips-success.mjs
          node tests/review-ui-contract.mjs
          node tests/preview-support-ux.mjs
          node tests/three-way-merge.mjs
          node tests/changes-report-xlsx.mjs
          node tests/changes-report-ui.mjs
          git diff --check
      - name: Full regression
        run: npm test
      - name: Commit canonical userscript
        run: |
          if git diff --quiet -- tessa-matrix-studio.user.js; then
            echo 'No userscript diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js
          git commit -m 'fix: add Resolution Center and attention state'
          git push origin HEAD:fix/v1.14-recovery-uat-resolution
