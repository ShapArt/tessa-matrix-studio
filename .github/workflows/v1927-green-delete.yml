name: v1.9.27 DELETE race patch

on:
  push:
    branches:
      - feat/v1.9.27-apply-race-protection
    paths:
      - .github/workflows/v1927-green-delete.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1.9.27-apply-race-protection
      - name: Apply minimal DELETE race patch
        shell: python
        run: |
          from pathlib import Path
          source = Path('tessa-matrix-studio.user.js')
          text = source.read_text(encoding='utf-8')
          old = """        log(`Удаляю строку TESSA ${action.currentRow.index + 1}`);\n        await bridge.deleteMatrixRow(action.currentRow.versionId);\n"""
          new = """        // DeleteRow is a custom request without CardStoreRequest.AffectVersion.\n        // Re-read the target immediately before deletion and fail closed on any drift.\n        const deleteSnapshot = await bridge.loadSnapshot(structure);\n        const deleteTarget = (deleteSnapshot.rows || []).find(row =>\n          canonicalValue(row.rowCardId) === canonicalValue(prepared.current.rowCardId));\n        if (!deleteTarget) {\n          throw new Error(`Удаление строки TESSA ${action.currentRow.index + 1} пропущено: строка исчезла после предварительной проверки. Обновите Excel и проверьте изменения заново.`);\n        }\n        if (canonicalValue(deleteTarget.versionId) !== canonicalValue(prepared.current.versionId)\n          || canonicalValue(deleteTarget.fingerprint) !== canonicalValue(prepared.current.fingerprint)) {\n          throw new Error(`Удаление строки TESSA ${action.currentRow.index + 1} пропущено: строка изменилась после предварительной проверки. Обновите Excel и проверьте изменения заново.`);\n        }\n        log(`Удаляю строку TESSA ${action.currentRow.index + 1}`);\n        await bridge.deleteMatrixRow(action.currentRow.versionId);\n"""
          if old not in text:
              raise SystemExit('DELETE store anchor not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/v1927-green-delete.yml').unlink()
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js .github/workflows/v1927-green-delete.yml
          git commit -m "fix: recheck DELETE target immediately before request"
          git push origin HEAD:feat/v1.9.27-apply-race-protection
