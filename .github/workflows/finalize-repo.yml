name: Finalize repository

on:
  push:
    branches: [finalize/v1.9.1]
    paths:
      - .github/workflows/finalize-repo.yml

permissions:
  contents: write

jobs:
  build-production-userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild production userscript
        shell: bash
        run: |
          set -euo pipefail
          cat build/tms.part*.b64 | base64 --decode > /tmp/tessa-matrix-studio.user.js.xz
          xz --decompress --stdout /tmp/tessa-matrix-studio.user.js.xz > tessa-matrix-studio.user.js
          echo "8e4e183c737ad6b95117a2f555656cf944948804caaf5a79e0fd4809f6944c16  tessa-matrix-studio.user.js" | sha256sum --check --strict
          node --check tessa-matrix-studio.user.js
          grep -q "@version      1.9.1" tessa-matrix-studio.user.js
          grep -q "@author       Шаповалов Артём" tessa-matrix-studio.user.js
          grep -q "https://tessa.cherkizovsky.net/\*" tessa-matrix-studio.user.js
          npm test

      - name: Commit production userscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add production userscript v1.9.1"
          git push

