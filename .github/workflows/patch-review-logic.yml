name: Patch selective review logic

on:
  push:
    branches:
      - feature/selective-review-undo-v1.9.12
    paths:
      - .github/workflows/patch-review-logic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/selective-review-undo-v1.9.12
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Implement reviewed plan helpers
        run: python .github/scripts/patch-review-logic.py
      - name: Verify review regression and full suite
        run: npm test
      - name: Commit implementation and remove helper
        shell: bash
        run: |
          rm .github/workflows/patch-review-logic.yml
          rm .github/scripts/patch-review-logic.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js .github/workflows/patch-review-logic.yml .github/scripts/patch-review-logic.py
          git commit -m "Implement selective reviewed plan filtering"
          git push origin HEAD:feature/selective-review-undo-v1.9.12
