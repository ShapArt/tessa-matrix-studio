name: v1.14 Recovery Task11 APPLY

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]

permissions:
  contents: write

jobs:
  task11-apply:
    if: contains(github.event.head_commit.message, '[task11-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply deterministic Task11 production patch
        run: node tools/patch-task11-picker-xlsx.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check tessa-matrix-studio.user.js
      - name: Task11 focused regression
        run: node tests/recovery-task11-picker-xlsx.mjs
      - name: XLSX archive security regression
        run: node tests/xlsx-archive-security.mjs
      - name: Studio self-roundtrip regression
        run: node tests/xlsx-self-roundtrip-limit.mjs
      - name: Picker production UX regression
        run: node tests/picker-production-ux.mjs
      - name: Picker DOM regression
        run: node tests/picker-dom-production.cjs
      - name: Full regression
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          if git diff --cached --quiet; then
            echo "No production diff to commit."
            exit 0
          fi
          git commit -m "fix: bootstrap picker from TESSA and accept large XLSX [task11-green]"
          git push origin HEAD:fix/v1.14-recovery-uat-resolution
