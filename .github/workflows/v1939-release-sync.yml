name: v1.9.39 release sync

on:
  push:
    branches:
      - feat/v1.9.39-post-apply-ux
    paths:
      - .github/workflows/v1939-release-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1.9.39-post-apply-ux
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Sync release documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          if '1.9.38' not in s:
              raise SystemExit('README current version marker missing')
          s = s.replace('1.9.38', '1.9.39')
          readme.write_text(s, encoding='utf-8')

          issue = Path('.github/ISSUE_TEMPLATE/bug_report.yml')
          s = issue.read_text(encoding='utf-8')
          s = s.replace('placeholder: 1.9.38', 'placeholder: 1.9.39', 1)
          issue.write_text(s, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          s = changelog.read_text(encoding='utf-8')
          entry = '''## 1.9.39 — 2026-09-01

          - live UAT подтвердил 11/11 успешных requested mutations при 12 строках, заранее исключённых planner/source validation; source-skipped строки больше не переводят полностью успешный mutation-plan в `partial`;
          - после Store/Delete Studio обновляет только нативное отображение матрицы через view refresh, не вызывает полный `editor.refreshCard()` и сохраняет текущую страницу представления;
          - transient `ObtainWriterLock / MatrixRow.WriteHeartbit` при обновлении отображения получает ограниченный retry/backoff; неуспешный view refresh не отменяет уже успешную запись и оставляет ручную кнопку **«Обновить отображение»**;
          - успешный Apply показывается inline вместо блокирующего browser `alert()`; source-skipped, mutation-skipped и not-started счётчики разведены по смыслу;
          - progress/status закреплён сверху внутри прокручиваемой панели Studio, поэтому процент, этап и ETA остаются видимыми при длинном Preview;
          - старый Apply-plan после начавшейся записи по-прежнему consumed; перед следующим Apply Studio напоминает выполнить свежую проверку или получить свежую выгрузку Excel;
          - добавлены RED→GREEN regressions `apply-source-skips-success.mjs`, `post-apply-view-refresh.mjs` и `sticky-progress-ui.mjs` на точную форму live UAT и новый UX.

          '''.replace('          ', '')
          if '## 1.9.39 —' not in s:
              if not s.startswith('# Changelog\n\n'):
                  raise SystemExit('unexpected CHANGELOG header')
              s = '# Changelog\n\n' + entry + s[len('# Changelog\n\n'):]
          changelog.write_text(s, encoding='utf-8')

          runbook = Path('docs/PRODUCTION-RUNBOOK.md')
          s = runbook.read_text(encoding='utf-8')
          section = '''
          ## Post-Apply отображение и результат

          Начиная с v1.9.39 успешный Store отделён от обновления UI. После mutation Studio обновляет только нативное представление матрицы, не выполняя полный `editor.refreshCard()`. Для transient writer-lock (`ObtainWriterLock` / `WriteHeartbit`) выполняется ограниченный retry; если view всё равно не обновился, Store-result не меняется и пользователь может нажать **«Обновить отображение»** вручную.

          Source-skipped строки, исключённые planner/source validation до mutation-plan, показываются отдельно и не делают успешный Apply частичным. `partial` используется только для незавершённого mutation-plan: preflight/store skip, not-started, cancel или неполная verification. После любой начавшейся mutation старый Preview остаётся consumed; перед следующим Apply нужна свежая проверка/выгрузка.

          Progress/status панели закреплён сверху внутри её scroll-container, чтобы этап, процент и ETA не терялись при длинном Preview.
          '''.replace('          ', '')
          if '## Post-Apply отображение и результат' not in s:
              s = s.rstrip() + '\n' + section + '\n'
          runbook.write_text(s, encoding='utf-8')
          PY
      - name: Full regression before docs commit
        run: npm test
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/v1939-release-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "docs: sync v1.9.39 release surfaces"
          git push origin HEAD:feat/v1.9.39-post-apply-ux
