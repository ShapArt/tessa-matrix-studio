name: Temporary v1.11.1 release patch

on:
  push:
    branches: [release/v1.11.1]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor == 'ShapArt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.11.1
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply release metadata patch
        run: python3 tools/temporary-v1.11.1-release-patch.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full verification
        run: npm test
      - name: Commit self-cleaned release metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare v1.11.1'
          git push origin HEAD:release/v1.11.1
