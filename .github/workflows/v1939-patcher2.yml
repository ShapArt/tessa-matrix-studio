name: v1.9.39 patcher 2

on:
  push:
    branches:
      - feat/v1.9.39-post-apply-ux
    paths:
      - .github/workflows/v1939-patcher2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1.9.39-post-apply-ux
          fetch-depth: 0
      - name: Repair marker and apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/patch-v1939.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("old_markup = '<button id=\\\\\"tms-download-report\\\\\" class=\\\\\"tms-ghost\\\\\" hidden disabled>Скачать отчёт</button><div id=\\\\\"tms-apply-note\\\\\" class=\\\\\"tms-step-caption\\\\\"></div>'", "old_markup = '<button id=\"tms-download-report\" class=\"tms-ghost\" hidden disabled>Скачать отчёт</button><div id=\"tms-apply-note\" class=\"tms-step-caption\"></div>'")
          s = s.replace("new_markup = '<button id=\\\\\"tms-download-report\\\\\" class=\\\\\"tms-ghost\\\\\" hidden disabled>Скачать отчёт</button><button id=\\\\\"tms-refresh-view\\\\\" class=\\\\\"tms-ghost\\\\\" hidden disabled>Обновить отображение</button><div id=\\\\\"tms-apply-note\\\\\" class=\\\\\"tms-step-caption\\\\\"></div>'", "new_markup = '<button id=\"tms-download-report\" class=\"tms-ghost\" hidden disabled>Скачать отчёт</button><button id=\"tms-refresh-view\" class=\"tms-ghost\" hidden disabled>Обновить отображение</button><div id=\"tms-apply-note\" class=\"tms-step-caption\"></div>'")
          p.write_text(s, encoding='utf-8')
          PY
          python tools/patch-v1939.py
      - name: Commit source and clean temporary patchers
        run: |
          rm -f tools/patch-v1939.py .github/workflows/v1939-patcher.yml .github/workflows/v1939-patcher2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "feat: improve post-Apply refresh and result UX"
          git push origin HEAD:feat/v1.9.39-post-apply-ux
