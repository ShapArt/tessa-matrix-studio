name: v1.9.40 Task 4 reconciliation GREEN

on:
  push:
    branches: [feat/v1.9.40-self-check-reconciliation]
    paths: [.github/workflows/v194-green-task4-reconciliation.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Task 4 reconciliation patch
        run: python scripts/v194_task4_reconciliation_green.py
      - name: Verify reconciliation GREEN
        run: node --check tessa-matrix-studio.user.js && node tests/reconciliation.mjs && node tests/reconciliation-writer-lock.mjs && node tests/reconciliation-performance.mjs && node tests/mutation-receipts.mjs && node tests/xlsx-load.mjs && node tests/dictionary-high-cardinality.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Commit Task 4 reconciliation GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --check
          git commit -m "feat: reconcile applied mutations read-only"
          git push origin HEAD:feat/v1.9.40-self-check-reconciliation
