name: Cross-matrix Task 4d RED

on:
  push:
    branches:
      - feat/cross-matrix-replacement
    paths:
      - tests/cross-matrix-delete-phase-failure.mjs
      - .github/workflows/dev-cross-matrix-task4d-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cross-matrix-replacement
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run target delete fail-closed contract before implementation
        run: node tests/cross-matrix-delete-phase-failure.mjs
