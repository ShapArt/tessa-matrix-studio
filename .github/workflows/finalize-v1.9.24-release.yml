name: Finalize v1.9.24 release files

on:
  push:
    branches:
      - security/spreadsheetml-guards-v1.9.24
    paths:
      - scripts/finalize-v1.9.24-release.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/spreadsheetml-guards-v1.9.24
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Update release files
        run: node scripts/finalize-v1.9.24-release.mjs
      - name: Verify full release contract
        run: npm test
      - name: Commit release files and remove staging helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml
          git rm scripts/finalize-v1.9.24-release.mjs .github/workflows/finalize-v1.9.24-release.yml
          git commit -m "release: prepare v1.9.24"
          git push origin HEAD:security/spreadsheetml-guards-v1.9.24
