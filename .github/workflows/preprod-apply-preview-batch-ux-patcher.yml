name: Apply blocked-batch Preview UX patch

on:
  push:
    branches:
      - feat/preprod-mega-uat-hardening
    paths:
      - .github/workflows/preprod-apply-preview-batch-ux-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/preprod_patch_apply_preview_batch_ux.py
      - name: Commit source and remove temporary patcher
        run: |
          rm scripts/preprod_patch_apply_preview_batch_ux.py
          rm .github/workflows/preprod-apply-preview-batch-ux-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js scripts/preprod_patch_apply_preview_batch_ux.py .github/workflows/preprod-apply-preview-batch-ux-patcher.yml
          git commit -m "fix: disable oversized Apply in Preview"
          git push origin HEAD:feat/preprod-mega-uat-hardening
