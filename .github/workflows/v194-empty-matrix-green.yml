name: v1.9.40 empty matrix GREEN

on:
  push:
    branches: [feat/v1.9.40-self-check-reconciliation]
    paths: [.github/workflows/v194-empty-matrix-green.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply strict empty-matrix support hardening
        run: python scripts/v194_empty_matrix_fix.py
      - name: Verify focused empty-matrix contracts
        run: node --check tessa-matrix-studio.user.js && node tests/empty-matrix-runtime.mjs && node tests/runtime-capability-probe.mjs && node tests/capability-ui-contract.mjs && node tests/post-apply-view-refresh.mjs && node tests/reconciliation.mjs && node tests/reconciliation-identity-ambiguity.mjs && node tests/reconciliation-invariants.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --check
          git commit -m "fix: require native evidence for empty matrices"
          git push origin HEAD:feat/v1.9.40-self-check-reconciliation
