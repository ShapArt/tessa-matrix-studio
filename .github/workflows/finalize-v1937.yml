name: Finalize preprod v1.9.37
on:
  push:
    branches: [feat/preprod-mega-uat-hardening]
    paths:
      - scripts/finalize_v1937.py
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply v1.9.37 release finalization
        run: python scripts/finalize_v1937.py
      - name: Focused verification before version sync commit
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/apply-refresh-failure-result.mjs
          node tests/apply-report-opt-in.mjs
          node tests/apply-plan-consumed.mjs
      - name: Commit finalized files and self-remove helper
        run: |
          rm scripts/finalize_v1937.py .github/workflows/finalize-v1937.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: prepare v1.9.37 gold candidate"
          git push origin HEAD:feat/preprod-mega-uat-hardening
