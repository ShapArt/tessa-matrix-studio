name: v1.9.31 temporary patch helper

on:
  push:
    branches:
      - test/v1.9.31-cardinality-opc

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/v1.9.31-cardinality-opc
      - name: Apply minimal fallback-resolution cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tessa-matrix-studio.user.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              "    const byDisplay = new Map();\n    const searchRows = [];\n    const append = (map, key, item) => {",
              "    const byDisplay = new Map();\n    const searchRows = [];\n    // Exact ID/name lookups are already O(1). Cache only the expensive fragment/not-found\n    // fallback so the same typo reused across many Excel rows scans a large catalog once.\n    const fallbackResolutionCache = new Map();\n    const append = (map, key, item) => {",
            ),
            (
              "    const lookup = { items, byId, bySelector, byDisplay, searchRows, isBoolean };",
              "    const lookup = { items, byId, bySelector, byDisplay, searchRows, fallbackResolutionCache, isBoolean };",
            ),
            (
              "    const needle = searchCanonical(visibleText);\n    const tokens = searchTokens(visibleText);",
              "    const fallbackCacheKey = [column.key, canonicalValue(column.excelHeader), visibleCanonical, explicitId, explicitRoleType].join('|');\n    const cachedFallback = lookup.fallbackResolutionCache.get(fallbackCacheKey);\n    if (cachedFallback) return { ...cachedFallback };\n    const rememberFallback = result => {\n      lookup.fallbackResolutionCache.set(fallbackCacheKey, result);\n      return result;\n    };\n\n    const needle = searchCanonical(visibleText);\n    const tokens = searchTokens(visibleText);",
            ),
            (
              "      if (partial.length === 1) return resolvedItem(partial[0], 'unique-fragment');",
              "      if (partial.length === 1) return rememberFallback(resolvedItem(partial[0], 'unique-fragment'));",
            ),
            (
              "        return { display: visibleText, explicit: '', resolved: false, resolution: null, issue: `По запросу «${visibleText}» в столбце «${column.excelHeader}» найдено ${partial.length} вариантов: ${variants}${suffix}. Добавьте ещё слово, чтобы остался один вариант.` };",
              "        return rememberFallback({ display: visibleText, explicit: '', resolved: false, resolution: null, issue: `По запросу «${visibleText}» в столбце «${column.excelHeader}» найдено ${partial.length} вариантов: ${variants}${suffix}. Добавьте ещё слово, чтобы остался один вариант.` });",
            ),
            (
              "    return { display: visibleText, explicit: '', resolved: false, resolution: null, issue: `Значение «${visibleText}» не найдено в справочнике «${column.excelHeader}». Введите часть официального названия из TESSA или обновите справочники.` };",
              "    return rememberFallback({ display: visibleText, explicit: '', resolved: false, resolution: null, issue: `Значение «${visibleText}» не найдено в справочнике «${column.excelHeader}». Введите часть официального названия из TESSA или обновите справочники.` });",
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one patch anchor, got {count}: {old[:80]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --check
          git commit -m "fix: cache repeated dictionary fallback resolution"
          git push origin HEAD:test/v1.9.31-cardinality-opc
