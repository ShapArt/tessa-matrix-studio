name: Patch v1.9.15 DELETE safety

on:
  push:
    branches:
      - feature/qa-hardening-v1.9.15

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/qa-hardening-v1.9.15

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply V6 baseline ledger patch
        run: python .github/patch_v1_9_15_delete.py

      - name: Verify full regression suite
        run: npm test

      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch_v1_9_15_delete.py .github/workflows/patch-v1.9.15-delete.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve physical DELETE through schema refresh"
          git push origin HEAD:feature/qa-hardening-v1.9.15
