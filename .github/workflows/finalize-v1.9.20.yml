name: Temporary v1.9.20 finalizer

on:
  push:
    branches:
      - fix/preview-preflight-v1.9.20
    paths:
      - scripts/finalize-v1.9.20.py
      - scripts/trigger-finalize-v1.9.20.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/preview-preflight-v1.9.20
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply release patch
        run: python3 scripts/finalize-v1.9.20.py
      - name: Full regression suite
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit release state and remove helper
        run: |
          rm -f scripts/finalize-v1.9.20.py scripts/trigger-finalize-v1.9.20.txt .github/workflows/finalize-v1.9.20.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare v1.9.20 preview preflight"
          git push origin HEAD:fix/preview-preflight-v1.9.20
