name: Temporary v1.9.21 typed dependent DELETE patch

on:
  push:
    branches:
      - fix/typed-dependent-delete-v1.9.21
    paths:
      - scripts/patch-typed-dependent-delete-v1.9.21.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/typed-dependent-delete-v1.9.21
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply production patch
        run: python3 scripts/patch-typed-dependent-delete-v1.9.21.py
      - name: Full regression suite
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit patch and remove helper
        run: |
          rm -f scripts/patch-typed-dependent-delete-v1.9.21.py .github/workflows/patch-typed-dependent-delete-v1.9.21.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: match dependent DELETE by typed semantic state"
          git push origin HEAD:fix/typed-dependent-delete-v1.9.21
