name: Dev Picker RED

on:
  push:
    branches:
      - feat/dictionary-picker-hardening

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove schema-refresh circular regression is already green
        run: node tests/schema-refresh-circular-regression.mjs
      - name: Capture expected picker/org/performance RED failures
        shell: bash
        run: |
          set +e
          node tests/picker-production-ux.mjs; PICKER=$?
          node tests/record-keeping-partners.mjs; PARTNERS=$?
          node tests/picker-performance.mjs; PERF=$?
          set -e
          echo "picker=$PICKER partners=$PARTNERS perf=$PERF"
          test "$PICKER" -ne 0
          test "$PARTNERS" -ne 0
          test "$PERF" -ne 0
          echo "Expected RED contracts reproduced; failing this workflow intentionally."
          exit 1
