name: Apply UAT README section

on:
  push:
    branches: [docs/uat-release-gate]
    paths:
      - .github/workflows/apply-uat-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/uat-release-gate

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Insert production UAT section into README
        env:
          UAT_SECTION_B64: ""
        run: python -c "from pathlib import Path; import base64, os; p=Path('README.md'); t=p.read_text(encoding='utf-8'); marker='\\n---\\n\\n# Для сопровождения\\n'; h='# Боевой UAT перед раздачей пользователям'; s=base64.b64decode(os.environ['UAT_SECTION_B64']).decode('utf-8'); p.write_text(t if h in t else t.replace(marker, '\\n'+s+marker, 1), encoding='utf-8')"

      - name: Verify repository
        run: npm test

      - name: Commit README and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-uat-docs.yml
          git config user.name "ShapArt"
          git config user.email "100069322+ShapArt@users.noreply.github.com"
          git add README.md .github/workflows/apply-uat-docs.yml
          git commit -m "docs: add production UAT release gate"
          git push origin HEAD:docs/uat-release-gate
