name: Patch selective review UI

on:
  push:
    branches:
      - feature/selective-review-undo-v1.9.12
    paths:
      - .github/workflows/patch-review-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/selective-review-undo-v1.9.12
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Integrate selective review UI
        run: python .github/scripts/patch-review-ui.py
      - name: Verify UI contract and full suite
        run: npm test
      - name: Commit UI and remove helpers
        shell: bash
        run: |
          rm .github/workflows/patch-review-ui.yml
          rm .github/scripts/patch-review-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js .github/workflows/patch-review-ui.yml .github/scripts/patch-review-ui.py
          git commit -m "Add selective undo controls to preview"
          git push origin HEAD:feature/selective-review-undo-v1.9.12
