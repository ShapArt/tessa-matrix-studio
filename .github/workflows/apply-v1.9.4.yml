name: Apply v1.9.4 release metadata

on:
  push:
    branches: [release/v1.9.4-integrity]
    paths:
      - .github/workflows/apply-v1.9.4.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.9.4-integrity

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bump release metadata
        shell: python
        run: |
          from pathlib import Path
          import json

          old = '1.9.3'
          new = '1.9.4'

          script = Path('tessa-matrix-studio.user.js')
          text = script.read_text(encoding='utf-8')
          needle = f'// @version      {old}'
          if text.count(needle) != 1:
              raise SystemExit(f'expected one userscript version marker, got {text.count(needle)}')
          script.write_text(text.replace(needle, f'// @version      {new}', 1), encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          if pkg.get('version') != old:
              raise SystemExit(f'unexpected package version: {pkg.get("version")}')
          pkg['version'] = new
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = {
              f'version-{old}-': f'version-{new}-',
              f'**v{old} · Автор: Шаповалов Артём**': f'**v{new} · Автор: Шаповалов Артём**',
              f'Подтвердите установку версии **{old}**': f'Подтвердите установку версии **{new}**',
              f'- **Версия:** `{old}`': f'- **Версия:** `{new}`',
              f'Текущая версия: **{old}**': f'Текущая версия: **{new}**',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'README marker not found: {before}')
              text = text.replace(before, after, 1)
          readme.write_text(text, encoding='utf-8')

          issue = Path('.github/ISSUE_TEMPLATE/bug_report.yml')
          text = issue.read_text(encoding='utf-8')
          marker = f'placeholder: {old}'
          if marker not in text:
              raise SystemExit('bug-report version marker not found')
          issue.write_text(text.replace(marker, f'placeholder: {new}', 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '# Changelog\n\n'
          release_lines = [
              '## 1.9.4 — 2026-08-27',
              '',
              '- security/packaging release без изменений бизнес-логики TESSA Matrix Studio;',
              '- release pipeline публикует `SHA256SUMS.txt` для `.user.js` и ZIP;',
              '- release assets получают GitHub/Sigstore provenance-аттестацию после успешных Tests и CodeQL;',
              '- релиз собирается из того же commit SHA, который прошёл `Quality & Security`.',
              '',
          ]
          release = '\n'.join(release_lines) + '\n'
          if '## 1.9.4 — 2026-08-27' not in text:
              if not text.startswith(heading):
                  raise SystemExit('unexpected CHANGELOG header')
              text = heading + release + text[len(heading):]
              changelog.write_text(text, encoding='utf-8')

      - name: Verify repository
        run: npm test

      - name: Commit release metadata and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v1.9.4.yml
          git config user.name "ShapArt"
          git config user.email "100069322+ShapArt@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml tests/smoke.mjs .github/workflows/apply-v1.9.4.yml
          git commit -m "release: prepare v1.9.4 integrity release"
          git push origin HEAD:release/v1.9.4-integrity
