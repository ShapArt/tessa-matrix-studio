name: Build v1.14.1 Changes Report Candidate

on:
  workflow_dispatch:
  push:
    branches: [feat/v1.14.1-changes-report-full-row]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 667e77106bea41ddf9d9f446d9e263eb0658bf8c
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "667e77106bea41ddf9d9f446d9e263eb0658bf8c"
          npm test

      - name: Build candidate
        run: |
          set -euo pipefail
          mkdir -p dist
          cp tessa-matrix-studio.user.js dist/tessa-matrix-studio.user.js
          node hotfixes/malformed-range-diagnostic-transform.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.13.0-user-row-lifecycle-transform.mjs dist/tessa-matrix-studio.user.js
          sed -i -E "0,/^\/\/ @version[[:space:]]+[0-9.]+$/s//\/\/ @version      1.14.1/" dist/tessa-matrix-studio.user.js
          sed -i -E "0,/^[[:space:]]+version: '[0-9.]+'[,]$/s//    version: '1.14.1',/" dist/tessa-matrix-studio.user.js
          printf '\n' >> dist/tessa-matrix-studio.user.js
          cat hotfixes/interval-add-valid-fallback.js >> dist/tessa-matrix-studio.user.js
          printf '\n' >> dist/tessa-matrix-studio.user.js
          node hotfixes/v1.13.0-full-uat-live-finalize.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14-full-uat-inline-failures.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14-live-uat-final-four.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.1-changes-report-full-row.mjs dist/tessa-matrix-studio.user.js

          node --check dist/tessa-matrix-studio.user.js
          grep -Fqx "// @version      1.14.1" dist/tessa-matrix-studio.user.js
          grep -Fq "version: '1.14.1'," dist/tessa-matrix-studio.user.js
          grep -Fq "REVIEWED_CHANGES_REPORT_V2" dist/tessa-matrix-studio.user.js
          ! grep -Fq "Детали изменений" dist/tessa-matrix-studio.user.js

          cat > dist/CANDIDATE-MANIFEST.txt <<'EOF'
          version=1.14.1
          source_commit=667e77106bea41ddf9d9f446d9e263eb0658bf8c
          purpose=changes-report-full-row-review
          report_format=TESSA_MATRIX_CHANGES_REPORT_V2
          visible_sheets=1
          add=full-populated-business-row
          update=changed-fields-before-after
          delete=full-populated-business-row
          skip=reason-visible
          report_only=true
          EOF

          (cd dist && sha256sum tessa-matrix-studio.user.js > SHA256SUMS.txt)
          (cd dist && zip -9 tessa-matrix-studio-v1.14.1-changes-report-candidate.zip tessa-matrix-studio.user.js CANDIDATE-MANIFEST.txt SHA256SUMS.txt)

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="uat-v1.14.1-changes-report-667e771"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            dist/tessa-matrix-studio.user.js \
            dist/tessa-matrix-studio-v1.14.1-changes-report-candidate.zip \
            dist/SHA256SUMS.txt \
            --prerelease \
            --title "TESSA Matrix Studio v1.14.1 Changes Report Candidate" \
            --notes "Report-only candidate from exact source 667e771. One-sheet self-contained changes workbook: UPDATE changed fields, ADD/DELETE full populated business row, SKIP reason."
