name: Finalize v1.9.6 sorted overwrite fix

on:
  push:
    branches:
      - fix/sorted-overwrite-v1.9.6

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/sorted-overwrite-v1.9.6
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump release metadata to v1.9.6
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, text) { fs.writeFileSync(path, text, 'utf8'); }
          function replaceExact(path, from, to) {
            const text = read(path);
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one ${JSON.stringify(from)}, got ${count}`);
            write(path, text.replace(from, to));
          }

          replaceExact('tessa-matrix-studio.user.js', '// @version      1.9.5', '// @version      1.9.6');
          replaceExact('tessa-matrix-studio.user.js', "version: '1.9.5',", "version: '1.9.6',");
          replaceExact('package.json', '"version": "1.9.5"', '"version": "1.9.6"');
          replaceExact('tests/smoke.mjs', "assert(code.includes('// @version      1.9.5'), 'wrong userscript version');", "assert(code.includes('// @version      1.9.6'), 'wrong userscript version');");
          replaceExact('.github/ISSUE_TEMPLATE/bug_report.yml', 'placeholder: 1.9.5', 'placeholder: 1.9.6');

          const readme = read('README.md');
          const readmeCount = readme.split('1.9.5').length - 1;
          if (readmeCount < 3) throw new Error(`README version references unexpected: ${readmeCount}`);
          write('README.md', readme.replaceAll('1.9.5', '1.9.6'));

          const changelog = read('CHANGELOG.md');
          const marker = '# Changelog\n\n';
          if (!changelog.startsWith(marker)) throw new Error('CHANGELOG header mismatch');
          if (changelog.includes('## 1.9.6 — 2026-08-27')) throw new Error('v1.9.6 changelog already exists');
          const entry = [
            '## 1.9.6 — 2026-08-27',
            '',
            '- исправлено order-dependent сопоставление при сортировке Excel и копировании существующей строки поверх другой;',
            '- planner теперь определяет overwrite по повторяющейся identity источника и пропавшей identity цели, а позицию использует только как дополнительное доказательство;',
            '- добавлен regression-сценарий A/B/C → сортировка C/A/B → копирование A поверх B без лишнего ADD/DELETE/SKIP.',
            '',
          ].join('\n');
          write('CHANGELOG.md', marker + entry + changelog.slice(marker.length));
          NODE

      - name: Verify full suite
        run: npm test

      - name: Commit release-ready fix and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-sorted-overwrite.yml
          git add tessa-matrix-studio.user.js package.json README.md CHANGELOG.md tests/smoke.mjs .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m 'v1.9.6 — finalize sorted overwrite fix'
          git push origin HEAD:fix/sorted-overwrite-v1.9.6
