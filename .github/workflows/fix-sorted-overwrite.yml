name: Fix sorted overwrite planner

on:
  push:
    branches:
      - fix/sorted-overwrite-v1.9.6

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/sorted-overwrite-v1.9.6
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Patch order-independent overwrite mapping
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tessa-matrix-studio.user.js';
          let text = fs.readFileSync(path, 'utf8');

          const startMarker = `    // Excel позволяет вставить скопированную строку ПОВЕРХ другой строки.\n`;
          const endMarker = `    const primaryExcelRowByIdentity = new Map();\n`;
          const start = text.indexOf(startMarker);
          const end = text.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('overwrite prelude markers not found');

          const prelude = `    // Для overwrite сначала считаем identity, а не доверяем физическому порядку Excel.\n` +
`    // Сортировка строк не должна менять цель операции. Позиция используется только как\n` +
`    // дополнительное доказательство, когда исходная строка осталась на своей позиции.\n` +
`    const expectedCurrentByExcelRow = new Map();\n` +
`    const identityCounts = new Map();\n` +
`    if (desired.length === snapshot.rows.length) {\n` +
`      for (const row of desired) {\n` +
`        const key = excelIdentityKey(row);\n` +
`        if (key) identityCounts.set(key, (identityCounts.get(key) || 0) + 1);\n` +
`      }\n` +
`      desired.forEach((row, index) => expectedCurrentByExcelRow.set(row, snapshot.rows[index] || null));\n` +
`    }\n\n`;
          text = text.slice(0, start) + prelude + text.slice(end);

          const primaryTail = `      else ambiguousDuplicateIdentities.add(sourceIdentity);\n    }\n\n    for (const excelRow of desired) {`;
          if (!text.includes(primaryTail)) throw new Error('primary identity tail not found');
          const overwriteMapping = `      else ambiguousDuplicateIdentities.add(sourceIdentity);\n    }\n\n` +
`    // Копирование поверх существующей строки даёт одну дополнительную строку с identity\n` +
`    // источника и одну пропавшую identity цели. Сначала используем позицию только там,\n` +
`    // где оригинал источника всё ещё стоит на своей исходной позиции. Если после сортировки\n` +
`    // остаётся ровно одна лишняя копия и одна пропавшая identity, пара однозначна без позиции.\n` +
`    const positionalOverwriteTargets = new Map();\n` +
`    const overwriteMatchedBy = new Map();\n` +
`    if (desired.length === snapshot.rows.length) {\n` +
`      const missingCurrentRows = (snapshot.rows || []).filter(currentRow => {\n` +
`        const identity = currentIdentityKey(currentRow);\n` +
`        return Boolean(identity && (identityCounts.get(identity) || 0) === 0);\n` +
`      });\n` +
`      const remainingMissing = new Map(missingCurrentRows.map(row => [currentIdentityKey(row), row]));\n` +
`      const extraRows = [];\n` +
`      for (const [sourceIdentity, group] of identityGroups.entries()) {\n` +
`        if (group.length < 2 || ambiguousDuplicateIdentities.has(sourceIdentity)) continue;\n` +
`        const primary = primaryExcelRowByIdentity.get(sourceIdentity);\n` +
`        if (!primary) continue;\n` +
`        for (const row of group) {\n` +
`          if (row !== primary) extraRows.push({ row, sourceIdentity, primary });\n` +
`        }\n` +
`      }\n` +
`      for (const extra of extraRows) {\n` +
`        const expectedTarget = expectedCurrentByExcelRow.get(extra.row);\n` +
`        const expectedTargetIdentity = currentIdentityKey(expectedTarget);\n` +
`        const expectedPrimary = expectedCurrentByExcelRow.get(extra.primary);\n` +
`        const primaryStayedInPlace = expectedPrimary && currentIdentityKey(expectedPrimary) === extra.sourceIdentity;\n` +
`        if (!primaryStayedInPlace || !remainingMissing.has(expectedTargetIdentity)) continue;\n` +
`        positionalOverwriteTargets.set(extra.row, expectedTarget);\n` +
`        overwriteMatchedBy.set(extra.row, 'position-overwrite');\n` +
`        remainingMissing.delete(expectedTargetIdentity);\n` +
`      }\n` +
`      const remainingExtras = extraRows.filter(extra => !positionalOverwriteTargets.has(extra.row));\n` +
`      if (remainingExtras.length === 1 && remainingMissing.size === 1) {\n` +
`        const [target] = remainingMissing.values();\n` +
`        positionalOverwriteTargets.set(remainingExtras[0].row, target);\n` +
`        overwriteMatchedBy.set(remainingExtras[0].row, 'missing-identity-overwrite');\n` +
`      }\n` +
`    }\n\n` +
`    for (const excelRow of desired) {`;
          text = text.replace(primaryTail, overwriteMapping);

          const oldMatch = `          match: { matchedBy: 'position-overwrite', lowConfidence: false, sourceIdentity },`;
          const newMatch = `          match: { matchedBy: overwriteMatchedBy.get(excelRow) || 'position-overwrite', lowConfidence: false, sourceIdentity },`;
          if ((text.split(oldMatch).length - 1) !== 1) throw new Error('position-overwrite match line not found exactly once');
          text = text.replace(oldMatch, newMatch);

          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Verify regression suite
        run: npm test

      - name: Commit planner fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js
          git commit -m 'Fix sorted overwrite identity mapping'
          git push origin HEAD:fix/sorted-overwrite-v1.9.6
