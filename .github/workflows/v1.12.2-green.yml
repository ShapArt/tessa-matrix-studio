name: v1.12.2 runtime contract GREEN

on:
  push:
    branches: [fix/v1.12.2-runtime-contract-hardening]
    paths:
      - 'tessa-matrix-studio.user.js'
      - 'tools/apply-v1.12.2-runtime-hardening.mjs'
      - 'tools/apply-v1.12.2-metadata.mjs'
      - 'tools/apply-v1.12.2-test-contracts.mjs'
      - 'tools/apply-v1.12.2-recorder-hardening.mjs'
      - 'tools/apply-v1.12.2-readme-test-strategy.mjs'
      - 'tools/apply-v1.12.2-live-native-contract.mjs'
      - 'tools/apply-v1.12.2-package-release-gate.mjs'
      - 'tools/native-evidence-validator.mjs'
      - 'tools/release-native-evidence-gate.mjs'
      - 'tests/live-write-check-contract.mjs'
      - 'tests/delete-membership-transition.mjs'
      - 'tests/main-matrix-save-contract.mjs'
      - 'tests/interval-diagnostics-capability.mjs'
      - 'tests/native-runtime-recorder.mjs'
      - 'tests/native-evidence-validator.mjs'
      - 'tests/release-native-evidence-gate.mjs'
      - 'tests/post-apply-view-refresh.mjs'
      - 'tests/studio-diagnostics.mjs'
      - 'tests/test-coverage-contract.mjs'
      - 'tests/coverage-manifest.json'
      - 'docs/TEST-STRATEGY.md'
      - 'package.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/bug_report.yml'
      - '.github/workflows/v1.12.2-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.12.2-runtime-contract-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Detect patch state
        id: state
        shell: bash
        run: |
          if grep -q '^// @version      1.12.2$' tessa-matrix-studio.user.js \
             && grep -q 'function stageMatrixRowDelete' tessa-matrix-studio.user.js \
             && grep -q 'function collectNativeRuntimeSurface' tessa-matrix-studio.user.js; then
            echo 'need_runtime=false' >> "$GITHUB_OUTPUT"
          else
            echo 'need_runtime=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -q 'version-1.12.2-' README.md \
             && grep -q '^## 1.12.2 —' CHANGELOG.md \
             && grep -q '"version": "1.12.2"' package-lock.json; then
            echo 'need_metadata=false' >> "$GITHUB_OUTPUT"
          else
            echo 'need_metadata=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -q "duplicateCapability.capability, 'unsupported-server-contract'" tests/studio-diagnostics.mjs; then
            echo 'need_test_contracts=false' >> "$GITHUB_OUTPUT"
          else
            echo 'need_test_contracts=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -q 'function restoreNativeRecorderMethods' tessa-matrix-studio.user.js \
             && grep -q 'truncatedCount' tessa-matrix-studio.user.js \
             && grep -q 'RESTORATION_BEFORE_DOWNLOAD_V1' tessa-matrix-studio.user.js; then
            echo 'need_recorder=false' >> "$GITHUB_OUTPUT"
          else
            echo 'need_recorder=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -q 'NATIVE_DELETE_REQUEST_CONTRACT_V1' tessa-matrix-studio.user.js \
             && grep -q 'NATIVE_EDITOR_SAVE_CONTRACT_V1' tessa-matrix-studio.user.js; then
            echo 'need_live_native=false' >> "$GITHUB_OUTPUT"
          else
            echo 'need_live_native=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -q 'node tests/release-native-evidence-gate.mjs' package.json; then
            echo 'need_package_gate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'need_package_gate=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -q '\[Test Strategy\](docs/TEST-STRATEGY.md)' README.md; then
            echo 'need_readme_strategy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'need_readme_strategy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply runtime patch
        if: steps.state.outputs.need_runtime == 'true'
        run: node tools/apply-v1.12.2-runtime-hardening.mjs
      - name: Apply release metadata
        if: steps.state.outputs.need_metadata == 'true'
        run: node tools/apply-v1.12.2-metadata.mjs
      - name: Apply updated test contracts
        if: steps.state.outputs.need_test_contracts == 'true'
        run: node tools/apply-v1.12.2-test-contracts.mjs
      - name: Harden native recorder lifecycle
        if: steps.state.outputs.need_recorder == 'true'
        run: node tools/apply-v1.12.2-recorder-hardening.mjs
      - name: Apply captured native DELETE/SAVE contract
        if: steps.state.outputs.need_live_native == 'true'
        run: node tools/apply-v1.12.2-live-native-contract.mjs
      - name: Add release evidence gate to npm test
        if: steps.state.outputs.need_package_gate == 'true'
        run: node tools/apply-v1.12.2-package-release-gate.mjs
      - name: Link test strategy from README
        if: steps.state.outputs.need_readme_strategy == 'true'
        run: node tools/apply-v1.12.2-readme-test-strategy.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Targeted runtime contracts
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/live-write-check-contract.mjs
          node tests/delete-membership-transition.mjs
          node tests/main-matrix-save-contract.mjs
          node tests/interval-diagnostics-capability.mjs
          node tests/native-runtime-recorder.mjs
          node tests/native-evidence-validator.mjs
          node tests/release-native-evidence-gate.mjs
          node tests/test-coverage-contract.mjs
          node tests/apply-delete-race.mjs
          node tests/apply-delete-target-version.mjs
          node tests/reconciliation.mjs
          node tests/apply-verification-accounting.mjs
          node tests/post-apply-view-refresh.mjs
          node tests/studio-diagnostics.mjs
      - name: Full regression suite
        run: npm test
      - name: Commit verified generated files
        if: steps.state.outputs.need_runtime == 'true' || steps.state.outputs.need_metadata == 'true' || steps.state.outputs.need_test_contracts == 'true' || steps.state.outputs.need_recorder == 'true' || steps.state.outputs.need_live_native == 'true' || steps.state.outputs.need_package_gate == 'true' || steps.state.outputs.need_readme_strategy == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js package.json package-lock.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml tests/studio-diagnostics.mjs
          if git diff --cached --quiet; then
            echo '::error::Expected runtime/metadata/test/docs patch produced no tracked changes.'
            exit 1
          fi
          git commit -m 'fix: align DELETE and Save with captured native TESSA contract'
          git push origin HEAD:fix/v1.12.2-runtime-contract-hardening
