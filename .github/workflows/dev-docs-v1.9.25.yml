name: Dev Docs v1.9.25

on:
  push:
    branches:
      - fix/excel-auto-date-v1.9.25

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/excel-auto-date-v1.9.25
          fetch-depth: 1
      - name: Patch README and CHANGELOG
        run: python .github/scripts/docs-v1.9.25.py
      - name: Verify docs contracts
        run: node tests/docs.mjs
      - name: Commit docs and remove helpers
        run: |
          rm .github/workflows/dev-docs-v1.9.25.yml .github/scripts/docs-v1.9.25.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md .github/workflows/dev-docs-v1.9.25.yml .github/scripts/docs-v1.9.25.py
          git commit -m "docs: document v1.9.25 Excel auto-date safety"
          git push origin HEAD:fix/excel-auto-date-v1.9.25
