name: Bump README to v1.9.22

on:
  push:
    branches:
      - fix/localized-matrix-state-v1.9.22
    paths:
      - .github/workflows/bump-readme-v1.9.22.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'ShapArt' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/localized-matrix-state-v1.9.22
          fetch-depth: 0
      - name: Update release references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'version-1.9.21-': 'version-1.9.22-',
              '**v1.9.21 · Автор: Шаповалов Артём**': '**v1.9.22 · Автор: Шаповалов Артём**',
              'Подтвердите установку версии **1.9.21**': 'Подтвердите установку версии **1.9.22**',
              'Текущая версия: **1.9.21**': 'Текущая версия: **1.9.22**',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one README occurrence for {old!r}, got {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/bump-readme-v1.9.22.yml
      - name: Commit README release bump
        run: |
          git config user.name "ShapArt"
          git config user.email "100069322+ShapArt@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: publish v1.9.22 references"
          git push origin HEAD:fix/localized-matrix-state-v1.9.22
