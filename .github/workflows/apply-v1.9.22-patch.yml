name: Apply v1.9.22 runtime patch

on:
  push:
    branches:
      - fix/localized-matrix-state-v1.9.22
    paths:
      - .github/workflows/apply-v1.9.22-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'ShapArt' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/localized-matrix-state-v1.9.22
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply exact runtime patch
        run: node scripts/apply-v1.9.22-patch.mjs
      - name: Commit patched production tree
        run: |
          git config user.name "ShapArt"
          git config user.email "100069322+ShapArt@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: localize matrix state and tolerate display-only drift"
          git push origin HEAD:fix/localized-matrix-state-v1.9.22
