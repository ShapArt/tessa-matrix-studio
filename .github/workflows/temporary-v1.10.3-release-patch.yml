name: Temporary v1.10.3 release patch

on:
  push:
    branches: [release/v1.10.3]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'ShapArt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.10.3
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check patcher syntax
        run: node --check tools/temporary-v1.10.3-release-patch.mjs
      - name: Apply release metadata patch
        run: node tools/temporary-v1.10.3-release-patch.mjs
      - name: Verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '@version      1.10.3' tessa-matrix-studio.user.js
          grep -q "version: '1.10.3'" tessa-matrix-studio.user.js
          test "$(node -p "require('./package.json').version")" = '1.10.3'
          node -e "const p=require('./package-lock.json'); if(p.version!=='1.10.3'||p.packages?.['']?.version!=='1.10.3') process.exit(1)"
          grep -q '## 1.10.3 — 2026-09-04' CHANGELOG.md
          grep -q 'Текущая версия: \*\*1.10.3\*\*' README.md
          test ! -e tools/temporary-v1.10.3-release-patch.mjs
          test ! -e .github/workflows/temporary-v1.10.3-release-patch.yml
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Commit self-cleaned release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare v1.10.3'
          git push origin HEAD:release/v1.10.3
