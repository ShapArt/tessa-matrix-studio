name: Apply preprod feature patch

on:
  push:
    branches: [feat/preprod-mega-uat-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python tools/apply_preprod_patch.py
      - name: Commit patched source and remove patch runner
        run: |
          rm tools/apply_preprod_patch.py .github/workflows/preprod-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make large preview fully reviewable"
          git push origin HEAD:feat/preprod-mega-uat-hardening
