name: v1.14 Recovery Task6 GREEN

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]

permissions:
  contents: write

jobs:
  task6-green:
    if: contains(github.event.head_commit.message, '[task6-green]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.14-recovery-uat-resolution
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Task6 production patch
        run: node tools/patch-task6-merge.mjs
      - name: Verify focused Task6 contracts
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/recovery-task6-contracts.mjs
          node tests/dictionary-projection-refresh.mjs
          node tests/three-way-merge.mjs
          node tests/merge-deletion-integrity.mjs
          node tests/schema-refresh-stale.mjs
          node tests/schema-refresh-delete.mjs
          node tests/schema-refresh-circular-regression.mjs
          node tests/resolution-center.mjs
          node tests/ui-dom.cjs
          git diff --check
      - name: Full regression
        run: npm test
      - name: Commit canonical Task6 patch
        run: |
          if git diff --quiet -- tessa-matrix-studio.user.js package.json; then
            echo 'No Task6 production diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js package.json
          git commit -m 'fix: harden dictionary refresh and three-way merge'
          git push origin HEAD:fix/v1.14-recovery-uat-resolution
