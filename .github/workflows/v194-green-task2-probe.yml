name: v1.9.40 Task 2 probe GREEN

on:
  push:
    branches: [feat/v1.9.40-self-check-reconciliation]
    paths: [.github/workflows/v194-green-task2-probe.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Task 2 probe patch
        run: python scripts/v194_task2_probe_green.py
      - name: Verify probe GREEN
        run: node --check tessa-matrix-studio.user.js && node tests/runtime-capability-probe.mjs && node tests/runtime-capabilities.mjs && node tests/smoke.mjs && node tests/acceptance.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Commit Task 2 probe GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --check
          git commit -m "feat: probe TESSA runtime capabilities read-only"
          git push origin HEAD:feat/v1.9.40-self-check-reconciliation
      # retry 2: state helper receives matrixInfo + read-only localizer
