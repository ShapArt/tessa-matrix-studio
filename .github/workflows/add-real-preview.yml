name: Add real Studio preview screenshot

on:
  push:
    branches: [docs/real-preview]
    paths:
      - .github/workflows/add-real-preview.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and verify real screenshot
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/preview.part*.b64 | base64 --decode > docs/assets/studio-preview.webp
          echo "b1deaa54e2b4a35d04f60e4b8e86b3c6b9eb2f850c43f93c48a7bd403c3730bc  docs/assets/studio-preview.webp" | sha256sum --check --strict

          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          needle = '''5. Проверьте итоговые счётчики и каждую затронутую строку.\n\nStudio показывает:'''
          block = '''5. Проверьте итоговые счётчики и каждую затронутую строку.\n\n<div align="center">\n  <img src="docs/assets/studio-preview.webp" alt="Реальный preview изменений TESSA Matrix Studio" width="560">\n  <br><sub>Реальный preview: Studio показывает замену строки до записи в TESSA</sub>\n</div>\n\nStudio показывает:'''
          if needle not in s:
              raise SystemExit('README insertion point not found')
          p.write_text(s.replace(needle, block, 1), encoding='utf-8')
          PY

      - name: Commit clean documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .tmp
          git rm .github/workflows/add-real-preview.yml
          git add README.md docs/assets/studio-preview.webp
          git commit -m "Add real Studio preview screenshot to README"
          git push
