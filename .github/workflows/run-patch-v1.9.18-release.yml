name: Run v1.9.18 release metadata patch

on:
  push:
    branches:
      - fix/preflight-dependent-delete-v1.9.18

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/preflight-dependent-delete-v1.9.18
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply release metadata patch
        run: node .github/patch-v1.9.18-release.mjs
      - name: Verify release metadata and regressions
        run: npm test
      - name: Commit release metadata and remove helpers
        run: |
          rm -f .github/patch-v1.9.18-release.mjs
          rm -f .github/workflows/run-patch-v1.9.18-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare v1.9.18"
          git push origin HEAD:fix/preflight-dependent-delete-v1.9.18
