name: Verify live RoleID index cache

on:
  push:
    branches: [fix/cross-matrix-live-role-preflight]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply index-cache refactor
        run: node tools/patch-live-role-index-cache.mjs
      - name: Verify targeted stale RoleID regression
        run: node tests/cross-matrix-live-role-preflight.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --quiet && exit 0
          git commit -m "perf: cache live RoleID preflight index"
          git push origin HEAD:fix/cross-matrix-live-role-preflight
