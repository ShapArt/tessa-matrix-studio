name: Temporary v1.11 Preview RED

on:
  push:
    branches: [feat/v1.11-preview-support-ux]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run v1.11 RED regression
        run: node tests/preview-support-ux.mjs
