name: v1.9.39 message fix

on:
  push:
    branches:
      - feat/v1.9.39-post-apply-ux
    paths:
      - .github/workflows/v1939-message-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1.9.39-post-apply-ux
          fetch-depth: 0
      - name: Keep fresh-check guidance after successful Apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tessa-matrix-studio.user.js')
          s = p.read_text(encoding='utf-8')
          old = 'return `Готово. Применено: ${applied} из ${requested}.\\nВсе подготовленные изменения применены.${sourceNote}${refreshNote}`;'
          new = 'return `Готово. Применено: ${applied} из ${requested}.\\nВсе подготовленные изменения применены.${sourceNote}${refreshNote}\\nПеред следующим Apply нужна свежая проверка или свежая выгрузка Excel.`;'
          if old not in s:
              raise SystemExit('completed-result marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check tessa-matrix-studio.user.js
          node tests/apply-source-skips-success.mjs
          node tests/apply-refresh-failure-result.mjs
          node tests/post-apply-view-refresh.mjs
          node tests/sticky-progress-ui.mjs
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/v1939-message-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "fix: keep fresh-check guidance after Apply"
          git push origin HEAD:feat/v1.9.39-post-apply-ux
