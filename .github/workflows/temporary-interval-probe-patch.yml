name: Temporary interval probe patch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 59 &&
      github.actor == 'ShapArt' &&
      (github.event.comment.body == '/interval-probe-helper' || github.event.comment.body == '/interval-probe-integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select bounded patch mode
        id: mode
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$COMMENT_BODY" in
            /interval-probe-helper) echo 'value=helper' >> "$GITHUB_OUTPUT" ;;
            /interval-probe-integration) echo 'value=integration' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unexpected command' >&2; exit 1 ;;
          esac

      - name: Patch diagnostic branch only
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.value }}
          TARGET_BRANCH: diag/interval-structural-probes-v1.10.2
        run: |
          set -euo pipefail
          cp tools/temporary-interval-probe-patch.mjs /tmp/temporary-interval-probe-patch.mjs
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          node /tmp/temporary-interval-probe-patch.mjs "$MODE"
          node --check tessa-matrix-studio.user.js
          git diff --check
          if git diff --quiet -- tessa-matrix-studio.user.js; then
            echo 'Patch already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js
          git commit -m "diag: apply interval probe $MODE patch"
          git push origin "HEAD:$TARGET_BRANCH"
