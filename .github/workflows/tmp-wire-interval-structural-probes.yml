name: Temporary interval probe wiring

on:
  push:
    branches:
      - diag/interval-structural-probes-v1.10.2

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'ShapArt/tessa-matrix-studio' && github.ref == 'refs/heads/diag/interval-structural-probes-v1.10.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diag/interval-structural-probes-v1.10.2
      - name: Apply exact userscript patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          node tools/tmp-wire-interval-structural-probes.mjs
          rm tools/tmp-wire-interval-structural-probes.mjs
          rm .github/workflows/tmp-wire-interval-structural-probes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js tools/tmp-wire-interval-structural-probes.mjs .github/workflows/tmp-wire-interval-structural-probes.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: wire bounded interval structural probes"
          git push origin HEAD:diag/interval-structural-probes-v1.10.2
