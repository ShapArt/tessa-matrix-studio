name: Publish userscript

on:
  push:
    paths:
      - build/tessa-matrix-studio.user.js.xz

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack userscript
        run: xz -dc build/tessa-matrix-studio.user.js.xz > tessa-matrix-studio.user.js

      - name: Verify userscript
        run: |
          node --check tessa-matrix-studio.user.js
          grep -q "@version      1.9.1" tessa-matrix-studio.user.js
          grep -q "@author       Шаповалов Артём" tessa-matrix-studio.user.js
          grep -q "https://tessa.cherkizovsky.net/\*" tessa-matrix-studio.user.js

      - name: Commit published userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          if git diff --cached --quiet; then
            echo "Userscript is already current"
            exit 0
          fi
          git commit -m "Publish userscript v1.9.1"
          git push
