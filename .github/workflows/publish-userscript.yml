name: Finalize release v1.9.1

on:
  push:
    branches: [main]
    paths:
      - build/tms.part04.b64

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble production userscript
        shell: bash
        run: |
          set -euo pipefail
          cat build/tms.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/tessa-matrix-studio.user.js.xz
          echo '4487e7bdac45eaf87287fad4db1f07d38049db5ea2d201d6819a1d5175402bba  /tmp/tessa-matrix-studio.user.js.xz' | sha256sum -c -
          xz -dc /tmp/tessa-matrix-studio.user.js.xz > tessa-matrix-studio.user.js
          echo '910383a9e022931344ffaf56ecef53098cf7aaba329e82b2c0abe4a1a501a8d5  tessa-matrix-studio.user.js' | sha256sum -c -

      - name: Verify release
        run: |
          npm test
          grep -q '@version      1.9.1' tessa-matrix-studio.user.js
          grep -q '@author       Шаповалов Артём' tessa-matrix-studio.user.js
          grep -q 'https://tessa.cherkizovsky.net/\*' tessa-matrix-studio.user.js

      - name: Clean temporary release files
        shell: bash
        run: |
          rm -rf build .build
          rm -f docs/assets/browser-install.svg \
                docs/assets/excel-example.svg \
                docs/assets/excel-rules.svg \
                docs/assets/permissions.svg \
                docs/assets/workflow.svg \
                docs/assets/PLACEHOLDER.txt
          rm -f .github/workflows/publish-userscript.yml

      - name: Commit production tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish TESSA Matrix Studio v1.9.1'
          git push

      - name: Build release archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/tessa-matrix-studio-v1.9.1.zip HEAD
          cp tessa-matrix-studio.user.js dist/tessa-matrix-studio.user.js

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES='TESSA Matrix Studio v1.9.1 — пользовательский релиз. Excel → проверка изменений → безопасное применение в TESSA. Автор: Шаповалов Артём.'
          if gh release view v1.9.1 >/dev/null 2>&1; then
            gh release upload v1.9.1 dist/tessa-matrix-studio.user.js dist/tessa-matrix-studio-v1.9.1.zip --clobber
            gh release edit v1.9.1 --title 'TESSA Matrix Studio v1.9.1' --notes "$NOTES"
          else
            gh release create v1.9.1 dist/tessa-matrix-studio.user.js dist/tessa-matrix-studio-v1.9.1.zip \
              --title 'TESSA Matrix Studio v1.9.1' --notes "$NOTES" --target main
          fi
