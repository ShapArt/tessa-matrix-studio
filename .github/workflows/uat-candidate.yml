name: UAT Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to package for live TESSA UAT
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build exact UAT artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify candidate source
        run: npm test
      - name: Build exact candidate
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npm run build:uat
          mkdir -p dist
          cp tessa-matrix-studio.user.js dist/tessa-matrix-studio.uat.user.js
          node --check dist/tessa-matrix-studio.uat.user.js
          grep -Fqx "// @version      $VERSION" dist/tessa-matrix-studio.uat.user.js
          grep -Fq '__TMS_FULL_UAT_V1__' dist/tessa-matrix-studio.uat.user.js
          grep -Fq '__TESSA_MATRIX_SYNC_EXPORTS__' dist/tessa-matrix-studio.uat.user.js
          grep -Fq 'TESSA_MATRIX_ROUNDTRIP_V7' dist/tessa-matrix-studio.uat.user.js
          grep -Fq 'TESSA_MATRIX_SUPPORT_BUNDLE_V1' dist/tessa-matrix-studio.uat.user.js
          awk 'BEGIN { emit=0 } /^\/\/ ==UserScript==/ { emit=1 } emit { print } /^\/\/ ==\/UserScript==/ { exit }' \
            dist/tessa-matrix-studio.uat.user.js > dist/tessa-matrix-studio.meta.js
          (
            cd dist
            sha256sum tessa-matrix-studio.meta.js tessa-matrix-studio.uat.user.js > SHA256SUMS.txt
            zip -q "tessa-matrix-studio-v${VERSION}-UAT.zip" \
              tessa-matrix-studio.uat.user.js tessa-matrix-studio.meta.js SHA256SUMS.txt
          )
          USER_SHA="$(sha256sum dist/tessa-matrix-studio.uat.user.js | awk '{print $1}')"
          COMMIT_SHA="$(git rev-parse HEAD)"
          node -e "const fs=require('fs'); fs.writeFileSync('dist/candidate-manifest.json', JSON.stringify({format:'TESSA_MATRIX_UAT_CANDIDATE_V1',version:process.argv[1],commit:process.argv[2],userscriptSha256:process.argv[3],profile:'uat'},null,2)+'\\n')" "$VERSION" "$COMMIT_SHA" "$USER_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload exact UAT candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tessa-matrix-studio-uat-v${{ steps.version.outputs.version }}-${{ github.run_id }}
          path: |
            dist/tessa-matrix-studio.uat.user.js
            dist/tessa-matrix-studio.meta.js
            dist/SHA256SUMS.txt
            dist/tessa-matrix-studio-v${{ steps.version.outputs.version }}-UAT.zip
            dist/candidate-manifest.json
          if-no-files-found: error
          retention-days: 14
