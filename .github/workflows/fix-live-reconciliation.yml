name: Fix live reconciliation regression

on:
  push:
    branches: [fix/excel-row-sync-1.12.0]
    paths:
      - 'tessa-matrix-studio.user.js'
      - 'tests/apply-verification-accounting.mjs'
      - 'tests/reconciliation.mjs'
      - 'tools/apply-live-reconciliation-hotfix.mjs'
      - '.github/workflows/fix-live-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/excel-row-sync-1.12.0
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Detect whether production patch is needed
        id: state
        shell: bash
        run: |
          if grep -q "mode: 'targeted-receipts'" tessa-matrix-studio.user.js \
             && grep -q 'result.appliedCount = result.acceptedCount' tessa-matrix-studio.user.js; then
            echo 'need_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'need_patch=true' >> "$GITHUB_OUTPUT"
          fi
      - name: RED - prove both live regressions fail before the fix
        if: steps.state.outputs.need_patch == 'true'
        shell: bash
        run: |
          set +e
          node tests/apply-verification-accounting.mjs
          accounting_rc=$?
          node tests/reconciliation.mjs
          reconciliation_rc=$?
          set -e
          if [[ "$accounting_rc" -eq 0 ]]; then
            echo '::error::Accounting regression test unexpectedly passed before the production fix.'
            exit 1
          fi
          if [[ "$reconciliation_rc" -eq 0 ]]; then
            echo '::error::Native-view reconciliation regression test unexpectedly passed before the production fix.'
            exit 1
          fi
          echo "RED confirmed: accounting=$accounting_rc reconciliation=$reconciliation_rc"
      - name: Apply minimal production fix
        if: steps.state.outputs.need_patch == 'true'
        run: node tools/apply-live-reconciliation-hotfix.mjs
      - name: GREEN - targeted regressions
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/apply-verification-accounting.mjs
          node tests/reconciliation.mjs
      - name: Full regression suite
        run: npm test
      - name: Commit verified production fix
        if: steps.state.outputs.need_patch == 'true'
        shell: bash
        run: |
          if git diff --quiet -- tessa-matrix-studio.user.js; then
            echo '::error::Patch was requested but userscript did not change.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js
          git commit -m 'fix: separate Apply writes from readback verification'
          git push origin HEAD:fix/excel-row-sync-1.12.0
