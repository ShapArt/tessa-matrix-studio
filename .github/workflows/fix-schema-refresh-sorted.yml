name: Finalize v1.9.7 schema refresh fix

on:
  push:
    branches:
      - fix/schema-refresh-sorted-overwrite-v1.9.7

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/schema-refresh-sorted-overwrite-v1.9.7
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump release metadata to v1.9.7
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, text) { fs.writeFileSync(path, text, 'utf8'); }
          function replaceExact(path, from, to) {
            const text = read(path);
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one ${JSON.stringify(from)}, got ${count}`);
            write(path, text.replace(from, to));
          }

          replaceExact('tessa-matrix-studio.user.js', '// @version      1.9.6', '// @version      1.9.7');
          replaceExact('tessa-matrix-studio.user.js', "version: '1.9.6',", "version: '1.9.7',");
          replaceExact('package.json', '"version": "1.9.6"', '"version": "1.9.7"');
          replaceExact('tests/smoke.mjs', "assert(code.includes('// @version      1.9.6'), 'wrong userscript version');", "assert(code.includes('// @version      1.9.7'), 'wrong userscript version');");
          replaceExact('.github/ISSUE_TEMPLATE/bug_report.yml', 'placeholder: 1.9.6', 'placeholder: 1.9.7');

          const readme = read('README.md');
          const count = readme.split('1.9.6').length - 1;
          if (count < 3) throw new Error(`README version references unexpected: ${count}`);
          write('README.md', readme.replaceAll('1.9.6', '1.9.7'));

          const changelog = read('CHANGELOG.md');
          const marker = '# Changelog\n\n';
          if (!changelog.startsWith(marker)) throw new Error('CHANGELOG header mismatch');
          if (changelog.includes('## 1.9.7 — 2026-08-27')) throw new Error('v1.9.7 changelog already exists');
          const entry = [
            '## 1.9.7 — 2026-08-27',
            '',
            '- исправлено обновление Excel-схемы после сортировки и overwrite существующей строки;',
            '- `mergeWorkbookIntoCurrentSnapshot()` теперь сопоставляет повторяющуюся identity источника с пропавшей identity цели по тем же правилам, что основной planner;',
            '- regression подтверждает, что schema refresh сохраняет исходные A/C и переносит копию только в целевую B.',
            '',
          ].join('\n');
          write('CHANGELOG.md', marker + entry + changelog.slice(marker.length));
          NODE

      - name: Verify full suite
        run: npm test

      - name: Commit release-ready fix and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-schema-refresh-sorted.yml
          git add tessa-matrix-studio.user.js package.json README.md CHANGELOG.md tests/smoke.mjs .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m 'v1.9.7 — finalize schema refresh fix'
          git push origin HEAD:fix/schema-refresh-sorted-overwrite-v1.9.7
