name: Finalize v1.9.8 stale overwrite safety

on:
  push:
    branches:
      - fix/stale-overwrite-source-v1.9.8

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/stale-overwrite-source-v1.9.8
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump release metadata to v1.9.8
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, text) { fs.writeFileSync(path, text, 'utf8'); }
          function replaceExact(path, from, to) {
            const text = read(path);
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one ${JSON.stringify(from)}, got ${count}`);
            write(path, text.replace(from, to));
          }

          replaceExact('tessa-matrix-studio.user.js', '// @version      1.9.7', '// @version      1.9.8');
          replaceExact('tessa-matrix-studio.user.js', "version: '1.9.7',", "version: '1.9.8',");
          replaceExact('package.json', '"version": "1.9.7"', '"version": "1.9.8"');
          replaceExact('tests/smoke.mjs', "assert(code.includes('// @version      1.9.7'), 'wrong userscript version');", "assert(code.includes('// @version      1.9.8'), 'wrong userscript version');");
          replaceExact('.github/ISSUE_TEMPLATE/bug_report.yml', 'placeholder: 1.9.7', 'placeholder: 1.9.8');

          const readme = read('README.md');
          const refs = readme.split('1.9.7').length - 1;
          if (refs < 3) throw new Error(`README version references unexpected: ${refs}`);
          write('README.md', readme.replaceAll('1.9.7', '1.9.8'));

          const changelog = read('CHANGELOG.md');
          const marker = '# Changelog\n\n';
          if (!changelog.startsWith(marker)) throw new Error('CHANGELOG header mismatch');
          if (changelog.includes('## 1.9.8 — 2026-08-27')) throw new Error('v1.9.8 changelog already exists');
          const entry = [
            '## 1.9.8 — 2026-08-27',
            '',
            '- заблокирована операция ЗАМЕНИТЬ, если исходная строка копии изменилась в TESSA после выгрузки Excel;',
            '- stale-check overwrite теперь проверяет fingerprint source identity, а не только целевой строки;',
            '- при таком SKIP целевая строка резервируется и не может попасть в неявный DELETE.',
            '',
          ].join('\n');
          write('CHANGELOG.md', marker + entry + changelog.slice(marker.length));
          NODE

      - name: Verify full suite
        run: npm test

      - name: Commit release-ready fix and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-stale-overwrite-source.yml
          git add tessa-matrix-studio.user.js package.json README.md CHANGELOG.md tests/smoke.mjs .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m 'v1.9.8 — finalize stale overwrite safety'
          git push origin HEAD:fix/stale-overwrite-source-v1.9.8
