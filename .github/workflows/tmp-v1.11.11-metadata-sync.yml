name: Temporary v1.11.11 metadata sync

on:
  push:
    branches:
      - fix/v1.11.11-interval-fallback-evidence

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[metadata-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.11.11-interval-fallback-evidence
          fetch-depth: 0

      - name: Synchronize v1.11.11 metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const VERSION = '1.11.11';
          const PREVIOUS = '1.11.10';

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = VERSION;
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = VERSION;
          if (lock.packages?.['']) lock.packages[''].version = VERSION;
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replaceAll(PREVIOUS, VERSION);
          fs.writeFileSync(readmePath, readme);

          const issuePath = '.github/ISSUE_TEMPLATE/bug_report.yml';
          let issue = fs.readFileSync(issuePath, 'utf8');
          issue = issue.replace(`placeholder: ${PREVIOUS}`, `placeholder: ${VERSION}`);
          fs.writeFileSync(issuePath, issue);

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const heading = `## ${VERSION} — 2026-09-08`;
          if (!changelog.includes(heading)) {
            const entry = `${heading}\n\n` +
              `- Для live-блокера #57 Preview/support evidence теперь явно фиксирует обе попытки guarded interval fallback, если и обычный CardNew, и повтор через \`CardNewMode.Valid\` завершаются тем же \`duplicate-interval-extractor / LeftOperandExtractor is null\`. В причине безопасно отображается \`CardNewMode.Default=extractor-error; CardNewMode.Valid=extractor-error\`, поэтому результат больше не зависит от порядка запуска Preview и отдельной диагностики.\n` +
              `- Семантика записи не менялась: второй CardNew по-прежнему создаётся только после известного extractor failure, та же желаемая строка снова проходит тот же серверный \`ValidateDuplicate\`, а повторный extractor failure снова выбрасывается наружу и блокирует Store.\n` +
              `- Реальный duplicate и любые посторонние серверные ошибки не переопределяются; успешный \`CardNewMode.Valid\` по-прежнему должен быть подтверждён сервером до попадания строки в prepared ADD. Store/Delete и fail-closed границы остаются без изменений.\n` +
              `- Добавлена RED→GREEN регрессия на live-сценарий «Default rejected + Valid rejected»: до исправления Preview содержал только \`LeftOperandExtractor is null\`, после исправления содержит исходную ошибку и обе mode/outcome метки. Issue #57 остаётся OPEN до успешного live \`ValidateDuplicate\` на реальной TESSA.\n\n`;
            changelog = changelog.replace('# Changelog\n\n', `# Changelog\n\n${entry}`);
            fs.writeFileSync(changelogPath, changelog);
          }
          NODE

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml
          if git diff --cached --quiet; then
            echo "Metadata already synchronized."
            exit 0
          fi
          git commit -m "chore: sync v1.11.11 release metadata [metadata-sync]"
          git push origin HEAD:fix/v1.11.11-interval-fallback-evidence
