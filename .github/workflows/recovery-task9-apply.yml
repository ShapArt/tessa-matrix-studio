name: v1.14 Recovery Task9 APPLY

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]

permissions:
  contents: write

jobs:
  task9-apply:
    if: contains(github.event.head_commit.message, '[task9-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply deterministic Task9 production patch
        run: python scripts/recovery-task9-apply.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check tessa-matrix-studio.user.js
      - name: Task9 focused contract
        run: node tests/recovery-task9-destructive-restore.mjs
      - name: Full regression
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          if git diff --cached --quiet; then
            echo "No production diff to commit."
            exit 0
          fi
          git commit -m "feat: make destructive UAT self-restoring [task9-green]"
          git push origin HEAD:fix/v1.14-recovery-uat-resolution
