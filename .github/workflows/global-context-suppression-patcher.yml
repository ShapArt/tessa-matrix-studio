name: Apply global context suppression patch

on:
  push:
    branches:
      - fix/global-context-preview-suppression
    paths:
      - .github/workflows/global-context-suppression-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/global-context-preview-suppression
          fetch-depth: 0
      - name: Patch userscript
        run: python3 scripts/patch_global_context_suppression.py
      - name: Commit patched source and remove patcher
        run: |
          rm scripts/patch_global_context_suppression.py .github/workflows/global-context-suppression-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js scripts/patch_global_context_suppression.py .github/workflows/global-context-suppression-patcher.yml
          git commit -m "fix: suppress row spam for global workbook blockers"
          git push origin HEAD:fix/global-context-preview-suppression
