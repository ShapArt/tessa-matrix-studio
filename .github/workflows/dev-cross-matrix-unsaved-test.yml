name: Cross-matrix unsaved guard GREEN

on:
  push:
    branches:
      - feat/cross-matrix-replacement
    paths:
      - tests/main-card-unsaved-guard.mjs
      - tools/dev-cross-matrix-unsaved-test.mjs
      - .github/workflows/dev-cross-matrix-unsaved-test.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cross-matrix-replacement
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Add guard to permanent suite
        run: node tools/dev-cross-matrix-unsaved-test.mjs
      - name: Focused guard regression
        run: node tests/main-card-unsaved-guard.mjs
      - name: Full regression suite
        run: npm test
      - name: Commit verified package change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "No package change to commit"
            exit 0
          fi
          git commit -m "test: keep unsaved main-card guard in regression suite"
          git push origin HEAD:feat/cross-matrix-replacement
