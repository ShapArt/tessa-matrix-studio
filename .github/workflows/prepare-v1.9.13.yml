name: Prepare v1.9.13

on:
  push:
    branches:
      - fix/latest-tampermonkey-update-v1.9.13

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/latest-tampermonkey-update-v1.9.13
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply delivery fix
        run: python .github/prepare_v1_9_13.py
      - name: Verify full regression suite
        run: npm test
      - name: Commit release-ready tree and remove helpers
        run: |
          git config user.name "ShapArt"
          git config user.email "100069322+ShapArt@users.noreply.github.com"
          git rm .github/prepare_v1_9_13.py .github/workflows/prepare-v1.9.13.yml
          git add -A
          git diff --cached --check
          git commit -m "v1.9.13 — fix Tampermonkey latest install and updates"
          git push origin HEAD:fix/latest-tampermonkey-update-v1.9.13
