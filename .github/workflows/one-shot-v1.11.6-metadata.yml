name: One-shot v1.11.6 metadata

on:
  push:
    branches: [diag/v1.11.6-cardnew-valid]

permissions:
  contents: write

jobs:
  metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diag/v1.11.6-cardnew-valid
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Synchronize v1.11.6 metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          script_path = Path('tessa-matrix-studio.user.js')
          script = script_path.read_text(encoding='utf-8')
          for old, new in [
              ('// @version      1.11.5', '// @version      1.11.6'),
              ("    version: '1.11.5',", "    version: '1.11.6',"),
          ]:
              if script.count(old) != 1:
                  raise SystemExit(f'userscript version marker expected once: {old}')
              script = script.replace(old, new, 1)
          script_path.write_text(script, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          if package.get('version') != '1.11.5':
              raise SystemExit(f'unexpected package version: {package.get("version")}')
          package['version'] = '1.11.6'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          if lock.get('version') != '1.11.5' or lock.get('packages', {}).get('', {}).get('version') != '1.11.5':
              raise SystemExit('unexpected package-lock version')
          lock['version'] = '1.11.6'
          lock['packages']['']['version'] = '1.11.6'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          replacements = {
              'version-1.11.5-': 'version-1.11.6-',
              '**v1.11.5 · Автор: Шаповалов Артём**': '**v1.11.6 · Автор: Шаповалов Артём**',
              'Подтвердите установку версии **1.11.5**': 'Подтвердите установку версии **1.11.6**',
              'Текущая версия: **1.11.5**': 'Текущая версия: **1.11.6**',
          }
          for old, new in replacements.items():
              if old not in readme:
                  raise SystemExit(f'README marker missing: {old}')
              readme = readme.replace(old, new, 1)
          readme_path.write_text(readme, encoding='utf-8')

          bug_path = Path('.github/ISSUE_TEMPLATE/bug_report.yml')
          bug = bug_path.read_text(encoding='utf-8')
          if 'placeholder: 1.11.5' not in bug:
              raise SystemExit('bug template version marker missing')
          bug_path.write_text(bug.replace('placeholder: 1.11.5', 'placeholder: 1.11.6', 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          if marker not in changelog:
              raise SystemExit('CHANGELOG header missing')
          if '## 1.11.6 —' in changelog:
              raise SystemExit('1.11.6 changelog entry already exists')
          entry = '''## 1.11.6 — 2026-09-07

          - Расширена безопасная диагностика серверной ошибки `LeftOperandExtractor is null`: если сохранённая строка проходит проверку, а новый `CardNew` с интервалом продолжает падать после всех ограниченных структурных проб, Studio выполняет ещё один независимый контроль через `CardNewMode.Valid`.
          - Контроль `CardNewMode.Valid` остаётся только диагностическим: обычный `createRowCard`, Preview/Apply и запись новых строк по-прежнему используют штатный режим CardNew без принудительной подмены `newMode`.
          - Новый контроль выполняет только `CardNew` + `ValidateDuplicate`; `Store` и `Delete` не вызываются. Если `CardNewMode.Valid` отсутствует в runtime TESSA, запрос не отправляется и это фиксируется отдельным `not-sent` результатом.
          - Диагностический прогон остаётся ограниченным по числу запросов и запускает `Valid` только после того, как более узкие проверки маркеров/структуры не объяснили ошибку.
          - Добавлены регрессии на неизменность production CardNew, точное использование runtime enum `CardNewMode.Valid`, бюджет запросов и нулевое число операций записи.
          - Issue #57 остаётся открытым до получения свежего live-отчёта: релиз добавляет доказательный контроль и не обходит серверную duplicate validation.

          '''
          entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.splitlines()) + '\n'
          changelog_path.write_text(changelog.replace(marker, marker + entry, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow from release tree
        run: rm .github/workflows/one-shot-v1.11.6-metadata.yml
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify full regression suite
        run: npm test
      - name: Commit verified v1.11.6 metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tessa-matrix-studio.user.js package.json package-lock.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml .github/workflows/one-shot-v1.11.6-metadata.yml
          git diff --cached --quiet && { echo "No metadata changes generated"; exit 1; }
          git commit -m "release: prepare v1.11.6 interval diagnostics"
          git push origin HEAD:diag/v1.11.6-cardnew-valid
