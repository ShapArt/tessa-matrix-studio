name: Restore full changelog

on:
  push:
    branches:
      - feat/preprod-mega-uat-hardening
    paths:
      - .github/workflows/restore-changelog-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - name: Restore and patch changelog
        shell: bash
        run: |
          git show f0921874564228bb04a82add3035ed81c861c929:CHANGELOG.md > /tmp/CHANGELOG.full.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/CHANGELOG.full.md')
          text = p.read_text(encoding='utf-8')
          marker = '- долгие проверки теперь показывают понятный этап `1/6 … 6/6`'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('v1.9.32 progress marker not found')
          additions = (
              '- selective review теперь одинаково управляет всеми типами мутаций: UPDATE можно исключать целиком или по отдельным полям, ADD и DELETE можно целиком переключить в «Не применять» и затем вернуть до Apply; счётчики и фактический Apply-план пересчитываются по выбранным операциям;\n'
              '- отдельный браузерный `confirm()` только для DELETE удалён как дублирующий: количество удалений остаётся в общем подтверждении Apply, а destructive delete-guards, свежий preflight и store-time проверки не ослаблены;\n'
              '- глубокий ADD-preflight больше не выглядит зависшим до первого ответа TESSA: перед сетевой проверкой показывается `0 из N · жду ответ TESSA`, во время ожидания раз в секунду обновляется elapsed-time heartbeat, а после первых завершённых операций используется обычный счётчик и ETA;\n'
          )
          text = text[:idx] + additions + text[idx:]
          Path('CHANGELOG.md').write_text(text, encoding='utf-8')
          PY
      - name: Commit restored changelog and remove runner
        shell: bash
        run: |
          rm -f .github/workflows/restore-changelog-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/restore-changelog-patcher.yml
          git commit -m 'docs: restore full changelog with Apply UX notes'
          git push origin HEAD:feat/preprod-mega-uat-hardening
