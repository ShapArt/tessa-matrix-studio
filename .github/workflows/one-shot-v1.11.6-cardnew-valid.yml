name: One-shot v1.11.6 CardNewMode diagnostic

on:
  push:
    branches: [diag/v1.11.6-cardnew-valid]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diag/v1.11.6-cardnew-valid
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply diagnostic patch
        run: node tools/apply-v1.11.6-cardnew-valid.mjs
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify focused regression
        run: node tests/interval-proposed-add-probes.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Commit verified production diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js tests/interval-diagnostics.mjs
          git diff --cached --quiet && { echo "No production change generated"; exit 1; }
          git commit -m "diag: compare CardNewMode.Valid for interval duplicate-check"
          git push origin HEAD:diag/v1.11.6-cardnew-valid
