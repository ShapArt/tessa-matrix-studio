name: v1.14 Recovery Focused

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Focused recovery contracts
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/full-uat-runner-contract.mjs
          node tests/cross-matrix-context.mjs
          node tests/matrix-identity-authority.mjs
          node tests/employee-name-resolver.mjs
          node tests/three-way-merge.mjs
          node tests/changes-report-xlsx.mjs
          node tests/changes-report-ui.mjs
          node tests/apply-source-skips-success.mjs
          git diff --check
