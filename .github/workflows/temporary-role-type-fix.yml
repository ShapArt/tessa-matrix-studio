name: Temporary Role-Type Fix

on:
  push:
    branches: [fix/v1.10.0-dictionaries-merge]
    paths:
      - scripts/patch-function-role-type-catalog.mjs
      - .github/workflows/temporary-role-type-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v1.10.0-dictionaries-merge
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply source patch
        run: node scripts/patch-function-role-type-catalog.mjs

      - name: Verify focused regression
        run: node tests/function-role-type-catalog.mjs

      - name: Verify complete suite
        run: npm test

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tessa-matrix-studio.user.js; then
            echo "Source already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git commit -m "fix: filter function pickers by TESSA role type"
          git push origin HEAD:fix/v1.10.0-dictionaries-merge
