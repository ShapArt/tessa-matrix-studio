name: GREEN Task1 performance cache

on:
  push:
    branches: [feat/incremental-performance-v1.14]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply task1 implementation
        run: node tools/patch-task1-performance-cache.mjs
      - name: Verify task1 contracts
        run: |
          node tests/performance-telemetry.mjs
          node tests/session-matrix-cache.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --quiet && exit 0
          git commit -m "perf: add session matrix cache and telemetry"
          git push origin HEAD:feat/incremental-performance-v1.14
