name: Patch v1.9.15 QA pack

on:
  push:
    branches:
      - feature/qa-hardening-v1.9.15
    paths:
      - .github/workflows/patch-v1.9.15-qa-pack.yml
      - tools/patch-v1.9.15-qa-pack.cjs
      - tools/qa-block-v1.9.15.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/qa-hardening-v1.9.15
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply QA pack patch
        run: node tools/patch-v1.9.15-qa-pack.cjs
      - name: Verify full regression suite
        run: npm test
      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-v1.9.15-qa-pack.yml
          rm tools/patch-v1.9.15-qa-pack.cjs
          rm tools/qa-block-v1.9.15.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js .github/workflows/patch-v1.9.15-qa-pack.yml tools/patch-v1.9.15-qa-pack.cjs tools/qa-block-v1.9.15.txt
          git commit -m 'feat: add matrix-bound QA workbook pack'
          git push origin HEAD:feature/qa-hardening-v1.9.15
