name: Patch v1.9.38 docs

on:
  push:
    branches:
      - fix/v1.9.38-global-blocker-uat
    paths:
      - .github/workflows/patch-v1938-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v1.9.38-global-blocker-uat
          fetch-depth: 0
      - name: Patch docs
        run: python3 scripts/patch_v1938_docs.py
      - name: Commit and self-remove
        shell: bash
        run: |
          rm scripts/patch_v1938_docs.py .github/workflows/patch-v1938-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml scripts/patch_v1938_docs.py .github/workflows/patch-v1938-docs.yml
          git commit -m "docs: sync v1.9.38 global blocker release notes"
          git push origin HEAD:fix/v1.9.38-global-blocker-uat
