name: Temporary v1.9.19 patch

on:
  workflow_dispatch:
  push:
    branches:
      - fix/dependent-delete-missing-columns-v1.9.19
    paths:
      - scripts/patch-v1.9.19.cjs
      - scripts/patch-v1.9.19-docs.cjs
      - .github/workflows/patch-v1.9.19.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependent-delete-missing-columns-v1.9.19
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply production patch
        run: |
          node scripts/patch-v1.9.19.cjs
          node scripts/patch-v1.9.19-docs.cjs
      - name: Full regression suite
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit patch and remove helper
        run: |
          rm -f scripts/patch-v1.9.19.cjs scripts/patch-v1.9.19-docs.cjs .github/workflows/patch-v1.9.19.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: parser, manual UAT cleanup, and DELETE dependencies"
          git push origin HEAD:fix/dependent-delete-missing-columns-v1.9.19
