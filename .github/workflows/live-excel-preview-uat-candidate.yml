name: v1.16.3 Full UAT Preflight Recovery Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'hotfixes/v1.14.2-live-excel-preview-ux.mjs'
      - 'hotfixes/v1.14.2-preview-counter-filters.mjs'
      - 'hotfixes/v1.14.2-full-uat-scope-fix.mjs'
      - 'hotfixes/v1.14.2-full-uat-deterministic-clear.mjs'
      - 'hotfixes/v1.14.2-full-uat-version-provenance.mjs'
      - 'hotfixes/v1.14.2-full-uat-copied-identity-collision-safe.mjs'
      - 'hotfixes/v1.14.2-full-uat-action-coverage-final.mjs'
      - 'hotfixes/v1.16.2-full-uat-pinned-context.mjs'
      - 'hotfixes/v1.16.3-full-uat-preflight-recovery.mjs'
      - 'tests/live-colleague-excel-regressions.mjs'
      - 'tests/v1.14.2-full-uat-clear-regression.mjs'
      - 'tests/v1.14.2-full-uat-version-provenance.mjs'
      - 'tests/v1.14.2-full-uat-copied-identity-regression.mjs'
      - 'tests/v1.14.2-full-uat-action-coverage-regression.mjs'
      - 'tests/v1.16.2-full-uat-pinned-context.mjs'
      - 'tests/v1.16.3-full-uat-preflight-recovery.mjs'
      - 'tests/v1.16.3-full-uat-readonly-runtime.mjs'
      - 'tests/employee-name-resolver.mjs'
      - 'tests/prod-shadow-workload-profile.mjs'
      - 'tests/prod-shadow-cross-matrix-scale.mjs'
      - 'tests/full-uat-runner-contract.mjs'
      - 'tests/coverage-manifest.json'
      - 'docs/TEST-STRATEGY.md'
      - 'tessa-matrix-studio.user.js'
      - 'tests/fixtures/live-ord-main-78792326-regression.json'
      - 'tests/v1.14-artifact-composition.mjs'
      - '.github/workflows/live-excel-preview-uat-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build exact v1.16.3 UAT artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repository regression suite
        run: npm test

      - name: Verify exact composition contract
        run: node tests/v1.14-artifact-composition.mjs

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_VERSION='1.16.3'
          mkdir -p dist
          cp tessa-matrix-studio.user.js dist/tessa-matrix-studio.user.js

          node hotfixes/malformed-range-diagnostic-transform.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.13.0-user-row-lifecycle-transform.mjs dist/tessa-matrix-studio.user.js

          sed -i -E "0,/^\/\/ @version[[:space:]]+[0-9.]+$/s//\/\/ @version      $CANDIDATE_VERSION/" dist/tessa-matrix-studio.user.js
          sed -i -E "0,/^[[:space:]]+version: '[0-9.]+'[,]$/s//    version: '$CANDIDATE_VERSION',/" dist/tessa-matrix-studio.user.js

          printf '\n' >> dist/tessa-matrix-studio.user.js
          cat hotfixes/interval-add-valid-fallback.js >> dist/tessa-matrix-studio.user.js
          printf '\n' >> dist/tessa-matrix-studio.user.js

          node hotfixes/v1.13.0-full-uat-live-finalize.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14-full-uat-inline-failures.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14-live-uat-final-four.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.1-changes-report-full-row.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.2-live-excel-preview-ux.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.2-preview-counter-filters.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.2-full-uat-scope-fix.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.2-full-uat-deterministic-clear.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.2-full-uat-copied-identity-collision-safe.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.2-full-uat-action-coverage-final.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.14.2-full-uat-version-provenance.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.15.10-live-stability.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.16.2-full-uat-pinned-context.mjs dist/tessa-matrix-studio.user.js
          node hotfixes/v1.16.3-full-uat-preflight-recovery.mjs dist/tessa-matrix-studio.user.js

          node --check dist/tessa-matrix-studio.user.js
          grep -Fqx "// @version      $CANDIDATE_VERSION" dist/tessa-matrix-studio.user.js
          grep -Fq "version: '$CANDIDATE_VERSION'," dist/tessa-matrix-studio.user.js
          grep -Fq 'REVIEWED_CHANGES_REPORT_V3' dist/tessa-matrix-studio.user.js
          grep -Fq 'LIVE_EXCEL_PREVIEW_UX_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'LIVE_PICKER_DELIMITER_SAFE_V2' dist/tessa-matrix-studio.user.js
          grep -Fq 'PREVIEW_COUNTER_FILTERS_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'LIVE_EXCEL_FULL_UAT_SCOPE_FIX_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'FULL_UAT_CLEAR_SCENARIO_DETERMINISTIC_V2' dist/tessa-matrix-studio.user.js
          grep -Fq 'FULL_UAT_VERSION_PROVENANCE_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'FULL_UAT_COPIED_IDENTITY_COLLISION_SAFE_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'FULL_UAT_ACTION_COVERAGE_FINAL_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'FULL_UAT_PINNED_CONTEXT_RECOVERY_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'FULL_UAT_PREFLIGHT_RECOVERY_STATE_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'FULL_UAT_UI_PREFLIGHT_V1' dist/tessa-matrix-studio.user.js
          grep -Fq "'action-apply'" dist/tessa-matrix-studio.user.js
          grep -Fq "'action-reconcile'" dist/tessa-matrix-studio.user.js
          grep -Fq 'await E.runReconciliationRead(' dist/tessa-matrix-studio.user.js
          if grep -Fq 'Не найдено доказанно необязательное заполненное поле временной строки' dist/tessa-matrix-studio.user.js; then
            echo 'Flaky Full UAT CLEAR NOT_RUN branch is still present.' >&2
            exit 1
          fi
          grep -Fq 'const text = E.pickerSelectionText([item]);' dist/tessa-matrix-studio.user.js
          grep -Fq 'const summary = E.previewAttentionSummary(syntheticPlan, E.createPlanReviewState());' dist/tessa-matrix-studio.user.js
          grep -Fq 'const windowed = E.resolutionCenterWindow(' dist/tessa-matrix-studio.user.js
          grep -Fq 'live-colleague-picker-multi-position' dist/tessa-matrix-studio.user.js
          grep -Fq 'live-colleague-preview-attention' dist/tessa-matrix-studio.user.js
          grep -Fq 'live-colleague-preview-counter-filters' dist/tessa-matrix-studio.user.js
          grep -Fq 'data-preview-counter-filter="add"' dist/tessa-matrix-studio.user.js
          grep -Fq 'aria-pressed=' dist/tessa-matrix-studio.user.js
          if grep -Fq 'class="tms-preview-filters"' dist/tessa-matrix-studio.user.js; then
            echo 'Duplicated lower Preview filter bar is still present.' >&2
            exit 1
          fi
          grep -Fq 'Не будет применено к TESSA' dist/tessa-matrix-studio.user.js
          grep -Fq 'data-resolution-page' dist/tessa-matrix-studio.user.js
          grep -Fq 'PROD_SHADOW_UAT_V1' dist/tessa-matrix-studio.user.js
          grep -Fq "prod-shadow-offline" dist/tessa-matrix-studio.user.js
          grep -Fq 'V1.15_PERFORMANCE_RELIABILITY_UX_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'BLOCKED_ROLE_BASELINE_FALLBACK_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'COMPACT_ROLE_CATALOG_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'VALUE_LEVEL_RECOVERY_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'PREVIEW_BASELINE_INCREMENTAL_SNAPSHOT_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'SERVER_PAGED_NATIVE_VIEW_V4' dist/tessa-matrix-studio.user.js
          grep -Fq 'TESSA_SERVER_VIEW_PAGING_DIAGNOSTICS_V4' dist/tessa-matrix-studio.user.js
          grep -Fq 'TMS_V1_15_10_PAGING_V4_REFRESH_EDIT_V2' dist/tessa-matrix-studio.user.js
          grep -Fq 'TMS_V1_16_0_PERF_ENDGAME_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'PERF_DIRECT_DICTIONARY_REFRESH_V3' dist/tessa-matrix-studio.user.js
          grep -Fq 'PERF_PICKER_SEARCH_CACHE_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'PERF_ROUNDTRIP_ROW_STREAM_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'deflateRawTextParts' dist/tessa-matrix-studio.user.js
          grep -Fq 'zipTextParts([worksheetPrefix, ...matrixRowChunks, worksheetSuffix])' dist/tessa-matrix-studio.user.js
          grep -Fq 'criterionResultsPromise = mapConcurrent([...criterionGroups.entries()], 3' dist/tessa-matrix-studio.user.js
          grep -Fq 'UAT_REAL_XLSX_EDIT_V2' dist/tessa-matrix-studio.user.js
          grep -Fq "'candidate-build-provenance'" dist/tessa-matrix-studio.user.js
          if grep -Fq 'TESSA_SERVER_VIEW_PAGING_DIAGNOSTICS_V2' dist/tessa-matrix-studio.user.js; then
            echo 'Stale paging V2 code survived candidate composition.' >&2
            exit 1
          fi
          grep -Fq 'FULL_UAT_RESOURCE_SAFETY_V1' dist/tessa-matrix-studio.user.js
          grep -Fq 'FULL_UAT_DICTIONARY_INVALID_VALUE_LEVEL_V1' dist/tessa-matrix-studio.user.js
          grep -Fq "'resource-input-limit'" dist/tessa-matrix-studio.user.js
          grep -Fq "'resource-entry-limit'" dist/tessa-matrix-studio.user.js
          grep -Fq "'resource-path-traversal'" dist/tessa-matrix-studio.user.js
          grep -Fq "'resource-spreadsheet-bounds'" dist/tessa-matrix-studio.user.js
          grep -Fq "'memory-bounded-roundtrip'" dist/tessa-matrix-studio.user.js

          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.15.10-live-stability.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.16-performance-endgame.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.15-reliability.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/preview-incremental-snapshot.mjs

          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/user-copied-identity-regression.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/full-uat-runner-contract.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/live-uat-regressions.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/live-colleague-excel-regressions.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.14.2-full-uat-clear-regression.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.14.2-full-uat-version-provenance.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.14.2-full-uat-copied-identity-regression.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.14.2-full-uat-action-coverage-regression.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.16.2-full-uat-pinned-context.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.16.3-full-uat-preflight-recovery.mjs
          TMS_TEST_SOURCE="$PWD/dist/tessa-matrix-studio.user.js" node tests/v1.16.3-full-uat-readonly-runtime.mjs

          awk 'BEGIN { emit=0 } /^\/\/ ==UserScript==/ { emit=1 } emit { print } /^\/\/ ==\/UserScript==/ { exit }' \
            dist/tessa-matrix-studio.user.js > dist/tessa-matrix-studio.meta.js
          test -s dist/tessa-matrix-studio.meta.js

          (
            cd dist
            sha256sum tessa-matrix-studio.meta.js tessa-matrix-studio.user.js > SHA256SUMS.txt
            zip -q "tessa-matrix-studio-v${CANDIDATE_VERSION}-UAT.zip" tessa-matrix-studio.user.js tessa-matrix-studio.meta.js SHA256SUMS.txt
          )

          USER_SHA="$(sha256sum dist/tessa-matrix-studio.user.js | awk '{print $1}')"
          COMMIT_SHA="$(git rev-parse HEAD)"
          printf '{\n  "version": "%s",\n  "commit": "%s",\n  "userscriptSha256": "%s",\n  "purpose": "v1.16.3-full-uat-preflight-recovery-live-uat",\n  "sourceWorkbook": "TESSA_Матрица_ОРД-основная_78792326_СПРАВОЧНИКИ.xlsx",\n  "expectedChecks": ["multi-position-picker-copy", "picker-delimiter-safe-v2", "visible-preview-error-count", "explicit-not-applied-count", "bounded-resolution-center", "counter-driven-preview-filters", "blocked-role-baseline-fallback", "value-level-recovery", "compact-role-catalog", "baseline-incremental-preview", "full-uat-export-scope", "deterministic-live-clear", "dictionary-invalid-field-value-fail-closed", "resource-input-size-guard", "resource-zip-entry-guard", "resource-path-traversal-guard", "resource-spreadsheet-coordinate-guard", "bounded-memory-repeat-roundtrip", "heap-headroom-after-production-shadow", "production-shadow-prod-envelope", "historical-alias-migration", "cross-matrix-production-scale", "full-uat-version-provenance", "copied-identity-collision-safe", "full-uat-apply-reconcile-evidence"]\n}\n' \
            "$CANDIDATE_VERSION" "$COMMIT_SHA" "$USER_SHA" > dist/candidate-manifest.json

      - name: Upload exact UAT candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tessa-matrix-studio-v1.16.3-full-uat-preflight-recovery-${{ github.run_id }}
          path: |
            dist/tessa-matrix-studio.user.js
            dist/tessa-matrix-studio.meta.js
            dist/SHA256SUMS.txt
            dist/tessa-matrix-studio-v1.16.3-UAT.zip
            dist/candidate-manifest.json
          if-no-files-found: error
          retention-days: 14
