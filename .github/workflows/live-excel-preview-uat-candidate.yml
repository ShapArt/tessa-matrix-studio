name: v1.17 Exact UAT Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/build-candidate.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/live-excel-preview-uat-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build exact v1.17 UAT artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request normally checks out GitHub's temporary merge commit. The
          # UAT manifest must identify the reviewed branch commit byte-for-byte.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify repository regression suite
        run: npm test
      - name: Verify deterministic composition
        run: node tests/v1.14-artifact-composition.mjs
      - name: Build and package exact UAT candidate
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npm run build:uat
          mkdir -p dist
          cp tessa-matrix-studio.user.js dist/tessa-matrix-studio.uat.user.js
          node --check dist/tessa-matrix-studio.uat.user.js
          grep -Fq '__TMS_FULL_UAT_V1__' dist/tessa-matrix-studio.uat.user.js
          grep -Fq 'TESSA_MATRIX_SUPPORT_BUNDLE_V1' dist/tessa-matrix-studio.uat.user.js
          awk 'BEGIN { emit=0 } /^\/\/ ==UserScript==/ { emit=1 } emit { print } /^\/\/ ==\/UserScript==/ { exit }' \
            dist/tessa-matrix-studio.uat.user.js > dist/tessa-matrix-studio.meta.js
          (
            cd dist
            sha256sum tessa-matrix-studio.uat.user.js tessa-matrix-studio.meta.js > SHA256SUMS.txt
            zip -q "tessa-matrix-studio-v${VERSION}-UAT.zip" \
              tessa-matrix-studio.uat.user.js tessa-matrix-studio.meta.js SHA256SUMS.txt
          )
          USER_SHA="$(sha256sum dist/tessa-matrix-studio.uat.user.js | awk '{print $1}')"
          COMMIT_SHA="$(git rev-parse HEAD)"
          node -e "const fs=require('fs'); fs.writeFileSync('dist/candidate-manifest.json', JSON.stringify({format:'TESSA_MATRIX_UAT_CANDIDATE_V1',version:process.argv[1],commit:process.argv[2],userscriptSha256:process.argv[3],profile:'uat'},null,2)+'\\n')" "$VERSION" "$COMMIT_SHA" "$USER_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload exact UAT candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tessa-matrix-studio-v${{ steps.version.outputs.version }}-uat-${{ github.run_id }}
          path: |
            dist/tessa-matrix-studio.uat.user.js
            dist/tessa-matrix-studio.meta.js
            dist/SHA256SUMS.txt
            dist/tessa-matrix-studio-v${{ steps.version.outputs.version }}-UAT.zip
            dist/candidate-manifest.json
          if-no-files-found: error
          retention-days: 14
