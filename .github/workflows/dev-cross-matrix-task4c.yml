name: Cross-matrix Task 4c GREEN

on:
  push:
    branches:
      - feat/cross-matrix-replacement
    paths:
      - tools/dev-cross-matrix-task4c.mjs
      - .github/workflows/dev-cross-matrix-task4c.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cross-matrix-replacement
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Task 4c production patch
        run: node tools/dev-cross-matrix-task4c.mjs
      - name: Focused rollback safety contracts
        run: node tests/cross-matrix-rollback-verification.mjs && node tests/cross-matrix-atomic-apply.mjs && node tests/cross-matrix-preflight-gate.mjs
      - name: Full regression suite
        run: npm test
      - name: Commit verified Task 4c patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json
          if git diff --cached --quiet; then
            echo "No verified patch to commit"
            exit 0
          fi
          git commit -m "fix: verify cross-matrix rollback by read-back"
          git push origin HEAD:feat/cross-matrix-replacement
