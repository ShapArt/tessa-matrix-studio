name: Temporary README UAT remover

on:
  push:
    branches: [docs/remove-readme-uat]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/remove-readme-uat
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Remove public UAT block
        run: python3 scripts/remove-public-uat.py
      - name: Full regression suite
        run: npm test
      - name: Commit clean documentation diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/remove-public-uat.yml scripts/remove-public-uat.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md tests/docs.mjs
          git commit -m 'docs: remove public pre-release UAT block'
          git push origin HEAD:docs/remove-readme-uat
