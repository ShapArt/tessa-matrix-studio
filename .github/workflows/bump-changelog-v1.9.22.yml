name: Bump CHANGELOG to v1.9.22

on:
  push:
    branches:
      - fix/localized-matrix-state-v1.9.22
    paths:
      - .github/workflows/bump-changelog-v1.9.22.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'ShapArt' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/localized-matrix-state-v1.9.22
          fetch-depth: 0
      - name: Prepend release notes
        env:
          RELEASE_NOTES_B64: 
        run: |
          test "$(head -n 1 CHANGELOG.md)" = "# Changelog"
          ! grep -q '^## 1\.9\.22 —' CHANGELOG.md
          printf '%s' "$RELEASE_NOTES_B64" | base64 -d > /tmp/release-notes
          {
            printf '# Changelog\n\n'
            cat /tmp/release-notes
            tail -n +3 CHANGELOG.md
          } > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md
          rm .github/workflows/bump-changelog-v1.9.22.yml
      - name: Commit changelog
        run: |
          git config user.name "ShapArt"
          git config user.email "100069322+ShapArt@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add v1.9.22 changelog"
          git push origin HEAD:fix/localized-matrix-state-v1.9.22
