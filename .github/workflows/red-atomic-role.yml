name: GREEN atomic replacement and role UX

on:
  push:
    branches: [fix/v1.13.0-atomic-replace-role-ux]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply production fix
        run: python tools/patch-v113-atomic-role-ux.py
      - name: Verify targeted regressions
        run: |
          node tests/cross-matrix-preflight-gate.mjs
          node tests/picker-production-ux.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: make replacement atomic and show role positions"
          git push origin HEAD:fix/v1.13.0-atomic-replace-role-ux
