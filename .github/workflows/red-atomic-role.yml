name: RED atomic replacement and role UX

on:
  push:
    branches: [fix/v1.13.0-atomic-replace-role-ux]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Atomic replacement regression
        run: node tests/cross-matrix-preflight-gate.mjs
      - name: Role presentation regression
        run: node tests/picker-production-ux.mjs
