name: GREEN atomic replacement and role UX

on:
  push:
    branches: [fix/v1.13.0-atomic-replace-role-ux]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply production fix
        run: python tools/patch-v113-atomic-role-ux.py
      - name: Register review atomicity regression in full suite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('package.json')
          s = p.read_text(encoding='utf-8')
          needle = 'node tests/cross-matrix-preflight-gate.mjs && node tests/cross-matrix-live-role-preflight.mjs'
          replacement = 'node tests/cross-matrix-preflight-gate.mjs && node tests/cross-matrix-review-atomicity.mjs && node tests/cross-matrix-live-role-preflight.mjs'
          if replacement not in s:
              if needle not in s:
                  raise SystemExit('package test anchor missing')
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify targeted regressions
        run: |
          node tests/cross-matrix-preflight-gate.mjs
          node tests/cross-matrix-review-atomicity.mjs
          node tests/picker-production-ux.mjs
          node tests/picker-dom-production.cjs
      - name: Verify full regression suite
        run: npm test
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: make replacement atomic and show role positions"
          git push origin HEAD:fix/v1.13.0-atomic-replace-role-ux
