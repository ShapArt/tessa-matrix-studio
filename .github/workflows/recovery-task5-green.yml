name: v1.14 Recovery Task5 GREEN

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]

permissions:
  contents: write

jobs:
  download-green:
    if: contains(github.event.head_commit.message, '[task5-green]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.14-recovery-uat-resolution
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Task5 production patch
        run: node tools/patch-task5-download.mjs
      - name: Verify focused browser download contracts
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/changes-report-download-dom.cjs
          node tests/changes-report-download-lifecycle.cjs
          node tests/changes-report-xlsx.mjs
          node tests/changes-report-ui.mjs
          git diff --check
      - name: Full regression
        run: npm test
      - name: Commit canonical Task5 patch
        run: |
          if git diff --quiet -- tessa-matrix-studio.user.js package.json; then
            echo 'No Task5 production diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js package.json
          git commit -m 'fix: prepare reviewed changes download artifact'
          git push origin HEAD:fix/v1.14-recovery-uat-resolution
