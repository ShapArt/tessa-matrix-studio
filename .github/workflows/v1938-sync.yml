name: Sync v1.9.38 release surfaces

on:
  push:
    branches:
      - fix/global-context-preview-suppression
    paths:
      - .github/workflows/v1938-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/global-context-preview-suppression
          fetch-depth: 0
      - name: Sync release surfaces
        run: python3 scripts/patch_v1938.py
      - name: Commit synchronized release surfaces and remove patcher
        run: |
          rm scripts/patch_v1938.py .github/workflows/v1938-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml scripts/patch_v1938.py .github/workflows/v1938-sync.yml
          git commit -m "release: prepare v1.9.38 global-context UX fix"
          git push origin HEAD:fix/global-context-preview-suppression
