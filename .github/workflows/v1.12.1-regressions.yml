name: v1.12.1 live regressions

on:
  push:
    branches: [fix/excel-row-sync-1.12.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Post-Apply matrix persistence regression
        run: node tests/post-apply-view-refresh.mjs
      - name: Support report browser download regression
        run: node tests/support-report-sanitization.mjs
