name: Apply v1.9.33 preflight cancellation patch

on:
  push:
    branches:
      - feat/preprod-mega-uat-hardening
    paths:
      - scripts/preprod_193_patch.py
      - .github/workflows/preprod-193-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/preprod_193_patch.py
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm scripts/preprod_193_patch.py .github/workflows/preprod-193-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml scripts/preprod_193_patch.py .github/workflows/preprod-193-patcher.yml
          git commit -m "fix: publish cancellable preflight as v1.9.33"
          git push origin HEAD:feat/preprod-mega-uat-hardening
