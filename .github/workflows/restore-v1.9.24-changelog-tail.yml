name: Restore v1.9.24 changelog tail

on:
  push:
    branches:
      - security/spreadsheetml-guards-v1.9.24
    paths:
      - scripts/restore-v1.9.24-changelog-tail.mjs

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/spreadsheetml-guards-v1.9.24
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore historical changelog tail
        run: node scripts/restore-v1.9.24-changelog-tail.mjs
      - name: Verify full suite
        run: npm test
      - name: Commit restoration and remove staging helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git rm scripts/restore-v1.9.24-changelog-tail.mjs .github/workflows/restore-v1.9.24-changelog-tail.yml
          git commit -m "docs: restore complete changelog history"
          git push origin HEAD:security/spreadsheetml-guards-v1.9.24
