name: One-shot v1.11.8 XLSX self-roundtrip hotfix

on:
  push:
    branches: [hotfix/v1.11.8-xlsx-self-roundtrip]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/v1.11.8-xlsx-self-roundtrip
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Align SpreadsheetML parser ceilings with Studio exports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tessa-matrix-studio.user.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ('// @version      1.11.7', '// @version      1.11.8'),
              ("version: '1.11.7'", "version: '1.11.8'"),
              ('MaxRowNumber: 100000,', 'MaxRowNumber: 200000,'),
              ('MaxParsedRows: 100000,', 'MaxParsedRows: 200000,'),
              ('MaxParsedCells: 500000,', 'MaxParsedCells: 1500000,'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one {old!r}, got {source.count(old)}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

          path = Path('tests/xlsx-spreadsheetml-security.mjs')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ("assert(code.includes('MaxRowNumber: 100000'), 'production SpreadsheetML row ceiling drifted from 100000');", "assert(code.includes('MaxRowNumber: 200000'), 'production SpreadsheetML row ceiling drifted from 200000');"),
              ("assert(code.includes('MaxParsedRows: 100000'), 'production parsed-row ceiling drifted from 100000');", "assert(code.includes('MaxParsedRows: 200000'), 'production parsed-row ceiling drifted from 200000');"),
              ("assert(code.includes('MaxParsedCells: 500000'), 'production parsed-cell ceiling drifted from 500000');", "assert(code.includes('MaxParsedCells: 1500000'), 'production parsed-cell ceiling drifted from 1500000');"),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected security anchor exactly once: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/one-shot-v1.11.8-self-roundtrip-hotfix.yml

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify focused XLSX regressions
        run: |
          node tests/xlsx-self-roundtrip-limit.mjs
          node tests/xlsx-spreadsheetml-security.mjs

      - name: Commit verified runtime hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tessa-matrix-studio.user.js tests/xlsx-spreadsheetml-security.mjs .github/workflows/one-shot-v1.11.8-self-roundtrip-hotfix.yml
          git diff --cached --quiet && { echo "No runtime hotfix generated"; exit 1; }
          git commit -m "fix: align XLSX parser ceilings with Studio exports"
          git push origin HEAD:hotfix/v1.11.8-xlsx-self-roundtrip
