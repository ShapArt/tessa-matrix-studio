name: v1.9.39 syntax fix

on:
  push:
    branches:
      - feat/v1.9.39-post-apply-ux
    paths:
      - .github/workflows/v1939-syntax-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1.9.39-post-apply-ux
          fetch-depth: 0
      - name: Repair multiline single-quoted refresh notes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tessa-matrix-studio.user.js')
          s = p.read_text(encoding='utf-8')
          old1 = """        ? '\nОтображение TESSA обновлено автоматически.'"""
          old2 = """        : (result?.viewRefresh && !result.viewRefresh.skipped ? '\nЗапись завершена, но отображение TESSA не удалось обновить автоматически.' : '');"""
          # In the current broken source, the \n above is a physical newline inside single quotes.
          old1 = old1.replace('\\n', '\n')
          old2 = old2.replace('\\n', '\n')
          new1 = "        ? `\\nОтображение TESSA обновлено автоматически.`"
          new2 = "        : (result?.viewRefresh && !result.viewRefresh.skipped ? `\\nЗапись завершена, но отображение TESSA не удалось обновить автоматически.` : '');"
          if old1 not in s or old2 not in s:
              raise SystemExit('broken refreshNote markers not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check tessa-matrix-studio.user.js
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/v1939-syntax-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "fix: repair post-Apply result message syntax"
          git push origin HEAD:feat/v1.9.39-post-apply-ux
