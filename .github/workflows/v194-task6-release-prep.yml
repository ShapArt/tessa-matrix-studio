name: v1.9.40 release prep

on:
  push:
    branches: [feat/v1.9.40-self-check-reconciliation]
    paths: [.github/workflows/v194-task6-release-prep.yml]

permissions:
  contents: write

jobs:
  release-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply v1.9.40 release-prep patch
        run: python scripts/v194_task6_release_prep.py
      - name: Verify docs release and workflow security
        run: node --check tessa-matrix-studio.user.js && node tests/docs.mjs && node tests/release-workflow.mjs && node tests/workflow-security.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Review production invariants
        run: python scripts/v194_task6_invariants.py
      - name: Show remaining release-version references
        run: |
          echo 'README 1.9.39 references (historical references are allowed only if intentional):'
          grep -n '1\.9\.39' README.md || true
          echo 'UAT 1.9.39 references (historical live evidence is expected):'
          grep -n '1\.9\.39' docs/UAT-COMPACT-ALL-CASES.md || true
      - name: Commit v1.9.40 release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PRODUCTION-RUNBOOK.md docs/UAT-COMPACT-ALL-CASES.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml tessa-matrix-studio.user.js package.json
          git diff --cached --check
          git commit -m "release: prepare v1.9.40 reconciliation hardening"
          git push origin HEAD:feat/v1.9.40-self-check-reconciliation
