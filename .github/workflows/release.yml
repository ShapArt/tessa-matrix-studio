name: Release

on:
  workflow_run:
    workflows: ["Quality & Security"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Pin every external Action to an immutable commit SHA. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Detect userscript change
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff-tree --no-commit-id --name-only -r HEAD^ HEAD | grep -qx 'tessa-matrix-studio.user.js'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Production userscript did not change; release publication is skipped."
          fi

      - name: Verify
        if: steps.changed.outputs.changed == 'true'
        run: npm test

      - name: Read version
        if: steps.changed.outputs.changed == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk '/@version/{print $3; exit}' tessa-matrix-studio.user.js)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard immutable published version
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite published release $TAG. Published versions are immutable; bump @version and create a new release."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}' | head -n1)"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [[ "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
              echo "Existing tag $TAG points to $REMOTE_SHA, not verified HEAD $HEAD_SHA. Refusing to move or overwrite the tag."
              exit 1
            fi
            echo "Tag $TAG already points to verified HEAD; continuing a tag-only partial release recovery."
          fi

      - name: Build assets
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp tessa-matrix-studio.user.js dist/tessa-matrix-studio.user.js
          awk 'BEGIN { emit=0 } /^\/\/ ==UserScript==/ { emit=1 } emit { print } /^\/\/ ==\/UserScript==/ { exit }' \
            tessa-matrix-studio.user.js > dist/tessa-matrix-studio.meta.js
          test -s dist/tessa-matrix-studio.meta.js
          grep -Fqx "// @version      $VERSION" dist/tessa-matrix-studio.meta.js
          grep -Fqx "// @updateURL    https://github.com/ShapArt/tessa-matrix-studio/releases/latest/download/tessa-matrix-studio.meta.js" dist/tessa-matrix-studio.meta.js
          grep -Fqx "// @downloadURL  https://github.com/ShapArt/tessa-matrix-studio/releases/latest/download/tessa-matrix-studio.user.js" dist/tessa-matrix-studio.meta.js
          zip -r "dist/tessa-matrix-studio-v$VERSION.zip" \
            tessa-matrix-studio.user.js README.md CHANGELOG.md SECURITY.md
          (
            cd dist
            sha256sum \
              tessa-matrix-studio.meta.js \
              tessa-matrix-studio.user.js \
              "tessa-matrix-studio-v$VERSION.zip" \
              > SHA256SUMS.txt
          )

      - name: Attest release provenance
        if: steps.changed.outputs.changed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Publish release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            dist/tessa-matrix-studio.meta.js \
            dist/tessa-matrix-studio.user.js \
            "dist/tessa-matrix-studio-v$VERSION.zip" \
            dist/SHA256SUMS.txt \
            --title "TESSA Matrix Studio v$VERSION" \
            --generate-notes

      - name: Verify public latest delivery
        if: steps.changed.outputs.changed == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_DIR="$(mktemp -d)"
          BASE="https://github.com/ShapArt/tessa-matrix-studio/releases/latest/download"
          META_URL="$BASE/tessa-matrix-studio.meta.js"
          USER_URL="$BASE/tessa-matrix-studio.user.js"
          ZIP_URL="$BASE/tessa-matrix-studio-v$EXPECTED_VERSION.zip"
          SUMS_URL="$BASE/SHA256SUMS.txt"

          ok=false
          for attempt in 1 2 3 4 5 6 7 8; do
            rm -f "$PUBLIC_DIR"/*
            if curl --fail --location --silent --show-error --retry 2 --retry-all-errors "$META_URL" -o "$PUBLIC_DIR/tessa-matrix-studio.meta.js" \
              && curl --fail --location --silent --show-error --retry 2 --retry-all-errors "$USER_URL" -o "$PUBLIC_DIR/tessa-matrix-studio.user.js" \
              && curl --fail --location --silent --show-error --retry 2 --retry-all-errors "$ZIP_URL" -o "$PUBLIC_DIR/tessa-matrix-studio-v$EXPECTED_VERSION.zip" \
              && curl --fail --location --silent --show-error --retry 2 --retry-all-errors "$SUMS_URL" -o "$PUBLIC_DIR/SHA256SUMS.txt"; then
              META_VERSION="$(awk '/@version/{print $3; exit}' "$PUBLIC_DIR/tessa-matrix-studio.meta.js")"
              USER_VERSION="$(awk '/@version/{print $3; exit}' "$PUBLIC_DIR/tessa-matrix-studio.user.js")"
              if [[ "$META_VERSION" == "$EXPECTED_VERSION" && "$USER_VERSION" == "$EXPECTED_VERSION" ]]; then
                ok=true
                break
              fi
            fi
            echo "Public latest is not v$EXPECTED_VERSION yet (attempt $attempt/8); retrying..."
            sleep 3
          done

          [[ "$ok" == "true" ]] || { echo "Public latest delivery never converged to v$EXPECTED_VERSION"; exit 1; }
          grep -Fqx "// @updateURL    $META_URL" "$PUBLIC_DIR/tessa-matrix-studio.meta.js"
          grep -Fqx "// @downloadURL  $USER_URL" "$PUBLIC_DIR/tessa-matrix-studio.meta.js"
          grep -Fqx "// @updateURL    $META_URL" "$PUBLIC_DIR/tessa-matrix-studio.user.js"
          grep -Fqx "// @downloadURL  $USER_URL" "$PUBLIC_DIR/tessa-matrix-studio.user.js"
          (
            cd "$PUBLIC_DIR"
            sha256sum --check SHA256SUMS.txt
          )
