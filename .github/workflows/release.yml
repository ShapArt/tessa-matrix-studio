name: Release

on:
  workflow_run:
    workflows: ["Quality & Security"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Detect userscript change
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREVIOUS_TAG="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$PREVIOUS_TAG"..HEAD -- \
              src/ tools/build-candidate.mjs package.json package-lock.json \
              README.md CHANGELOG.md SECURITY.md docs/ | \
              grep -Eq '^(src/|tools/build-candidate\.mjs|package\.json|package-lock\.json|README\.md|CHANGELOG\.md|SECURITY\.md|docs/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Production runtime did not change since $PREVIOUS_TAG; release publication is skipped."
          fi

      - name: Install test dependencies
        if: steps.changed.outputs.changed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        if: steps.changed.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Verify
        if: steps.changed.outputs.changed == 'true'
        run: npm test
      - name: Read version
        if: steps.changed.outputs.changed == 'true'
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard immutable published version
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite published release $TAG. Published versions are immutable; bump the package version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}' | head -n1)"
            HEAD_SHA="$(git rev-parse HEAD)"
            [[ "$REMOTE_SHA" == "$HEAD_SHA" ]] || { echo "Existing $TAG points to another commit."; exit 1; }
          fi

      - name: Build assets
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          npm run build:production
          node --check dist/tessa-matrix-studio.user.js
          grep -Fqx "// @version      $VERSION" dist/tessa-matrix-studio.user.js
          grep -Fq "version: '$VERSION'," dist/tessa-matrix-studio.user.js
          grep -Fq 'TESSA_MATRIX_ROUNDTRIP_V7' dist/tessa-matrix-studio.user.js
          grep -Fq 'TESSA_MATRIX_SUPPORT_BUNDLE_V1' dist/tessa-matrix-studio.user.js
          if grep -Eq '__TESSA_MATRIX_SYNC_EXPORTS__|__TMS_FULL_UAT_V1__' dist/tessa-matrix-studio.user.js; then
            echo 'Production build exposed test/UAT globals.' >&2
            exit 1
          fi
          node tools/build-enterprise-package.mjs \
            dist/tessa-matrix-studio.user.js deployment/enterprise-config.example.json \
            dist/enterprise-unsigned
          awk 'BEGIN { emit=0 } /^\/\/ ==UserScript==/ { emit=1 } emit { print } /^\/\/ ==\/UserScript==/ { exit }' \
            dist/tessa-matrix-studio.user.js > dist/tessa-matrix-studio.meta.js
          grep -Fqx "// @version      $VERSION" dist/tessa-matrix-studio.meta.js
          (
            cd dist
            zip -q "tessa-matrix-studio-v$VERSION.zip" tessa-matrix-studio.user.js
            zip -q -r "tessa-matrix-studio-v$VERSION-enterprise-unsigned.zip" enterprise-unsigned
          )
          zip -q -j "dist/tessa-matrix-studio-v$VERSION.zip" \
            README.md CHANGELOG.md SECURITY.md \
            docs/DEPLOYMENT-GPO-INTUNE.md docs/SECURITY-REVIEW-v1.17.0.md \
            docs/UAT-v1.17.0.md docs/ROLLBACK-v1.16.15.md \
            docs/CERTIFICATION-CONTROLS.md docs/CHANGE-ALGORITHMS.md \
            docs/LIVE-UAT-AUDIT-v1.17.1.md
          (
            cd dist
            sha256sum tessa-matrix-studio.meta.js tessa-matrix-studio.user.js \
              "tessa-matrix-studio-v$VERSION.zip" \
              "tessa-matrix-studio-v$VERSION-enterprise-unsigned.zip" > SHA256SUMS.txt
          )

      - name: Enforce native TESSA evidence
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          EVIDENCE="release-evidence/v$VERSION.json"
          test -f "$EVIDENCE" || { echo "::error::Missing $EVIDENCE. Live TESSA ACL/write evidence is required."; exit 1; }
          node tools/release-native-evidence-gate.mjs "$VERSION" dist/tessa-matrix-studio.user.js "$EVIDENCE"
          SCHEMA_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE','utf8')).schemaVersion")"
          if [[ "$SCHEMA_VERSION" == "5" ]]; then
            RUN_ID="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE','utf8')).candidateArtifactRunId")"
            ARTIFACT_NAME="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE','utf8')).candidateArtifactName")"
            EXPECTED_DIGEST="sha256:$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE','utf8')).candidateArtifactDigest")"
            ACTUAL_DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .digest" | head -n1)"
            [[ -n "$ACTUAL_DIGEST" ]] || { echo "::error::Candidate artifact not found."; exit 1; }
            [[ "$ACTUAL_DIGEST" == "$EXPECTED_DIGEST" ]] || { echo "::error::Live-tested artifact digest mismatch"; exit 1; }
          fi

      - name: Attest release provenance
        if: steps.changed.outputs.changed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Publish release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            dist/tessa-matrix-studio.meta.js dist/tessa-matrix-studio.user.js \
            "dist/tessa-matrix-studio-v$VERSION.zip" \
            "dist/tessa-matrix-studio-v$VERSION-enterprise-unsigned.zip" \
            dist/SHA256SUMS.txt \
            --title "TESSA Matrix Studio v$VERSION" --generate-notes

      - name: Verify public latest delivery
        if: steps.changed.outputs.changed == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_DIR="$(mktemp -d)"
          BASE="https://github.com/ShapArt/tessa-matrix-studio/releases/latest/download"
          for attempt in 1 2 3 4 5 6 7 8; do
            rm -f "$PUBLIC_DIR"/*
            if curl --fail --location --silent --show-error "$BASE/tessa-matrix-studio.meta.js" -o "$PUBLIC_DIR/tessa-matrix-studio.meta.js" \
              && curl --fail --location --silent --show-error "$BASE/tessa-matrix-studio.user.js" -o "$PUBLIC_DIR/tessa-matrix-studio.user.js" \
              && curl --fail --location --silent --show-error "$BASE/tessa-matrix-studio-v$EXPECTED_VERSION.zip" -o "$PUBLIC_DIR/tessa-matrix-studio-v$EXPECTED_VERSION.zip" \
              && curl --fail --location --silent --show-error "$BASE/tessa-matrix-studio-v$EXPECTED_VERSION-enterprise-unsigned.zip" -o "$PUBLIC_DIR/tessa-matrix-studio-v$EXPECTED_VERSION-enterprise-unsigned.zip" \
              && curl --fail --location --silent --show-error "$BASE/SHA256SUMS.txt" -o "$PUBLIC_DIR/SHA256SUMS.txt" \
              && [[ "$(awk '/@version/{print $3; exit}' "$PUBLIC_DIR/tessa-matrix-studio.user.js")" == "$EXPECTED_VERSION" ]]; then
              break
            fi
            [[ "$attempt" != "8" ]] || exit 1
            sleep 3
          done
          (cd "$PUBLIC_DIR" && sha256sum --check SHA256SUMS.txt)
          node --check "$PUBLIC_DIR/tessa-matrix-studio.user.js"
          grep -Fqx "// @updateURL    $BASE/tessa-matrix-studio.meta.js" "$PUBLIC_DIR/tessa-matrix-studio.meta.js"
          grep -Fqx "// @downloadURL  $BASE/tessa-matrix-studio.user.js" "$PUBLIC_DIR/tessa-matrix-studio.meta.js"
