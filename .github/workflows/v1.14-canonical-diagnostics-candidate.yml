name: v1.14 canonical diagnostics candidate

on:
  push:
    branches: [feat/incremental-performance-v1.14]
    paths:
      - tools/patch-v1.14-canonicalize-diagnostics.mjs
      - .github/workflows/v1.14-canonical-diagnostics-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-green-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/incremental-performance-v1.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify RED — exact UAT transform is broken against canonical source
        shell: bash
        run: |
          cp tessa-matrix-studio.user.js /tmp/pre-canonical.user.js
          set +e
          node hotfixes/v1.13.0-user-row-lifecycle-transform.mjs /tmp/pre-canonical.user.js > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          if [ "$code" -eq 0 ]; then
            echo "Expected the old build-only diagnostics transform to conflict with the canonical source fix."
            exit 1
          fi
          grep -Eq "diagnostic field card hydration|expected exactly one match" /tmp/red.log || {
            echo "Candidate transform failed for an unexpected reason."
            exit 1
          }
      - name: Canonicalize diagnostics and make transform idempotent
        run: node tools/patch-v1.14-canonicalize-diagnostics.mjs --apply
      - name: Verify canonical source
        run: |
          node tools/patch-v1.14-canonicalize-diagnostics.mjs --verify
          node tests/studio-diagnostics.mjs
          node tests/snapshot-dto-boundary.mjs
          npm test
      - name: Build exact UAT candidate shape
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tms-dist
          mkdir -p /tmp/tms-dist
          cp tessa-matrix-studio.user.js /tmp/tms-dist/tessa-matrix-studio.user.js
          node hotfixes/malformed-range-diagnostic-transform.mjs /tmp/tms-dist/tessa-matrix-studio.user.js
          node hotfixes/v1.13.0-user-row-lifecycle-transform.mjs /tmp/tms-dist/tessa-matrix-studio.user.js
          printf '\n' >> /tmp/tms-dist/tessa-matrix-studio.user.js
          cat hotfixes/interval-add-valid-fallback.js >> /tmp/tms-dist/tessa-matrix-studio.user.js
          printf '\n' >> /tmp/tms-dist/tessa-matrix-studio.user.js
          cat hotfixes/full-uat-runner-v1.js >> /tmp/tms-dist/tessa-matrix-studio.user.js
          node hotfixes/v1.13.0-full-uat-live-finalize.mjs /tmp/tms-dist/tessa-matrix-studio.user.js
          node --check /tmp/tms-dist/tessa-matrix-studio.user.js
          TMS_TEST_SOURCE=/tmp/tms-dist/tessa-matrix-studio.user.js node tests/user-copied-identity-regression.mjs
          TMS_TEST_SOURCE=/tmp/tms-dist/tessa-matrix-studio.user.js node tests/full-uat-runner-contract.mjs
          TMS_TEST_SOURCE=/tmp/tms-dist/tessa-matrix-studio.user.js node tests/live-uat-regressions.mjs
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit verified canonical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js hotfixes/v1.13.0-user-row-lifecycle-transform.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: canonicalize live diagnostics card hydration"
          git push origin HEAD:feat/incremental-performance-v1.14
