name: Finalize preprod v1.9.36

on:
  push:
    branches:
      - feat/preprod-mega-uat-hardening
    paths:
      - .github/workflows/preprod-v1936-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply deterministic finalization patch
        run: python3 scripts/preprod_finalize_v1936.py
      - name: Focused verification before commit
        run: |
          node --check tessa-matrix-studio.user.js
          node tests/review-bulk-package.mjs
          node tests/docs.mjs
      - name: Commit finalized gold candidate
        shell: bash
        run: |
          rm scripts/preprod_finalize_v1936.py .github/workflows/preprod-v1936-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize v1.9.36 gold candidate"
          git push origin HEAD:feat/preprod-mega-uat-hardening
