name: Temporary CardNew topology patch

on:
  push:
    branches: [diag/cardnew-topology-probes]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'ShapArt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: diag/cardnew-topology-probes
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply bounded patch
        run: node tools/temporary-cardnew-topology-patch.mjs
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Targeted GREEN
        run: |
          node tests/interval-structural-probes.mjs
          node tests/interval-proposed-add-probes.mjs
      - name: Full regression suite
        run: npm test
      - name: Commit self-cleaned patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'diag: deepen rejected CardNew interval topology probes'
          git push origin HEAD:diag/cardnew-topology-probes
