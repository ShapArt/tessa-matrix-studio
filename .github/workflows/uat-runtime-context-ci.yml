name: UAT runtime context CI

on:
  push:
    branches: [fix/v1.14-uat-update-runtime-context]
  pull_request:
    branches: [feat/incremental-performance-v1.14]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/v1.14-rc-contract.mjs
