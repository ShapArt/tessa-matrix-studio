name: v1.14 Recovery Task13 APPLY

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task13-apply:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[task13-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply deterministic Task13 production patch
        run: node tools/patch-task13-selective-xlsx.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check tessa-matrix-studio.user.js
      - name: Task13 selective XLSX regression
        run: node tests/recovery-task13-selective-xlsx.mjs
      - name: Task12 bounded-memory regression
        run: node tests/full-uat-memory-bounded.mjs
      - name: XLSX archive safety regression
        run: node tests/xlsx-archive-security.mjs
      - name: Large roundtrip regression
        run: node tests/xlsx-self-roundtrip-limit.mjs
      - name: Full UAT contract regression
        run: node tests/full-uat-runner-contract.mjs
      - name: Full regression
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json
          if git diff --cached --quiet; then
            echo "No production diff to commit."
            exit 0
          fi
          git commit -m "fix: skip disposable XLSX sheets before inflate [task13-green]"
          git push origin HEAD:fix/v1.14-recovery-uat-resolution

# Task13 workflow registered before this trigger commit.
