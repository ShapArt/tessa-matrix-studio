name: v1.9.27 ADD race patch

on:
  push:
    branches:
      - feat/v1.9.27-apply-race-protection
    paths:
      - .github/workflows/v1927-green-add.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1.9.27-apply-race-protection
      - name: Apply minimal ADD race patch
        shell: python
        run: |
          from pathlib import Path
          source = Path('tessa-matrix-studio.user.js')
          text = source.read_text(encoding='utf-8')
          old = """        log(`Добавляю строку Excel ${action.excelRow.excelRow}`);\n        const storeResponse = await bridge.storeRowCard(created.card);\n"""
          new = """        log(`Добавляю строку Excel ${action.excelRow.excelRow}`);\n        // Re-check immediately before Store: another session may have created the\n        // same matrix row after preflight completed.\n        await bridge.validateDuplicate(created.card, created.versionId);\n        const storeResponse = await bridge.storeRowCard(created.card);\n"""
          if old not in text:
              raise SystemExit('ADD store anchor not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/v1927-green-add.yml').unlink()
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js .github/workflows/v1927-green-add.yml
          git commit -m "fix: revalidate duplicate immediately before ADD store"
          git push origin HEAD:feat/v1.9.27-apply-race-protection
