name: v1.12.2 runtime contract RED (historical proof)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Historical RED proof only
        run: |
          echo 'The original pre-fix RED run was 34332645407.'
          echo 'Do not run this workflow after the production fix: these tests are expected to be GREEN now.'
