name: Cross-matrix Task 1 GREEN

on:
  push:
    branches:
      - feat/cross-matrix-replacement
    paths:
      - tools/dev-cross-matrix-task1.mjs
      - .github/workflows/dev-cross-matrix-task1.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cross-matrix-replacement
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Task 1 production patch
        run: node tools/dev-cross-matrix-task1.mjs
      - name: Focused Task 1 regression
        run: node tests/cross-matrix-context.mjs && node tests/global-context-suppression.mjs && node tests/acceptance.mjs
      - name: Full regression suite
        run: npm test
      - name: Commit verified Task 1 patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js tests/acceptance.mjs
          if git diff --cached --quiet; then
            echo "No verified patch to commit"
            exit 0
          fi
          git commit -m "feat: classify same-template cross-matrix imports"
          git push origin HEAD:feat/cross-matrix-replacement
