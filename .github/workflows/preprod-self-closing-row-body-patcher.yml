name: Apply self-closing row body fix

on:
  push:
    branches:
      - feat/preprod-mega-uat-hardening
    paths:
      - .github/workflows/preprod-self-closing-row-body-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - name: Apply deterministic body fix
        run: python3 scripts/preprod_finish_self_closing_row_194.py
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm scripts/preprod_finish_self_closing_row_194.py .github/workflows/preprod-self-closing-row-body-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js scripts/preprod_finish_self_closing_row_194.py .github/workflows/preprod-self-closing-row-body-patcher.yml
          git commit -m "fix: parse empty self-closing SpreadsheetML rows"
          git push origin HEAD:feat/preprod-mega-uat-hardening
