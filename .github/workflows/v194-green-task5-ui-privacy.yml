name: v1.9.40 Task 5 UI privacy GREEN

on:
  push:
    branches: [feat/v1.9.40-self-check-reconciliation]
    paths: [.github/workflows/v194-green-task5-ui-privacy.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Task 5 UI/privacy patch
        run: python scripts/v194_task5_ui_privacy_green.py
      - name: Verify Task 5 GREEN
        run: node --check tessa-matrix-studio.user.js && node tests/reconciliation-ui-contract.mjs && node tests/support-report-sanitization.mjs && node tests/sticky-progress-ui.mjs && node tests/post-apply-view-refresh.mjs && node tests/apply-plan-consumed.mjs && node tests/apply-report-opt-in.mjs && node tests/reconciliation.mjs && node tests/reconciliation-writer-lock.mjs
      - name: Verify full regression suite
        run: npm test
      - name: Commit Task 5 GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git diff --cached --check
          git commit -m "feat: expose verified post-Apply state"
          git push origin HEAD:feat/v1.9.40-self-check-reconciliation
