name: Dev Picker GREEN

on:
  push:
    branches:
      - feat/dictionary-picker-hardening

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/dictionary-picker-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply production core patch
        run: node tools/dev-picker-core-patch.mjs
      - name: Targeted production contracts
        run: |
          node tests/schema-refresh-circular-regression.mjs
          node tests/picker-production-ux.mjs
          node tests/record-keeping-partners.mjs
          node tests/picker-performance.mjs
      - name: Full regression
        run: npm test
      - name: Commit verified implementation and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-picker-red.yml .github/workflows/dev-picker-green.yml tools/dev-picker-core-patch.mjs
          git add tessa-matrix-studio.user.js package.json tests/schema-refresh-circular-regression.mjs tests/picker-production-ux.mjs tests/record-keeping-partners.mjs tests/picker-performance.mjs
          git commit -m "feat: harden picker data and record-keeping organizations"
          git push origin HEAD:feat/dictionary-picker-hardening
