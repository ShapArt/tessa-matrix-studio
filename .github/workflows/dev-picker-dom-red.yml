name: Dev Picker DOM RED

on:
  push:
    branches:
      - feat/dictionary-picker-hardening

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Expected RED — production picker DOM is not wired yet
        run: node tests/picker-dom-production.cjs
