name: v1.14 Recovery Task14 APPLY

on:
  push:
    branches: [fix/v1.14-recovery-uat-resolution]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task14-apply:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[task14-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Confirm Task14 RED before production patch
        run: |
          if node tests/recovery-task14-diagnostics-bounds.mjs; then
            echo "Task14 test unexpectedly passed before the fix."
            exit 1
          fi
          echo "Task14 RED confirmed."
      - name: Apply deterministic Task14 production patch
        run: node tools/patch-task14-diagnostics-bounds.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check tessa-matrix-studio.user.js
      - name: Task14 bounded diagnostics regression
        run: node tests/recovery-task14-diagnostics-bounds.mjs
      - name: Existing diagnostics regression
        run: node tests/studio-diagnostics.mjs
      - name: Interval diagnostics bundle regression
        run: node tests/studio-interval-bundle.mjs
      - name: Task13 selective XLSX regression
        run: node tests/recovery-task13-selective-xlsx.mjs
      - name: Full UAT bounded-memory regression
        run: node tests/full-uat-memory-bounded.mjs
      - name: Full regression
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json
          if git diff --cached --quiet; then
            echo "No production diff to commit."
            exit 0
          fi
          git commit -m "fix: bound high-cardinality diagnostics evidence [task14-green]"
          git push origin HEAD:fix/v1.14-recovery-uat-resolution
