name: Patch global blocker preview

on:
  push:
    branches: [fix/v1.9.38-global-blocker-uat]
    paths:
      - '.github/scripts/patch_global_blocker.py'
      - '.github/workflows/patch-global-blocker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v1.9.38-global-blocker-uat
      - name: Patch userscript
        run: python .github/scripts/patch_global_blocker.py
      - name: Commit patch and remove temporary helper
        shell: bash
        run: |
          rm -f .github/scripts/patch_global_blocker.py .github/workflows/patch-global-blocker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js .github/scripts/patch_global_blocker.py .github/workflows/patch-global-blocker.yml
          git commit -m 'fix: suppress row spam behind global workbook blocker'
          git push origin HEAD:fix/v1.9.38-global-blocker-uat
