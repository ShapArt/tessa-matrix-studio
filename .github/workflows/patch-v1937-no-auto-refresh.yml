name: Patch v1.9.37 no auto refresh
on:
  push:
    branches: [feat/preprod-mega-uat-hardening]
    paths:
      - scripts/patch_v1937_no_auto_refresh.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply deterministic patch
        run: python scripts/patch_v1937_no_auto_refresh.py
      - name: Focused test
        run: node tests/apply-refresh-failure-result.mjs
      - name: Commit source change and self-remove helper
        run: |
          rm scripts/patch_v1937_no_auto_refresh.py .github/workflows/patch-v1937-no-auto-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: avoid native matrix view refresh after Apply"
          git push origin HEAD:feat/preprod-mega-uat-hardening
