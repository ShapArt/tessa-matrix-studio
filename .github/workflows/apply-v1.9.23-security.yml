name: Apply v1.9.23 security patch

on:
  push:
    branches: ["security/xlsx-archive-guards-v1.9.23"]
    paths: [".github/workflows/apply-v1.9.23-security.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/xlsx-archive-guards-v1.9.23
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply production patch
        run: node scripts/apply-v1.9.23-security-patch.mjs
      - name: Verify full suite before push
        run: npm test
      - name: Commit patched production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          git rm scripts/apply-v1.9.23-security-patch.mjs .github/workflows/apply-v1.9.23-security.yml
          git commit -m "security: bound XLSX archive extraction"
          git push origin HEAD:security/xlsx-archive-guards-v1.9.23
