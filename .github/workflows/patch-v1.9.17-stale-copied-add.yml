name: Patch v1.9.17 stale copied ADD source

on:
  push:
    branches: [fix/preflight-stale-copied-add-source-v1.9.17]
    paths:
      - '.github/workflows/patch-v1.9.17-stale-copied-add.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/preflight-stale-copied-add-source-v1.9.17
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply minimal copied ADD preflight fix
        run: node tools/patch-v1.9.17-stale-copied-add.cjs
      - name: Verify full regression suite
        run: npm test
      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/patch-v1.9.17-stale-copied-add.cjs .github/workflows/patch-v1.9.17-stale-copied-add.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tessa-matrix-studio.user.js tools/patch-v1.9.17-stale-copied-add.cjs .github/workflows/patch-v1.9.17-stale-copied-add.yml
          git commit -m 'fix: recheck copied ADD source before Apply'
          git push origin HEAD:fix/preflight-stale-copied-add-source-v1.9.17
