name: Dev Version v1.9.25

on:
  push:
    branches:
      - fix/excel-auto-date-v1.9.25

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/excel-auto-date-v1.9.25
          fetch-depth: 1
      - name: Bump userscript version
        run: |
          sed -i 's/@version      1\.9\.24/@version      1.9.25/' tessa-matrix-studio.user.js
          sed -i "0,/version: '1\.9\.24'/s//version: '1.9.25'/" tessa-matrix-studio.user.js
          node --check tessa-matrix-studio.user.js
          grep -q '@version      1.9.25' tessa-matrix-studio.user.js
          grep -q "version: '1.9.25'" tessa-matrix-studio.user.js
      - name: Commit version and remove helper
        run: |
          rm .github/workflows/dev-version-v1.9.25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js .github/workflows/dev-version-v1.9.25.yml
          git commit -m "chore: bump userscript to v1.9.25"
          git push origin HEAD:fix/excel-auto-date-v1.9.25
