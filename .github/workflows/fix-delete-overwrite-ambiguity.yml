name: Fix delete overwrite ambiguity

on:
  push:
    branches:
      - fix/delete-overwrite-ambiguity-v1.9.10

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/delete-overwrite-ambiguity-v1.9.10
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Block ambiguous DELETE on overwrite target
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tessa-matrix-studio.user.js';
          let text = fs.readFileSync(path, 'utf8');

          function replaceOnce(source, oldValue, newValue, label) {
            const count = source.split(oldValue).length - 1;
            if (count !== 1) throw new Error(`${label}: expected 1 match, got ${count}`);
            return source.replace(oldValue, newValue);
          }

          const schemaAnchor = [
            '      const positionalOverwriteTarget = positionalOverwriteTargets.get(desired) || null;',
            '      let current = positionalOverwriteTarget || (desired.system.versionId ? byVersion.get(canonicalValue(desired.system.versionId)) : null);',
          ].join('\n');
          const schemaReplacement = [
            '      const positionalOverwriteTarget = positionalOverwriteTargets.get(desired) || null;',
            "      if (positionalOverwriteTarget && desired.system.action === 'delete') {",
            '        throw new Error(`Строка Excel ${desired.excelRow}: операция неоднозначна — строка одновременно распознана как ЗАМЕНИТЬ и помечена УДАЛИТЬ. Нельзя безопасно определить цель удаления. Выполните удаление отдельно в свежей выгрузке.`);',
            '      }',
            '      let current = positionalOverwriteTarget || (desired.system.versionId ? byVersion.get(canonicalValue(desired.system.versionId)) : null);',
          ].join('\n');
          text = replaceOnce(text, schemaAnchor, schemaReplacement, 'schema refresh ambiguity guard');

          const plannerAnchor = [
            '      const positionalOverwriteTarget = positionalOverwriteTargets.get(excelRow) || null;',
            '      const currentRow = positionalOverwriteTarget || findCurrent(excelRow);',
          ].join('\n');
          const plannerReplacement = [
            '      const positionalOverwriteTarget = positionalOverwriteTargets.get(excelRow) || null;',
            "      if (positionalOverwriteTarget && action === 'delete') {",
            '        const protectedIdentity = canonicalValue(positionalOverwriteTarget.versionId || positionalOverwriteTarget.rowCardId);',
            '        if (protectedIdentity) usedCurrent.add(protectedIdentity);',
            '        identityMappingAnomaly = true;',
            '        issues.push(`Строка Excel ${excelRow.excelRow}: операция неоднозначна — строка одновременно распознана как ЗАМЕНИТЬ и помечена УДАЛИТЬ. Целевая строка TESSA сохранена без изменений. Выполните удаление отдельно в свежей выгрузке.`);',
            '        continue;',
            '      }',
            '      const currentRow = positionalOverwriteTarget || findCurrent(excelRow);',
          ].join('\n');
          text = replaceOnce(text, plannerAnchor, plannerReplacement, 'planner ambiguity guard');

          text = text.replaceAll('1.9.9', '1.9.10');
          fs.writeFileSync(path, text, 'utf8');

          const simpleFiles = [
            'README.md',
            'package.json',
            'tests/smoke.mjs',
            '.github/ISSUE_TEMPLATE/bug_report.yml',
          ];
          for (const file of simpleFiles) {
            let value = fs.readFileSync(file, 'utf8');
            value = value.replaceAll('1.9.9', '1.9.10');
            fs.writeFileSync(file, value, 'utf8');
          }

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const head = '# Changelog\n\n';
          if (!changelog.startsWith(head)) throw new Error('unexpected CHANGELOG header');
          changelog = head
            + '## 1.9.10 — 2026-08-27\n\n'
            + '- заблокирован неоднозначный legacy-сценарий, когда строка одновременно определяется как `ЗАМЕНИТЬ` и помечена `УДАЛИТЬ`;\n'
            + '- Compare сохраняет целевую строку без изменений и показывает локальный SKIP с явной причиной вместо попытки угадать цель удаления;\n'
            + '- актуализация Excel-схемы отказывается переносить `УДАЛИТЬ` на positional overwrite target и требует выполнить удаление отдельно в свежей выгрузке.\n\n'
            + changelog.slice(head.length);
          fs.writeFileSync('CHANGELOG.md', changelog, 'utf8');
          NODE

      - name: Verify full regression suite
        run: npm test

      - name: Commit release-ready fix and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-delete-overwrite-ambiguity.yml
          git add tessa-matrix-studio.user.js tests/overwrite-delete.mjs tests/smoke.mjs package.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m 'v1.9.10 — block ambiguous DELETE on overwrite row'
          git push origin HEAD:fix/delete-overwrite-ambiguity-v1.9.10
