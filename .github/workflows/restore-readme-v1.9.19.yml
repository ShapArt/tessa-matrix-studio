name: Temporary v1.9.19 README restore

on:
  push:
    branches:
      - fix/dependent-delete-missing-columns-v1.9.19
    paths:
      - scripts/restore-readme-v1.9.19.cjs
      - .github/workflows/restore-readme-v1.9.19.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependent-delete-missing-columns-v1.9.19
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore preserved README sections
        run: node scripts/restore-readme-v1.9.19.cjs
      - name: Full regression suite
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit restore and remove helper
        run: |
          rm -f scripts/restore-readme-v1.9.19.cjs .github/workflows/restore-readme-v1.9.19.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve README security and troubleshooting sections"
          git push origin HEAD:fix/dependent-delete-missing-columns-v1.9.19
