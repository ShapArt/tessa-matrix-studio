name: Finalize v1.9.23 release files

on:
  push:
    branches: ["security/xlsx-archive-guards-v1.9.23"]
    paths: [".github/workflows/finalize-v1.9.23-release.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/xlsx-archive-guards-v1.9.23
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Update release files
        run: node scripts/finalize-v1.9.23-release.mjs
      - name: Verify full release contract
        run: npm test
      - name: Commit release files and remove staging helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml
          git rm scripts/finalize-v1.9.23-release.mjs .github/workflows/finalize-v1.9.23-release.yml
          git commit -m "release: prepare v1.9.23"
          git push origin HEAD:security/xlsx-archive-guards-v1.9.23
