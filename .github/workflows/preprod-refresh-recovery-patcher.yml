name: Apply preprod refresh recovery patch

on:
  push:
    branches:
      - feat/preprod-mega-uat-hardening
    paths:
      - .github/workflows/preprod-refresh-recovery-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - name: Apply deterministic refresh recovery patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tessa-matrix-studio.user.js')
          text = path.read_text(encoding='utf-8')

          old_finalize = """    result.skippedCount = (result.skipped || []).length;\n    result.cancelled = cancelled;\n    result.status = cancelled ? 'cancelled' : (result.skippedCount > 0 || result.failedCount > 0 ? 'partial' : 'completed');\n    result.partial = result.status !== 'completed';\n    result.success = !cancelled;\n    return result;\n"""
          new_finalize = """    result.skippedCount = (result.skipped || []).length;\n    result.cancelled = cancelled;\n    result.verificationIncomplete = Boolean(result.verificationIncomplete || result.refreshError);\n    result.status = cancelled ? 'cancelled' : (result.verificationIncomplete || result.skippedCount > 0 || result.failedCount > 0 ? 'partial' : 'completed');\n    result.partial = result.status !== 'completed';\n    result.success = !cancelled && !result.verificationIncomplete;\n    return result;\n"""
          if old_finalize not in text:
              raise SystemExit('finalize marker not found')
          text = text.replace(old_finalize, new_finalize, 1)

          old_message = """    if (result?.partial || result?.status === 'partial') {\n      return `Применение завершено частично.\\n\\nПрименено: ${applied}\\nПропущено: ${skipped}\\n\\nПропущенные или конфликтующие строки не применялись. Скачайте свежую выгрузку Excel перед продолжением.`;\n    }\n"""
          new_message = """    if (result?.verificationIncomplete || result?.refreshError) {\n      return `Запись завершена, но итоговое состояние TESSA не удалось перечитать.\\n\\nПрименено по ответам Store: ${applied}\\nПропущено: ${skipped}\\n\\nНе повторяйте старый Apply: уже выполненные записи могли сохраниться. Обновите страницу и скачайте свежую выгрузку Excel, затем постройте Preview заново.`;\n    }\n    if (result?.partial || result?.status === 'partial') {\n      return `Применение завершено частично.\\n\\nПрименено: ${applied}\\nПропущено: ${skipped}\\n\\nПропущенные или конфликтующие строки не применялись. Скачайте свежую выгрузку Excel перед продолжением.`;\n    }\n"""
          if old_message not in text:
              raise SystemExit('message marker not found')
          text = text.replace(old_message, new_message, 1)

          old_result_fields = """      storeSkippedCount: 0,\n      failedCount: 0,\n      notStartedCount: totalToStore,\n    };\n"""
          new_result_fields = """      storeSkippedCount: 0,\n      failedCount: 0,\n      notStartedCount: totalToStore,\n      verificationIncomplete: false,\n      refreshError: null,\n    };\n"""
          if old_result_fields not in text:
              raise SystemExit('result fields marker not found')
          text = text.replace(old_result_fields, new_result_fields, 1)

          old_refresh = """    setProgress(96, cancelled ? 'Фиксирую остановленную операцию' : 'Обновляю карточку TESSA', 'Получаю итоговое состояние');\n    await bridge.refresh();\n    result.finishedAt = nowIso();\n    finalizeApplyResult(result, { cancelled });\n"""
          new_refresh = """    setProgress(96, cancelled ? 'Фиксирую остановленную операцию' : 'Обновляю карточку TESSA', 'Получаю итоговое состояние');\n    try {\n      await bridge.refresh();\n    } catch (error) {\n      result.refreshError = String(error?.message || error || 'Не удалось обновить карточку TESSA после записи.');\n      result.verificationIncomplete = true;\n      log(`Изменения записаны, но итоговое обновление карточки TESSA завершилось ошибкой: ${result.refreshError}`, 'warn', error);\n    }\n    result.finishedAt = nowIso();\n    finalizeApplyResult(result, { cancelled });\n"""
          if old_refresh not in text:
              raise SystemExit('refresh marker not found')
          text = text.replace(old_refresh, new_refresh, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched source and remove patch runner
        shell: bash
        run: |
          rm .github/workflows/preprod-refresh-recovery-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js .github/workflows/preprod-refresh-recovery-patcher.yml
          git commit -m "fix: preserve Apply result when post-store refresh fails"
          git push origin HEAD:feat/preprod-mega-uat-hardening
