name: v1.14 Recovery Task10 GREEN

on:
  push:
    branches:
      - fix/v1.14-recovery-uat-resolution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task10-green:
    name: task10-green
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: node --check tessa-matrix-studio.user.js

      - name: Focused recovery contracts
        run: |
          node tests/recovery-task7-field-uat.mjs
          node tests/recovery-task8-button-uat.mjs
          node tests/recovery-task9-destructive-restore.mjs

      - name: Workflow security and release contracts
        run: |
          node tests/release-workflow.mjs
          node tests/workflow-security.mjs
          node tests/release-native-evidence-gate.mjs

      - name: Full regression
        run: npm test

      - name: Diff hygiene
        run: git diff --check

      - name: Exact-head clean tree
        run: test -z "$(git status --porcelain)"
