name: Verify 1.13.0 RC bump

on:
  push:
    branches:
      - feat/cross-matrix-replacement
    paths:
      - tools/dev-bump-1.13.0.mjs
      - .github/workflows/dev-bump-1.13.0.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cross-matrix-replacement
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply version bump
        run: node tools/dev-bump-1.13.0.mjs
      - name: Verify metadata consistency
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const user = fs.readFileSync('tessa-matrix-studio.user.js', 'utf8');
          if (pkg.version !== '1.13.0') throw new Error('package version mismatch');
          if (lock.version !== '1.13.0' || lock.packages?.['']?.version !== '1.13.0') throw new Error('lock version mismatch');
          if (!/^\/\/ @version\s+1\.13\.0$/m.test(user)) throw new Error('userscript header mismatch');
          if (!/version:\s*'1\.13\.0'/.test(user)) throw new Error('APP version mismatch');
          NODE
      - name: Full regression suite
        run: npm test
      - name: Commit verified version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json package-lock.json
          git commit -m "chore: prepare 1.13.0 release candidate"
          git push origin HEAD:feat/cross-matrix-replacement
