name: v1.14 Canonical UAT Artifact GREEN

on:
  push:
    branches: [fix/v1.14-canonical-uat-artifact]

permissions:
  contents: write

jobs:
  green:
    if: contains(github.event.head_commit.message, '[rc-artifact-green]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm RED contract
        run: |
          if node tests/uat-candidate-workflow.mjs; then
            echo "Expected canonical Full UAT composition contract to fail before patch"
            exit 1
          fi
      - name: Remove duplicate legacy Full UAT concatenation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          needle = "          cat hotfixes/full-uat-runner-v1.js >> dist/tessa-matrix-studio.user.js\n"
          for raw in ('.github/workflows/uat-candidate.yml', '.github/workflows/release.yml'):
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'{raw}: expected exactly one legacy Full UAT concatenation, found {count}')
              path.write_text(text.replace(needle, '', 1), encoding='utf-8')
          PY
      - name: Verify focused artifact contracts
        run: |
          node tests/uat-candidate-workflow.mjs
          node tests/release-workflow.mjs
          node tests/workflow-security.mjs
      - name: Verify full regression
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified GREEN and retire one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc-artifact-green.yml
          git add .github/workflows/uat-candidate.yml .github/workflows/release.yml tests/uat-candidate-workflow.mjs
          git commit -m "fix: package canonical Full UAT exactly once [rc-artifact-green]"
          git push origin HEAD:fix/v1.14-canonical-uat-artifact
