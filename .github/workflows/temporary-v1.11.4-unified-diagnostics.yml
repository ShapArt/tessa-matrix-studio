name: Temporary v1.11.4 unified diagnostics

on:
  push:
    branches: [feat/v1.11.4-unified-diagnostics-final]
    paths:
      - tools/temporary-v1.11.4-unified-diagnostics-patch.py
      - .github/workflows/temporary-v1.11.4-unified-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v1.11.4-unified-diagnostics-final
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply bounded production patch
        run: python3 tools/temporary-v1.11.4-unified-diagnostics-patch.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Targeted GREEN
        run: node tests/studio-interval-bundle.mjs
      - name: Full regression suite
        run: npm test
      - name: Commit self-cleaned implementation
        run: |
          rm tools/temporary-v1.11.4-unified-diagnostics-patch.py
          rm .github/workflows/temporary-v1.11.4-unified-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json tests/studio-interval-bundle.mjs tools/temporary-v1.11.4-unified-diagnostics-patch.py .github/workflows/temporary-v1.11.4-unified-diagnostics.yml
          git commit -m "feat: bundle interval diagnostics into Studio ZIP"
          git push origin HEAD:feat/v1.11.4-unified-diagnostics-final
