name: Live UAT final-four CI

on:
  push:
    branches: [fix/v1.14-live-uat-final-four]
  pull_request:
    branches: [feat/incremental-performance-v1.14]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Final four regression
        run: node tests/live-uat-final-four-regressions.mjs
      - name: Diff hygiene
        run: git diff --check
