name: Fix preview sorted overwrite

on:
  push:
    branches:
      - fix/preview-sorted-overwrite-v1.9.9

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/preview-sorted-overwrite-v1.9.9
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Patch overwrite presentation and release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, text) { fs.writeFileSync(path, text, 'utf8'); }
          function replaceOnce(text, oldValue, newValue, label) {
            const count = text.split(oldValue).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one match, got ${count}`);
            return text.replace(oldValue, newValue);
          }

          let code = read('tessa-matrix-studio.user.js');
          code = replaceOnce(
            code,
            '  function stripFormulaMarker(value) {',
            "  function isOverwriteMatch(match) {\n    return ['position-overwrite', 'missing-identity-overwrite'].includes(match?.matchedBy);\n  }\n\n  function stripFormulaMarker(value) {",
            'insert isOverwriteMatch'
          );
          code = replaceOnce(
            code,
            "      tickStoreProgress(action.match?.matchedBy === 'position-overwrite' ? 'Заменяю строки' : 'Обновляю строки');",
            "      tickStoreProgress(isOverwriteMatch(action.match) ? 'Заменяю строки' : 'Обновляю строки');",
            'apply progress replacement'
          );
          code = replaceOnce(
            code,
            "      const isReplacement = action.type === 'update' && action.match?.matchedBy === 'position-overwrite';",
            "      const isReplacement = action.type === 'update' && isOverwriteMatch(action.match);",
            'preview replacement label'
          );
          code = replaceOnce(
            code,
            '    normalizeSpace, stripFormulaMarker, canonicalHeader, canonicalValue, definitionKey, splitCell, mapConcurrent,',
            '    normalizeSpace, isOverwriteMatch, stripFormulaMarker, canonicalHeader, canonicalValue, definitionKey, splitCell, mapConcurrent,',
            'test export'
          );
          code = code.replaceAll('1.9.8', '1.9.9');
          write('tessa-matrix-studio.user.js', code);

          let planner = read('tests/planner.mjs');
          planner = replaceOnce(
            planner,
            "console.log('TESSA Matrix Studio planner tests: OK');",
            "// Оба способа определения overwrite должны одинаково отображаться как ЗАМЕНИТЬ.\nassert(E.isOverwriteMatch({ matchedBy: 'position-overwrite' }) === true, 'position overwrite must be recognized as replacement');\nassert(E.isOverwriteMatch({ matchedBy: 'missing-identity-overwrite' }) === true, 'sorted overwrite must be recognized as replacement');\nassert(E.isOverwriteMatch({ matchedBy: 'identity' }) === false, 'ordinary identity update must not be replacement');\n\nconsole.log('TESSA Matrix Studio planner tests: OK');",
            'planner regression'
          );
          write('tests/planner.mjs', planner);

          let smoke = read('tests/smoke.mjs').replaceAll('1.9.8', '1.9.9');
          write('tests/smoke.mjs', smoke);

          let pkg = read('package.json').replaceAll('1.9.8', '1.9.9');
          write('package.json', pkg);

          let readme = read('README.md').replaceAll('1.9.8', '1.9.9');
          write('README.md', readme);

          let issue = read('.github/ISSUE_TEMPLATE/bug_report.yml').replaceAll('1.9.8', '1.9.9');
          write('.github/ISSUE_TEMPLATE/bug_report.yml', issue);

          let changelog = read('CHANGELOG.md');
          changelog = replaceOnce(
            changelog,
            '# Changelog\n\n',
            '# Changelog\n\n## 1.9.9 — 2026-08-27\n\n- sorted overwrite (`missing-identity-overwrite`) теперь отображается как `ЗАМЕНИТЬ`, а не как обычное `ИЗМЕНИТЬ`;\n- preview показывает направление `Excel → TESSA` для обоих вариантов overwrite;\n- progress применения использует тот же единый признак overwrite и показывает этап `Заменяю строки`.\n\n',
            'changelog section'
          );
          write('CHANGELOG.md', changelog);
          NODE

      - name: Verify full suite
        run: npm test

      - name: Commit release-ready v1.9.9 and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-preview-sorted-overwrite.yml
          git add tessa-matrix-studio.user.js tests/planner.mjs tests/smoke.mjs package.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m 'v1.9.9 — show sorted overwrite as replacement'
          git push origin HEAD:fix/preview-sorted-overwrite-v1.9.9
