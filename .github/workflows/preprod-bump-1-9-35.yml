name: Apply v1.9.35 UAT UX release sync

on:
  push:
    branches:
      - feat/preprod-mega-uat-hardening
    paths:
      - .github/workflows/preprod-bump-1-9-35.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - name: Sync v1.9.35 source and docs
        run: python3 scripts/preprod_bump_1_9_35.py
      - name: Commit source/docs and remove temporary patcher
        run: |
          rm scripts/preprod_bump_1_9_35.py
          rm .github/workflows/preprod-bump-1-9-35.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js README.md CHANGELOG.md scripts/preprod_bump_1_9_35.py .github/workflows/preprod-bump-1-9-35.yml
          git commit -m "release: document oversized Apply UX in 1.9.35"
          git push origin HEAD:feat/preprod-mega-uat-hardening
