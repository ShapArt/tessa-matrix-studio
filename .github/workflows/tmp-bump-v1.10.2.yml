name: Temporary v1.10.2 bump

on:
  push:
    branches:
      - release/v1.10.2

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'ShapArt/tessa-matrix-studio' && github.ref == 'refs/heads/release/v1.10.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.10.2
      - name: Apply exact version bump and self-clean
        shell: bash
        run: |
          set -euo pipefail
          node tools/tmp-bump-v1.10.2.mjs
          rm tools/tmp-bump-v1.10.2.mjs
          rm .github/workflows/tmp-bump-v1.10.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js package.json package-lock.json CHANGELOG.md tools/tmp-bump-v1.10.2.mjs .github/workflows/tmp-bump-v1.10.2.yml
          git diff --cached --check
          grep -Fqx '// @version      1.10.2' tessa-matrix-studio.user.js
          grep -Fq "version: '1.10.2'" tessa-matrix-studio.user.js
          test "$(node -p "require('./package.json').version")" = '1.10.2'
          test "$(node -p "require('./package-lock.json').version")" = '1.10.2'
          git commit -m "chore: bump release version to 1.10.2"
          git push origin HEAD:release/v1.10.2
