name: Apply Preview performance patch

on:
  push:
    branches:
      - feat/preprod-mega-uat-hardening
    paths:
      - .github/workflows/preview-performance-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/preprod-mega-uat-hardening
          fetch-depth: 0
      - name: Patch userscript
        run: python3 scripts/patch-preview-performance.py
      - name: Commit patched source and remove temporary patch files
        run: |
          rm .github/workflows/preview-performance-patcher.yml scripts/patch-preview-performance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js .github/workflows/preview-performance-patcher.yml scripts/patch-preview-performance.py
          git commit -m "perf: accelerate large Preview and show ETA"
          git push origin HEAD:feat/preprod-mega-uat-hardening
