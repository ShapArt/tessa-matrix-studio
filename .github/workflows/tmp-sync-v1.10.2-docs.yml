name: Temporary v1.10.2 docs sync

on:
  push:
    branches:
      - release/v1.10.2

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'ShapArt/tessa-matrix-studio' && github.ref == 'refs/heads/release/v1.10.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.10.2
      - name: Sync exact documentation versions and self-clean
        shell: bash
        run: |
          set -euo pipefail
          node tools/tmp-sync-v1.10.2-docs.mjs
          rm tools/tmp-sync-v1.10.2-docs.mjs
          rm .github/workflows/tmp-sync-v1.10.2-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/ISSUE_TEMPLATE/bug_report.yml tools/tmp-sync-v1.10.2-docs.mjs .github/workflows/tmp-sync-v1.10.2-docs.yml
          git diff --cached --check
          grep -Fq 'version-1.10.2-' README.md
          grep -Fq '**v1.10.2 · Автор: Шаповалов Артём**' README.md
          grep -Fq 'Подтвердите установку версии **1.10.2**' README.md
          grep -Fq 'Текущая версия: **1.10.2**' README.md
          grep -Fq 'placeholder: 1.10.2' .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m "docs: sync public version references to 1.10.2"
          git push origin HEAD:release/v1.10.2
