name: Dev Patch v1.9.25 Auto Date

on:
  push:
    branches:
      - fix/excel-auto-date-v1.9.25

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/excel-auto-date-v1.9.25
          fetch-depth: 1
      - name: Patch auto-date fail-closed guard
        run: python .github/scripts/patch-v1.9.25-autodate.py
      - name: Verify auto-date regression GREEN
        run: node tests/xlsx-auto-date.mjs
      - name: Commit patch and remove helpers
        run: |
          rm .github/workflows/dev-patch-v1.9.25-autodate.yml .github/scripts/patch-v1.9.25-autodate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js .github/workflows/dev-patch-v1.9.25-autodate.yml .github/scripts/patch-v1.9.25-autodate.py
          git commit -m "fix: block Excel auto-date serials for non-date criteria"
          git push origin HEAD:fix/excel-auto-date-v1.9.25
