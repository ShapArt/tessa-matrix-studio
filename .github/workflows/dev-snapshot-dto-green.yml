name: Dev Snapshot DTO GREEN

on:
  push:
    branches:
      - feat/dictionary-picker-hardening

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/dictionary-picker-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply DTO boundary patch
        run: node tools/dev-snapshot-dto-patch.mjs
      - name: Targeted circular regression
        run: node tests/snapshot-dto-boundary.mjs
      - name: Full regression
        run: npm test
      - name: Commit verified implementation and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-snapshot-dto-red.yml .github/workflows/dev-snapshot-dto-green.yml tools/dev-snapshot-dto-patch.mjs
          git add tessa-matrix-studio.user.js package.json tests/snapshot-dto-boundary.mjs
          git commit -m "fix: keep live TESSA cards out of snapshot DTOs"
          git push origin HEAD:feat/dictionary-picker-hardening
