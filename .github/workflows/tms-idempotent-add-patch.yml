name: Temporary idempotent ADD patch

on:
  push:
    branches:
      - fix/v1.11.10-malformed-range-diagnostic
    paths:
      - .github/workflows/tms-idempotent-add-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.11.10-malformed-range-diagnostic
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Patch userscript
        run: node scripts/patch-idempotent-existing-add.mjs
      - name: Verify focused regression
        run: node tests/idempotent-existing-add.mjs
      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tessa-matrix-studio.user.js
          if git diff --cached --quiet; then
            echo "No production patch was needed."
            exit 0
          fi
          git commit -m "fix: make repeated exact ADD idempotent"
          git push origin HEAD:fix/v1.11.10-malformed-range-diagnostic
