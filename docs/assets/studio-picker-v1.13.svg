<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820">
  <style>
    .bg{fill:#f5f6f8}.panel{fill:#fff;stroke:#d9dce1}.line{stroke:#e3e5e8}.title{font:600 24px Arial;fill:#20242a}.sub{font:16px Arial;fill:#7d828a}.h{font:600 18px Arial;fill:#2d3137}.t{font:17px Arial;fill:#343941}.m{font:14px Arial;fill:#7a8088}.btn{fill:#fff;stroke:#d4d7dc}.primary{fill:#eb8c96}.chip{fill:#f1f2f4}.row{fill:#fff;stroke:#e2e4e8}.input{fill:#fff;stroke:#cfd3d8}.red{fill:#d92334}.b{font:600 16px Arial;fill:#252a31}.bp{font:600 16px Arial;fill:#fff}
