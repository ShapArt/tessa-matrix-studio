  <rect class="row" x="56" y="382" width="868" height="82" rx="8"/><circle cx="82" cy="411" r="9" fill="#eb8c96"/><text class="b" x="106" y="410">Абрамов Д.С. — Аналитик</text><text class="m" x="106" y="436">Абрамов Денис Сергеевич · Управление бизнес-анализа · Сотрудник</text>
  <rect class="row" x="56" y="476" width="868" height="82" rx="8"/><circle cx="82" cy="505" r="9" fill="#fff" stroke="#c9cdd3"/><text class="b" x="106" y="504">Алпатов А.Л. — Старший бизнес-эксперт</text><text class="m" x="106" y="530">Алпатов Алексей Леонидович · Центр развития процессов · Сотрудник</text>
  <rect class="row" x="56" y="570" width="868" height="82" rx="8"/><circle cx="82" cy="599" r="9" fill="#fff" stroke="#c9cdd3"/><text class="b" x="106" y="598">Таразян Л.Г. — Бизнес-эксперт (+2)</text><text class="m" x="106" y="624">Таразян Левон Гарикович · несколько актуальных назначений</text>
