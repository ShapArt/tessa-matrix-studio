  <rect class="bg" width="980" height="820"/><rect class="panel" x="30" y="18" width="920" height="784" rx="12"/>
  <circle cx="66" cy="58" r="18" class="red"/><text class="title" x="100" y="53">TESSA Matrix Studio</text><text class="sub" x="100" y="77">Собрать значения · v1.13.0</text><line class="line" x1="30" y1="98" x2="950" y2="98"/>
  <text class="h" x="56" y="140">Собрать значения для Excel</text><text class="m" x="56" y="166">Поиск работает независимо от выпадающих списков Excel.</text>
  <text class="t" x="56" y="206">Поле</text><rect class="input" x="56" y="220" width="390" height="46" rx="8"/><text class="t" x="72" y="250">Функция · Согласующий</text><text class="t" x="418" y="250">⌄</text>
  <text class="t" x="468" y="206">Тип роли</text><rect class="input" x="468" y="220" width="200" height="46" rx="8"/><text class="t" x="484" y="250">Сотрудник</text><text class="t" x="638" y="250">⌄</text>
