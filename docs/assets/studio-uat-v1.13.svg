<svg xmlns="http://www.w3.org/2000/svg" width="980" height="850" viewBox="0 0 980 850"><style>.bg{fill:#f5f6f8}.panel{fill:#fff;stroke:#d9dce1}.line{stroke:#e3e5e8}.title{font:600 24px Arial;fill:#20242a}.sub{font:16px Arial;fill:#7d828a}.h{font:600 18px Arial;fill:#2d3137}.m{font:14px Arial;fill:#7a8088}.btn{fill:#fff;stroke:#d4d7dc}.primary{fill:#eb8c96}.b{font:600 15px Arial;fill:#252a31}.bp{font:600 16px Arial;fill:#fff}.pass{fill:#eff8f2;stroke:#c6e5cf}.green{fill:#237548}.chip{fill:#f1f2f4}</style><rect class="bg" width="980" height="850"/><rect class="panel" x="30" y="18" width="920" height="814" rx="12"/><circle cx="66" cy="58" r="18" fill="#df2434"/><text class="title" x="100" y="53">TESSA Matrix Studio</text><text class="sub" x="100" y="77">Дополнительно · диагностика и Full UAT</text><line class="line" x1="30" y1="98" x2="950" y2="98"/><text class="h" x="56" y="140">Справочники и актуальность Excel</text><rect class="btn" x="56" y="158" width="294" height="44" rx="8"/><text class="b" x="73" y="186">Обновить справочники в моём Excel</text><rect class="btn" x="364" y="158" width="286" height="44" rx="8"/><text class="b" x="384" y="186">Объединить с актуальной TESSA</text><text class="m" x="56" y="226">Правки пользователя сохраняются; изменения других пользователей объединяются с конфликтами для выбора.</text><line class="line" x1="56" y1="248" x2="924" y2="248"/><text class="h" x="56" y="286">Проверки и диагностика</text><rect class="btn" x="56" y="304" width="176" height="44" rx="8"/><text class="b" x="75" y="332">Запустить проверки</text><rect class="btn" x="244" y="304" width="224" height="44" rx="8"/><text class="b" x="262" y="332">Скачать пакет диагностики</text><text class="m" x="56" y="372">Пакет содержит структуру, рабочие значения, запросы и ответы TESSA — без ручного сбора логов.</text><text class="h" x="56" y="418">Полный UAT</text><text class="m" x="56" y="444">Автоматически проверяет пользовательские сценарии на тестовом черновике и откатывает временные изменения.</text><rect class="primary" x="56" y="464" width="210" height="48" rx="9"/><text class="bp" x="81" y="494">Запустить полный UAT</text><rect class="pass" x="286" y="464" width="320" height="48" rx="9"/><text class="b green" x="307" y="494">Последний прогон: PASSED · 18/18</text><text class="h" x="56" y="558">Что проверяется автоматически</text><rect class="chip" x="56" y="578" width="214" height="38" rx="8"/><text class="b" x="73" y="603">ADD / UPDATE / DELETE</text><rect class="chip" x="282" y="578" width="218" height="38" rx="8"/><text class="b" x="299" y="603">Пустые строки и копии</text><rect class="chip" x="512" y="578" width="206" height="38" rx="8"/><text class="b" x="529" y="603">Refresh справочников</text><rect class="chip" x="730" y="578" width="194" height="38" rx="8"/><text class="b" x="748" y="603">Merge с TESSA</text><rect class="chip" x="56" y="628" width="220" height="38" rx="8"/><text class="b" x="73" y="653">ФИО + должность</text><rect class="chip" x="288" y="628" width="260" height="38" rx="8"/><text class="b" x="305" y="653">GchPartners / IsRecordKeeping</text><rect class="chip" x="560" y="628" width="178" height="38" rx="8"/><text class="b" x="577" y="653">Read-back TESSA</text><rect class="chip" x="750" y="628" width="174" height="38" rx="8"/><text class="b" x="770" y="653">Cleanup baseline</text><line class="line" x1="56" y1="692" x2="924" y2="692"/><text class="h" x="56" y="732">Нативный интерфейс TESSA</text><text class="m" x="56" y="758">Recorder фиксирует фактические CardService-вызовы для диагностики сложных серверных случаев.</text><rect class="btn" x="56" y="776" width="196" height="40" rx="8"/><text class="b" x="74" y="802">Снять интерфейс TESSA</text><rect class="btn" x="264" y="776" width="230" height="40" rx="8"/><text class="b" x="282" y="802">Начать запись действия</text></svg>