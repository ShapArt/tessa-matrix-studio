<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
<rect width="1200" height="610" rx="24" fill="#fafafa"/>
<style>.h{font:700 25px Arial,sans-serif;fill:#292929}.t{font:700 20px Arial,sans-serif;fill:#292929}.s{font:15px Arial,sans-serif;fill:#606060}.box{fill:#fff;stroke:#dedede;stroke-width:1.3}.num{font:700 16px Arial,sans-serif;fill:#fff}.note{font:14px Arial,sans-serif;fill:#707070}</style>
<text x="50" y="55" class="h">Установка по браузерам</text>
<g transform="translate(50,90)"><rect width="340" height="205" rx="18" class="box"/><circle cx="42" cy="42" r="24" fill="#4285f4"/><text x="42" y="48" text-anchor="middle" class="num">C</text><text x="82" y="48" class="t">Chrome</text><text x="25" y="95" class="s">1. Chrome Web Store</text><text x="25" y="126" class="s">2. Добавить в Chrome</text><text x="25" y="157" class="s">3. Allow User Scripts</text><text x="25" y="188" class="s">4. Установить userscript</text></g>
<g transform="translate(430,90)"><rect width="340" height="205" rx="18" class="box"/><circle cx="42" cy="42" r="24" fill="#ff7139"/><text x="42" y="48" text-anchor="middle" class="num">F</text><text x="82" y="48" class="t">Firefox</text><text x="25" y="95" class="s">1. Firefox Add-ons</text><text x="25" y="126" class="s">2. Добавить в Firefox</text><text x="25" y="157" class="s">3. Подтвердить разрешения</text><text x="25" y="188" class="s">4. Установить userscript</text></g>
<g transform="translate(810,90)"><rect width="340" height="205" rx="18" class="box"/><circle cx="42" cy="42" r="24" fill="#0aa0f6"/><text x="42" y="48" text-anchor="middle" class="num">E</text><text x="82" y="48" class="t">Microsoft Edge</text><text x="25" y="95" class="s">1. Edge Add-ons / Chrome Store</text><text x="25" y="126" class="s">2. Установить Tampermonkey</text><text x="25" y="157" class="s">3. Разрешить userscripts</text><text x="25" y="188" class="s">4. Установить userscript</text></g>
<g transform="translate(240,325)"><rect width="340" height="205" rx="18" class="box"/><circle cx="42" cy="42" r="24" fill="#a62cff"/><text x="42" y="48" text-anchor="middle" class="num">O</text><text x="82" y="48" class="t">Opera / Chromium</text><text x="25" y="95" class="s">1. Магазин расширений</text><text x="25" y="126" class="s">2. Установить Tampermonkey</text><text x="25" y="157" class="s">3. Проверить доступ к TESSA</text><text x="25" y="188" class="s">4. Установить userscript</text></g>
<g transform="translate(620,325)"><rect width="340" height="205" rx="18" class="box"/><circle cx="42" cy="42" r="24" fill="#5a5a5a"/><text x="42" y="48" text-anchor="middle" class="num">S</text><text x="82" y="48" class="t">Safari</text><text x="25" y="95" class="s">1. Tampermonkey из App Store</text><text x="25" y="126" class="s">2. Включить расширение Safari</text><text x="25" y="157" class="s">3. Разрешить доступ к TESSA</text><text x="25" y="188" class="s">4. Проверить совместимость</text></g>
<text x="600" y="574" text-anchor="middle" class="note">Основной рабочий сценарий проверен на desktop-браузерах Chrome/Edge/Firefox. Для Safari и других браузеров перед массовым использованием рекомендуется контрольный тест на черновой матрице.</text>
</svg>
