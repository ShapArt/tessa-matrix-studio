<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <rect width="1200" height="300" rx="24" fill="#fafafa"/>
  <style>.t{font:700 22px Arial,sans-serif;fill:#292929}.s{font:16px Arial,sans-serif;fill:#666}.n{font:700 18px Arial,sans-serif;fill:#fff}</style>
  <g transform="translate(55,55)"><circle cx="40" cy="40" r="40" fill="#e31e24"/><text x="40" y="47" text-anchor="middle" class="n">1</text><text x="100" y="32" class="t">Скачать Excel</text><text x="100" y="62" class="s">из открытой матрицы TESSA</text></g>
  <path d="M300 95h90" stroke="#d1d1d1" stroke-width="6" stroke-linecap="round"/><path d="M384 82l18 13-18 13" fill="none" stroke="#d1d1d1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(405,55)"><circle cx="40" cy="40" r="40" fill="#e31e24"/><text x="40" y="47" text-anchor="middle" class="n">2</text><text x="100" y="32" class="t">Изменить Excel</text><text x="100" y="62" class="s">строки и значения, без макросов</text></g>
  <path d="M655 95h85" stroke="#d1d1d1" stroke-width="6" stroke-linecap="round"/><path d="M734 82l18 13-18 13" fill="none" stroke="#d1d1d1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(755,55)"><circle cx="40" cy="40" r="40" fill="#e31e24"/><text x="40" y="47" text-anchor="middle" class="n">3</text><text x="100" y="32" class="t">Проверить</text><text x="100" y="62" class="s">просмотреть diff до записи</text></g>
  <path d="M970 95h70" stroke="#d1d1d1" stroke-width="6" stroke-linecap="round"/><path d="M1034 82l18 13-18 13" fill="none" stroke="#d1d1d1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(1045,55)"><circle cx="40" cy="40" r="40" fill="#e31e24"/><text x="40" y="47" text-anchor="middle" class="n">4</text><text x="40" y="120" text-anchor="middle" class="t">Применить</text><text x="40" y="150" text-anchor="middle" class="s">только после проверки</text></g>
  <rect x="55" y="220" width="1090" height="45" rx="12" fill="#fff1f2" stroke="#f4b7ba"/><text x="600" y="249" text-anchor="middle" class="s" fill="#8c1c22">Скрипт не обходит права TESSA: для записи нужны права на корректировку матрицы и доступный режим редактирования.</text>
