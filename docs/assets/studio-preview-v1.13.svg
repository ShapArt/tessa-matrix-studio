<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820"><style>.bg{fill:#f5f6f8}.panel{fill:#fff;stroke:#d9dce1}.line{stroke:#e3e5e8}.title{font:600 24px Arial;fill:#20242a}.sub{font:16px Arial;fill:#7d828a}.h{font:600 18px Arial;fill:#2d3137}.m{font:14px Arial;fill:#7a8088}.primary{fill:#eb8c96}.bp{font:600 16px Arial;fill:#fff}.badge{font:600 14px Arial}.row{fill:#fff;stroke:#e2e4e8}.add{fill:#eaf8ef}.upd{fill:#fff6dd}.del{fill:#ffecef}.keep{fill:#f1f2f4}.green{fill:#237548}.red{fill:#c83545}.amber{fill:#8b6a18}.gray{fill:#697079}.b{font:600 16px Arial;fill:#252a31}</style><rect class="bg" width="980" height="820"/><rect class="panel" x="30" y="18" width="920" height="784" rx="12"/><circle cx="66" cy="58" r="18" fill="#df2434"/><text class="title" x="100" y="53">TESSA Matrix Studio</text><text class="sub" x="100" y="77">Проверка изменений · демонстрационный сценарий</text><line class="line" x1="30" y1="98" x2="950" y2="98"/><text class="h green" x="56" y="139">Проверка завершена</text><text class="m" x="56" y="165">Excel сопоставлен с актуальной матрицей. До подтверждения запись не выполняется.</text><rect class="add" x="56" y="190" width="118" height="38" rx="8"/><text class="badge green" x="78" y="214">ADD · 3</text><rect class="upd" x="184" y="190" width="138" height="38" rx="8"/><text class="badge amber" x="204" y="214">UPDATE · 2</text><rect class="del" x="332" y="190" width="136" height="38" rx="8"/><text class="badge red" x="353" y="214">DELETE · 1</text><rect class="keep" x="478" y="190" width="136" height="38" rx="8"/><text class="badge gray" x="500" y="214">KEEP · 24</text><rect class="row" x="56" y="252" width="868" height="88" rx="8"/><rect class="add" x="72" y="270" width="70" height="28" rx="7"/><text class="badge green" x="88" y="289">ADD</text><text class="b" x="160" y="286">Новая строка · Excel 31</text><text class="m" x="160" y="313">Организация: ЧЕРКИЗОВО-ОЦО · Исполнитель: Абрамов Д.С. — Аналитик</text><rect class="row" x="56" y="352" width="868" height="88" rx="8"/><rect class="upd" x="72" y="370" width="88" height="28" rx="7"/><text class="badge amber" x="83" y="389">UPDATE</text><text class="b" x="178" y="386">Изменена существующая строка · Excel 18</text><text class="m" x="178" y="413">Категория КДД: Закупки → Логистика</text><rect class="row" x="56" y="452" width="868" height="88" rx="8"/><rect class="del" x="72" y="470" width="84" height="28" rx="7"/><text class="badge red" x="84" y="489">DELETE</text><text class="b" x="174" y="486">Удалена строка · Excel 22</text><text class="m" x="174" y="513">Строка отсутствует в изменённом файле и будет удалена после подтверждения.</text><rect class="row" x="56" y="552" width="868" height="88" rx="8"/><rect class="keep" x="72" y="570" width="76" height="28" rx="7"/><text class="badge gray" x="88" y="589">KEEP</text><text class="b" x="166" y="586">Без изменений · 24 строки</text><text class="m" x="166" y="613">Эти строки не входят в Apply.</text><line class="line" x1="56" y1="666" x2="924" y2="666"/><text class="h" x="56" y="704">4 · Применение</text><rect class="primary" x="56" y="722" width="196" height="48" rx="9"/><text class="bp" x="79" y="752">Применить к TESSA</text><text class="m" x="274" y="752">После Apply Studio перечитает сервер и предложит «Проверить результат».</text></svg>