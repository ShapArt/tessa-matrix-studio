<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<rect width="1200" height="420" rx="24" fill="#fafafa"/><style>.h{font:700 25px Arial,sans-serif;fill:#292929}.t{font:700 20px Arial,sans-serif;fill:#292929}.s{font:16px Arial,sans-serif;fill:#606060}.c{fill:#fff;stroke:#dedede}</style>
<text x="50" y="55" class="h">Права и разрешения</text>
<g transform="translate(50,90)"><rect width="340" height="250" rx="18" class="c"/><text x="25" y="40" class="t">Браузер</text><text x="25" y="78" class="s">Tampermonkey установлен</text><text x="25" y="110" class="s">User Scripts разрешены</text><text x="25" y="142" class="s">Доступ к TESSA разрешён</text><text x="25" y="190" class="s">Доступ к file:// не нужен</text><text x="25" y="220" class="s">Инкогнито не требуется</text></g>
<g transform="translate(430,90)"><rect width="340" height="250" rx="18" class="c"/><text x="25" y="40" class="t">TESSA</text><text x="25" y="78" class="s">Есть доступ к матрице</text><text x="25" y="110" class="s">Есть права на корректировку</text><text x="25" y="142" class="s">Матрица доступна для редактирования</text><text x="25" y="190" class="s">Скрипт не расширяет права</text><text x="25" y="220" class="s">И не обходит проверки TESSA</text></g>
<g transform="translate(810,90)"><rect width="340" height="250" rx="18" class="c"/><text x="25" y="40" class="t">Скрипт</text><text x="25" y="78" class="s">@grant none</text><text x="25" y="110" class="s">Работает на TESSA-доменах</text><text x="25" y="142" class="s">Excel обрабатывается локально</text><text x="25" y="190" class="s">Перед записью строится preview</text><text x="25" y="220" class="s">Опасные случаи блокируются</text></g>
</svg>
