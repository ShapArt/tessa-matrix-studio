<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" rx="26" fill="#f7f7f8"/>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#202124}.sub{font:17px Arial,sans-serif;fill:#5f6368}
    .hdr{font:700 16px Arial,sans-serif;fill:#fff}.cell{font:15px Arial,sans-serif;fill:#292929}
    .rownum{font:14px Arial,sans-serif;fill:#6d6d6d}.tag{font:700 14px Arial,sans-serif}
  </style>
  <text x="50" y="52" class="title">Пример работы с выгрузкой Excel</text>
  <text x="50" y="82" class="sub">Меняем только пользовательские значения. Скрытые технические поля и дополнительные листы не редактируем.</text>

  <g transform="translate(50,120)">
    <rect width="1300" height="52" rx="10" fill="#e31e24"/>
    <text x="62" y="33" class="hdr">Строка</text>
    <text x="145" y="33" class="hdr">Вид ОРД</text>
    <text x="315" y="33" class="hdr">Сегмент</text>
    <text x="540" y="33" class="hdr">Организация ГЧ</text>
    <text x="840" y="33" class="hdr">Доп. эксперт</text>
    <text x="1050" y="33" class="hdr">Подписание</text>

    <rect y="52" width="1300" height="58" fill="#fff" stroke="#dedede"/>
    <text x="82" y="88" class="rownum">51</text><text x="145" y="88" class="cell">ОРД</text><text x="315" y="88" class="cell">Птицепереработка</text><text x="540" y="88" class="cell">ООО «Компания А»</text><text x="840" y="88" class="cell">Иванов И.И.</text><text x="1050" y="88" class="cell">Петров П.П.</text>

    <rect y="110" width="1300" height="58" fill="#fff7e8" stroke="#e5bd68"/>
    <rect x="2" y="112" width="8" height="54" rx="4" fill="#e5a82a"/>
    <text x="82" y="146" class="rownum">52</text><text x="145" y="146" class="cell">ОРД</text><text x="315" y="146" class="cell">Птицепереработка</text><text x="540" y="146" class="cell">ООО «Компания Б»</text><text x="840" y="146" class="cell">Сидоров С.С.</text><text x="1050" y="146" class="cell">Кузнецова К.К.</text>
    <rect x="1165" y="122" width="118" height="32" rx="16" fill="#fff" stroke="#e5bd68"/><text x="1182" y="144" class="tag" fill="#8b6408">ИЗМЕНЕНО</text>

    <rect y="168" width="1300" height="58" fill="#eaf7ef" stroke="#9bd0ad"/>
    <rect x="2" y="170" width="8" height="54" rx="4" fill="#2f9e5a"/>
    <text x="82" y="204" class="rownum">53</text><text x="145" y="204" class="cell">ОРД</text><text x="315" y="204" class="cell">Агро</text><text x="540" y="204" class="cell">ООО «Новая компания»</text><text x="840" y="204" class="cell">Орлов О.О.</text><text x="1050" y="204" class="cell">Смирнова С.С.</text>
    <rect x="1175" y="180" width="108" height="32" rx="16" fill="#fff" stroke="#9bd0ad"/><text x="1190" y="202" class="tag" fill="#237a45">НОВАЯ</text>
  </g>

  <g transform="translate(50,410)">
    <rect width="400" height="135" rx="18" fill="#fff" stroke="#dedede"/>
    <text x="25" y="37" class="title" style="font-size:20px">1. Изменить</text>
    <text x="25" y="70" class="sub">Правьте нужные ячейки</text>
    <text x="25" y="96" class="sub">в существующей строке.</text>

    <rect x="450" width="400" height="135" rx="18" fill="#fff" stroke="#dedede"/>
    <text x="475" y="37" class="title" style="font-size:20px">2. Добавить</text>
    <text x="475" y="70" class="sub">Вставляйте копию только</text>
    <text x="475" y="96" class="sub">в новую свободную строку.</text>

    <rect x="900" width="400" height="135" rx="18" fill="#fff" stroke="#dedede"/>
    <text x="925" y="37" class="title" style="font-size:20px">3. Проверить</text>
    <text x="925" y="70" class="sub">Перед Apply проверьте diff</text>
    <text x="925" y="96" class="sub">и все итоговые счётчики.</text>
  </g>
</svg>
