<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <style>
    .bg{fill:#f5f6f8}.panel{fill:white;stroke:#d9dce1;stroke-width:1}.line{stroke:#e3e5e8;stroke-width:1}
    .title{font:600 24px Arial,sans-serif;fill:#20242a}.sub{font:16px Arial,sans-serif;fill:#7d828a}
    .status{font:600 18px Arial,sans-serif;fill:#237548}.text{font:17px Arial,sans-serif;fill:#6e747c}.section{font:600 18px Arial,sans-serif;fill:#2d3137}.label{font:18px Arial,sans-serif;fill:#343941}
    .btn{fill:#fff;stroke:#d4d7dc;stroke-width:1}.btnp{fill:#eb8c96}.btnt{font:600 17px Arial,sans-serif;fill:#242930}.btnpt{font:600 17px Arial,sans-serif;fill:white}
    .arrow{font:18px Arial,sans-serif;fill:#2f343a}.muted{font:16px Arial,sans-serif;fill:#7b8087}
  </style>
  <rect class="bg" width="900" height="720"/>
  <rect class="panel" x="40" y="18" width="820" height="682" rx="12"/>
  <circle cx="74" cy="58" r="18" fill="#df2434"/><path d="M65 53c8-9 12 1 8 7 10-8 16-1 10 6-8 8-17 1-17-7-7 5-11-1-1-6z" fill="white" opacity=".95"/>
  <text class="title" x="108" y="53">TESSA Matrix Studio</text>
  <text class="sub" x="108" y="77">Excel-редактор матриц · v1.13.0</text>
  <text class="title" x="786" y="62">?</text><text class="title" x="833" y="62">×</text>
  <line class="line" x1="40" y1="98" x2="860" y2="98"/>

  <text class="status" x="58" y="143">Матрица готова</text>
  <text class="text" x="58" y="171">Можно работать с Excel.</text>
  <line class="line" x1="58" y1="194" x2="842" y2="194"/>
  <text class="arrow" x="58" y="224">▶ Перед началом работы</text>

  <text class="section" x="58" y="267">1 · Файл для редактирования</text>
  <rect class="btn" x="58" y="286" width="146" height="48" rx="9"/><text class="btnt" x="76" y="316">Скачать Excel</text>
  <rect class="btn" x="216" y="286" width="182" height="48" rx="9"/><text class="btnt" x="235" y="316">Собрать значения</text>
  <line class="line" x1="58" y1="354" x2="842" y2="354"/>

  <text class="section" x="58" y="395">2 · Изменённый файл</text>
  <rect class="btn" x="58" y="414" width="145" height="48" rx="9"/><text class="btnt" x="77" y="444">Выбрать Excel</text>
  <text class="muted" x="58" y="486">Файл не выбран</text>
  <line class="line" x1="58" y1="508" x2="842" y2="508"/>

  <text class="arrow" x="58" y="545">▶ Дополнительно</text>
  <line class="line" x1="58" y1="568" x2="842" y2="568"/>
  <text class="section" x="58" y="612">3 · Проверка</text>
  <rect class="btnp" x="58" y="632" width="228" height="50" rx="10"/><text class="btnpt" x="76" y="664">Проверить изменения</text>
</svg>
